name: PAYOFF-B Japan multispecies phenology source census

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-japan-multitaxon-phenology-census-20261114
    paths:
      - "scripts/payoff_b_japan_phenology_source_census.py"
      - "tests/test_payoff_b_japan_phenology_source_census.py"
      - "tests/test_japan_phenology_panel.py"
      - "src/japan_phenology_panel.py"
      - ".github/workflows/payoff-b-japan-phenology-source-census.yml"
  pull_request:
    paths:
      - "scripts/payoff_b_japan_phenology_source_census.py"
      - "tests/test_payoff_b_japan_phenology_source_census.py"
      - "tests/test_japan_phenology_panel.py"
      - "src/japan_phenology_panel.py"
      - ".github/workflows/payoff-b-japan-phenology-source-census.yml"

permissions:
  contents: read

concurrency:
  group: payoff-b-japan-phenology-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify offline source-census invariants
        run: python -m pytest -q tests/test_payoff_b_japan_phenology_source_census.py tests/test_japan_phenology_panel.py
      - name: Read JMA public all-species archive and publish schema receipt only
        run: python scripts/payoff_b_japan_phenology_source_census.py --output outputs/japan_phenology/jma_archive_inventory.json
      - name: Upload schema-only audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-japan-jma-phenology-schema-census
          path: outputs/japan_phenology/jma_archive_inventory.json
          if-no-files-found: warn
