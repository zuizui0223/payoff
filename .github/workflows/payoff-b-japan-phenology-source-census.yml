permissions:
  contents: read

concurrency:
  group: payoff-b-japan-phenology-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  source-census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify offline source-census invariants
        run: python -m pytest -q tests/test_payoff_b_japan_phenology_source_census.py tests/test_japan_phenology_panel.py tests/test_japan_phenology_environment_gate.py tests/test_payoff_b_jma_station_metadata_source_probe.py tests/test_japan_phenology_biomass_bridge.py tests/test_japan_phenology_jma_multivariate.py tests/test_payoff_b_jma_station_id_overlap_audit.py tests/test_japan_phenology_smaster_temporal.py tests/test_japan_phenology_cross_taxon.py tests/test_japan_phenology_coupling_robustness.py tests/test_japan_phenology_rm_sensitivity.py tests/test_japan_phenology_event_definition_audit.py tests/test_japan_phenology_spring_stage_matched.py tests/test_japan_phenology_jma_daily_import.py tests/test_japan_phenology_jma_homogeneity.py tests/test_payoff_b_jma_single_month_real_weather_probe.py tests/test_payoff_b_jma_tokyo_real_alignment.py tests/test_japan_phenology_interannual_mismatch.py tests/test_japan_phenology_fixed_interannual.py tests/test_japan_phenology_fixed_cross_contrast.py tests/test_japan_phenology_independent_reference.py tests/test_japan_phenology_plant_split_randomization.py tests/test_japan_phenology_plant_common_support.py tests/test_japan_phenology_reference_site_factorial.py tests/test_payoff_b_jma_tokyo_multiyear_weather_pilot.py
      - name: Read JMA public all-species archive and publish schema receipt only
        run: python scripts/payoff_b_japan_phenology_source_census.py --output outputs/japan_phenology/jma_archive_inventory.json
      - name: Audit official JMA station metadata history ZIP
        run: python scripts/payoff_b_jma_station_metadata_source_probe.py --output outputs/japan_phenology/jma_station_metadata_source_receipt.json
      - name: Compare original phenology and smaster station IDs
        run: python scripts/payoff_b_jma_station_id_overlap_audit.py --output outputs/japan_phenology/jma_station_id_overlap_receipt.json
      - name: Audit 160367 event dates against official temporal station metadata
        run: python scripts/payoff_b_jma_temporal_station_join_audit.py --output outputs/japan_phenology/jma_temporal_station_join_receipt.json
      - name: Analyze original JMA cross-taxon event anomalies
        run: python scripts/payoff_b_jma_cross_taxon_original_data.py --output outputs/japan_phenology/jma_cross_taxon_anomaly_receipt.json
      - name: Probe one original JMA daily weather month (no bulk scraping)
        run: python scripts/payoff_b_jma_single_month_real_weather_probe.py --output outputs/japan_phenology/jma_one_month_real_weather_source_probe.json
      - name: Align original Tokyo 2020 phenology with one-month measured weather
        run: python scripts/payoff_b_jma_tokyo_2020_real_weather_phenology_alignment.py --output outputs/japan_phenology/jma_tokyo_2020_real_weather_phenology_alignment.json
      - name: Acquire bounded Tokyo 2019-2021 March-April official daily meteorology
        run: python scripts/payoff_b_jma_tokyo_multiyear_weather_pilot.py --output outputs/japan_phenology/jma_tokyo_multiyear_weather_pilot.json
      - name: Upload schema-only audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-japan-jma-phenology-schema-census
          path: |
            outputs/japan_phenology/jma_archive_inventory.json
            outputs/japan_phenology/jma_station_metadata_source_receipt.json
            outputs/japan_phenology/jma_station_id_overlap_receipt.json
            outputs/japan_phenology/jma_temporal_station_join_receipt.json
            outputs/japan_phenology/jma_cross_taxon_anomaly_receipt.json
            outputs/japan_phenology/jma_one_month_real_weather_source_probe.json
            outputs/japan_phenology/jma_tokyo_2020_real_weather_phenology_alignment.json
            outputs/japan_phenology/jma_tokyo_multiyear_weather_pilot.json
          if-no-files-found: warn
