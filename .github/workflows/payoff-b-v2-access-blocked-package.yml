name: PAYOFF-B V2 ACCESS_BLOCKED package
# Rebuild marker: PR201 manuscript generation 2026-09-28

concurrency:
  group: payoff-b-v2-access-blocked-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - decision/payoff-b-v2-activate-access-blocked-20260928
    paths:
      - "data/aikens2022_access_blocked_submission_state_20260928.json"
      - "scripts/render_aikens_lambda_manuscript.py"
      - "scripts/build_payoff_b_v2_geb_outcome_package.py"
      - "scripts/build_payoff_b_v2_reviewer_archive.py"
      - "tests/test_payoff_b_v2_geb_outcome_package.py"
      - "submission/GEB_V2_*ACCESS_BLOCKED*"
      - ".github/workflows/payoff-b-v2-access-blocked-package.yml"
  pull_request:
    paths:
      - "data/aikens2022_access_blocked_submission_state_20260928.json"
      - "scripts/render_aikens_lambda_manuscript.py"
      - "scripts/build_payoff_b_v2_geb_outcome_package.py"
      - "scripts/build_payoff_b_v2_reviewer_archive.py"
      - "tests/test_payoff_b_v2_geb_outcome_package.py"
      - "submission/GEB_V2_*ACCESS_BLOCKED*"
      - ".github/workflows/payoff-b-v2-access-blocked-package.yml"

jobs:
  access-blocked-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package-test dependencies
        run: >
          python -m pip install --disable-pip-version-check
          pytest
      - name: Run ACCESS_BLOCKED package tests
        run: >
          pytest -q
          tests/test_payoff_b_v2_geb_outcome_package.py
          tests/test_payoff_b_v2_reviewer_archive.py
      - name: Build ACCESS_BLOCKED GEB package
        run: >
          python scripts/build_payoff_b_v2_geb_outcome_package.py
          --result-json data/aikens2022_access_blocked_submission_state_20260928.json
          --output-dir outputs/payoff_b_v2_geb_access_blocked
          --zip outputs/PAYOFF_B_V2_GEB_ACCESS_BLOCKED_PACKAGE.zip
      - name: Build ACCESS_BLOCKED anonymous reviewer archive
        run: >
          python scripts/build_payoff_b_v2_reviewer_archive.py
          --result-json data/aikens2022_access_blocked_submission_state_20260928.json
          --output-dir outputs/payoff_b_v2_access_blocked_review
          --zip outputs/PAYOFF_B_V2_ACCESS_BLOCKED_REVIEW.zip
      - name: Verify activated access state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path(
                  "outputs/payoff_b_v2_geb_access_blocked/"
                  "GEB_V2_OUTCOME_PACKAGE_MANIFEST.json"
              ).read_text(encoding="utf-8")
          )
          claim = json.loads(
              Path(
                  "outputs/payoff_b_v2_geb_access_blocked/"
                  "GEB_V2_AIKENS_CLAIM_STATE.json"
              ).read_text(encoding="utf-8")
          )
          assert manifest["scientific_result"] == "ACCESS_BLOCKED"
          assert manifest["scientific_state"] == "OUTCOME_RENDERED_ACCESS_BLOCKED"
          assert manifest["access_blocked_author_decision_frozen"] is True
          assert manifest["final_science_blocker"] is None
          assert manifest["registered_result_frozen"] is False
          assert manifest["registered_scientific_result_available"] is False
          assert manifest["aikens_outcome_opened"] is False
          assert claim["author_decision_frozen"] is True
          assert claim["future_authenticated_execution_permitted"] is True
          assert claim["original_registration_remains_binding"] is True
          print("ACCESS_BLOCKED_ACTIVATION_OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v2-access-blocked-submission
          path: |
            outputs/PAYOFF_B_V2_GEB_ACCESS_BLOCKED_PACKAGE.zip
            outputs/payoff_b_v2_geb_access_blocked
            outputs/PAYOFF_B_V2_ACCESS_BLOCKED_REVIEW.zip
            outputs/PAYOFF_B_V2_ANON_REVIEW_ARCHIVE_RECEIPT.json
            outputs/payoff_b_v2_access_blocked_review/PAYOFF_B_V2_ANON_REVIEW_MANIFEST.json
          if-no-files-found: error
