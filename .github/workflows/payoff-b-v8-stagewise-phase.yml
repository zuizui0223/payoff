name: payoff-b-v8-stagewise-phase

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_stagewise_phase_transition.R"
      - ".github/workflows/payoff-b-v8-stagewise-phase.yml"

jobs:
  stagewise-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run stagewise population-phase transition diagnostic
        run: Rscript analysis/movement_phenology/payoff_b_v8_stagewise_phase_transition.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-stagewise-phase
          path: |
            outputs/payoff_b_v8_stagewise_phase_year_rows.csv
            outputs/payoff_b_v8_stagewise_phase_units.csv
            outputs/payoff_b_v8_stagewise_phase_pairs.csv
            outputs/payoff_b_v8_stagewise_phase_species.csv
            outputs/payoff_b_v8_stagewise_phase_summary.csv
          if-no-files-found: error
