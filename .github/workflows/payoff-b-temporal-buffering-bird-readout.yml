name: PAYOFF-B temporal-buffering bird holdout readout

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-temporal-buffering-bird-holdout-20260925
    paths:
      - 'data/payoff_b_temporal_buffering_bird_preflight_receipt_20260925.json'

jobs:
  readout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true
      - name: Require frozen preflight receipt
        run: |
          test -s data/payoff_b_temporal_buffering_bird_preflight_receipt_20260925.json
          grep -q '"outcome_columns_inspected": false' data/payoff_b_temporal_buffering_bird_preflight_receipt_20260925.json
      - name: Check R dependency
        run: Rscript -e 'stopifnot(requireNamespace("mgcv", quietly=TRUE)); packageVersion("mgcv")'
      - name: Download pinned Amaral source
        run: |
          mkdir -p external/amaral_2025/data
          curl --fail --location --retry 3             https://raw.githubusercontent.com/br-amaral/BirdMigrationSpeed/62c58d77c2028bd863dfe3697b0d9cf29ceaeab0/data/final.rds             --output external/amaral_2025/data/final.rds
          test -s external/amaral_2025/data/final.rds
          sha256sum external/amaral_2025/data/final.rds
      - name: Execute frozen split-sample readout
        run: Rscript analysis/movement_phenology/temporal_buffering_bird_holdout.R
      - name: Print registered result receipt
        run: |
          cat outputs/temporal_buffering_bird_holdout/temporal_buffering_bird_holdout_result.json
          cat outputs/temporal_buffering_bird_holdout/temporal_buffering_holdout_primary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-temporal-buffering-bird-holdout
          path: outputs/temporal_buffering_bird_holdout
          if-no-files-found: error
