name: payoff-b-asymmetric-fitness-controller

on:
  push:
    branches:
      - analysis/payoff-b-fitness-asymmetry-control-20261008
    paths:
      - 'src/asymmetric_phase_fitness_controller.py'
      - 'tests/test_asymmetric_phase_fitness_controller.py'
      - '.github/workflows/payoff-b-asymmetric-fitness-controller.yml'
  pull_request:
    paths:
      - 'src/asymmetric_phase_fitness_controller.py'
      - 'tests/test_asymmetric_phase_fitness_controller.py'
      - '.github/workflows/payoff-b-asymmetric-fitness-controller.yml'

jobs:
  asymmetric-payoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Check asymmetric risk model and ecological boundaries
        run: python -m pytest -q tests/test_asymmetric_phase_fitness_controller.py
