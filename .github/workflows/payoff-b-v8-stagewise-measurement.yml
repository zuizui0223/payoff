name: payoff-b-v8-stagewise-measurement

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_stagewise_measurement_uncertainty.R"
      - ".github/workflows/payoff-b-v8-stagewise-measurement.yml"

jobs:
  stagewise-measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run stagewise measurement-uncertainty audit
        run: Rscript analysis/movement_phenology/payoff_b_v8_stagewise_measurement_uncertainty.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-stagewise-measurement
          path: |
            outputs/payoff_b_v8_stagewise_measurement_baseline_units.csv
            outputs/payoff_b_v8_stagewise_measurement_weighted_units.csv
            outputs/payoff_b_v8_stagewise_measurement_summary.csv
            outputs/payoff_b_v8_stagewise_measurement_mc_summary.csv
            outputs/payoff_b_v8_stagewise_measurement_mc_draws.csv
          if-no-files-found: error
