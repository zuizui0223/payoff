name: PAYOFF-B NEON original CSV bounded probe
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-neon-original-manifest-probe-20261115
    paths:
      - "scripts/payoff_b_neon_original_csv_probe.py"
      - "tests/test_payoff_b_neon_original_csv_probe.py"
      - ".github/workflows/payoff-b-neon-original-csv-probe.yml"
  pull_request:
    paths:
      - "scripts/payoff_b_neon_original_csv_probe.py"
      - "tests/test_payoff_b_neon_original_csv_probe.py"
      - ".github/workflows/payoff-b-neon-original-csv-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_payoff_b_neon_original_csv_probe.py
      - name: Inspect original NEON manifests and bounded CSV
        run: python scripts/payoff_b_neon_original_csv_probe.py --output outputs/neon/original_csv_probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-neon-original-csv-probe
          path: outputs/neon/original_csv_probe.json
          if-no-files-found: warn
