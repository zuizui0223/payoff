name: PAYOFF-B cross-system source probe

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/payoff-b-cross-system-information.yml'
      - 'data/payoff_b_cross_system_empirical_contract_20260928.json'
      - 'scripts/payoff_b_cross_system_information.py'
      - 'tests/test_payoff_b_cross_system_information.py'
  push:
    branches:
      - analysis/payoff-b-cross-system-information-20260928
    paths:
      - '.github/workflows/payoff-b-cross-system-information.yml'
      - 'data/payoff_b_cross_system_empirical_contract_20260928.json'
      - 'scripts/payoff_b_cross_system_information.py'
      - 'tests/test_payoff_b_cross_system_information.py'

permissions:
  contents: read

jobs:
  cross-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy statsmodels requests
      - name: Acquire open sources and inspect schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/cross_system/source
          curl -fL --retry 4 --retry-all-errors \
            'https://zenodo.org/records/4970634/files/Usui_et_al_2016_metadata_dryad.csv?download=1' \
            -o outputs/cross_system/source/usui.csv
          curl -fL --retry 4 --retry-all-errors \
            'https://zenodo.org/records/6285423/files/rnd_eff_temp.csv?download=1' \
            -o outputs/cross_system/source/freimuth_temp.csv
          sha256sum outputs/cross_system/source/*.csv | tee outputs/cross_system/sha256.txt
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          out={}
          for name in ['usui','freimuth_temp']:
              p=Path(f'outputs/cross_system/source/{name}.csv')
              df=pd.read_csv(p)
              out[name]={
                  'rows':len(df),
                  'columns':list(df.columns),
                  'head':df.head(3).where(pd.notna(df),None).to_dict(orient='records'),
                  'unique_small':{c:sorted(map(str,df[c].dropna().unique()))[:30] for c in df.columns if df[c].nunique(dropna=True)<=30},
              }
          Path('outputs/cross_system/schema_probe.json').write_text(json.dumps(out,indent=2,default=str)+'\\n')
          print(json.dumps(out,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-cross-system-source-probe
          path: |
            outputs/cross_system/schema_probe.json
            outputs/cross_system/sha256.txt
