name: PAYOFF-B cross-system information-distance analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/payoff-b-cross-system-information.yml'
      - 'data/payoff_b_cross_system_empirical_contract_20260928.json'
      - 'scripts/payoff_b_cross_system_information.py'
      - 'tests/test_payoff_b_cross_system_information.py'
  push:
    branches:
      - analysis/payoff-b-cross-system-information-20260928
    paths:
      - '.github/workflows/payoff-b-cross-system-information.yml'
      - 'data/payoff_b_cross_system_empirical_contract_20260928.json'
      - 'scripts/payoff_b_cross_system_information.py'
      - 'tests/test_payoff_b_cross_system_information.py'

permissions:
  contents: read

jobs:
  cross-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy requests
      - name: Restore GBIF taxonomy cache
        uses: actions/cache@v4
        with:
          path: outputs/cross_system/cache/freimuth_taxonomy.csv
          key: payoff-b-freimuth-taxonomy-946f56b8-v1
      - name: Acquire frozen CC0 source bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/cross_system/source outputs/cross_system/cache
          curl -fL --retry 4 --retry-all-errors \
            'https://zenodo.org/records/4970634/files/Usui_et_al_2016_metadata_dryad.csv?download=1' \
            -o outputs/cross_system/source/usui.csv
          curl -fL --retry 4 --retry-all-errors \
            'https://zenodo.org/records/6285423/files/rnd_eff_temp.csv?download=1' \
            -o outputs/cross_system/source/freimuth_temp.csv
          sha256sum outputs/cross_system/source/*.csv | tee outputs/cross_system/sha256.txt
      - name: Run registered cross-system analysis
        run: |
          python scripts/payoff_b_cross_system_information.py \
            --usui outputs/cross_system/source/usui.csv \
            --freimuth outputs/cross_system/source/freimuth_temp.csv \
            --taxonomy-cache outputs/cross_system/cache/freimuth_taxonomy.csv \
            --taxonomy-output outputs/cross_system/cache/freimuth_taxonomy.csv \
            --bird-rows-output outputs/cross_system/bird_temperature_short_long_rows.csv \
            --freimuth-summary-output outputs/cross_system/freimuth_temperature_group_summary.csv \
            --result-output outputs/cross_system/result.json
      - name: Print promotion diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/cross_system/result.json').read_text())
          print('BIRD_PRIMARY', json.dumps(x['bird_meta_regression']['ivw_adjusted']['long_minus_short'], sort_keys=True))
          print('BIRD_SENSITIVITY_CAP99', json.dumps(x['bird_meta_regression']['ivw_adjusted_weightcap99']['long_minus_short'], sort_keys=True))
          print('BIRD_SENSITIVITY_UNWEIGHTED', json.dumps(x['bird_meta_regression']['unweighted_adjusted']['long_minus_short'], sort_keys=True))
          print('BIRD_LOO_STUDY', json.dumps({k:v for k,v in x['bird_meta_regression']['leave_one_study_out'].items() if k != 'fits'}, sort_keys=True))
          print('FREIMUTH_REPRO_PASS', x['freimuth_local_benchmark']['all_group_count_and_mean_checks_pass'])
          print('FREIMUTH_UNRESOLVED', x['freimuth_local_benchmark']['taxonomy_unresolved'])
          print(json.dumps(x['freimuth_local_benchmark']['groups'], indent=2))
          import pandas as pd
          tax=pd.read_csv('outputs/cross_system/cache/freimuth_taxonomy.csv')
          print('UNRESOLVED_TAXA', tax.loc[tax['payoff_group'].eq('Unresolved'), ['species','kingdom','order','scientificName','matchType','confidence']].to_json(orient='records'))
          PY
      - name: Remove raw source bytes before artifact upload
        run: rm -rf outputs/cross_system/source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-cross-system-information-distance
          path: |
            outputs/cross_system/result.json
            outputs/cross_system/sha256.txt
            outputs/cross_system/bird_temperature_short_long_rows.csv
            outputs/cross_system/freimuth_temperature_group_summary.csv
            outputs/cross_system/cache/freimuth_taxonomy.csv
