name: PAYOFF-B interaction buffering small-source gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/payoff-b-interaction-buffering-small-source.yml'
      - 'scripts/payoff_b_interaction_buffering_small_dryad_gate_20261125.py'
      - 'tests/test_payoff_b_interaction_buffering_small_dryad_gate.py'
  push:
    branches: [analysis/payoff-b-interaction-buffering-meta-20261125]
    paths:
      - '.github/workflows/payoff-b-interaction-buffering-small-source.yml'
      - 'scripts/payoff_b_interaction_buffering_small_dryad_gate_20261125.py'
      - 'tests/test_payoff_b_interaction_buffering_small_dryad_gate.py'
permissions:
  contents: read
jobs:
  source-gate:
    if: github.event_name == 'push' || github.head_ref == 'analysis/payoff-b-interaction-buffering-meta-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl pytest
      - run: python -m pytest -q tests/test_payoff_b_interaction_buffering_small_dryad_gate.py
      - run: python scripts/payoff_b_interaction_buffering_small_dryad_gate_20261125.py --output outputs/payoff_b_buffering_small_source_receipt.json
      - name: Publish aggregate source receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-buffering-small-source-receipt
          path: outputs/payoff_b_buffering_small_source_receipt.json
          if-no-files-found: warn
