name: PAYOFF-B 2023 README-corrected fitness outcomes
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-readme-corrected-outcomes-20261115
    paths:
      - "scripts/payoff_b_2023_readme_corrected_outcomes.py"
      - ".github/workflows/payoff-b-2023-readme-corrected.yml"
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl numpy
      - run: python -m scripts.payoff_b_2023_readme_corrected_outcomes --output outputs/dryad/2023_readme_corrected_outcomes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-2023-readme-corrected-outcomes
          path: outputs/dryad/2023_readme_corrected_outcomes.json
          if-no-files-found: warn
