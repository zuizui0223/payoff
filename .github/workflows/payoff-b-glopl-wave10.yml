name: PAYOFF-B GloPL wave 10 pair disposition
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/payoff-b-glopl-wave10.yml'
      - 'scripts/payoff_b_glopl_wave10_complete_pair_disposition_20261125.py'
permissions:
  contents: read
jobs:
  audit:
    if: github.head_ref == 'analysis/payoff-b-interaction-buffering-meta-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: python scripts/payoff_b_glopl_wave10_complete_pair_disposition_20261125.py outputs/payoff_b_glopl_wave10.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-glopl-wave10
          path: outputs/payoff_b_glopl_wave10.json
          if-no-files-found: warn
