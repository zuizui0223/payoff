name: payoff-b-riskset-predecision-northwind-solar
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/audit_payoff_b_riskday_directional_weather.py"
      - "tests/test_payoff_b_riskday_directional_weather.py"
      - "docs/PAYOFF_B_DIRECTIONAL_WEATHER_LOCK_20261022.md"
      - ".github/workflows/payoff-b-riskday-directional-weather.yml"
jobs:
  directional-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        system: [stork, white_fronted_goose, curlew]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test directional wind, solar, chronology and grouped output
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_riskday_directional_weather.py
      - name: Requery exactly the locked 144 source risk days for V10M and solar
        run: |
          python -m scripts.audit_payoff_b_riskday_directional_weather --system ${{ matrix.system }} --out outputs/payoff_b_directional
      - name: Archive only aggregate source meteorological summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-directional-weather-${{ matrix.system }}
          path: outputs/payoff_b_directional/
          if-no-files-found: warn
