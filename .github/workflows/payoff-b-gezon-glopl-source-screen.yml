name: PAYOFF-B Gezon and GloPL source-frame screen
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/payoff-b-gezon-glopl-source-screen.yml'
      - 'scripts/payoff_b_gezon_glopl_source_screen_20261125.py'
permissions:
  contents: read
jobs:
  source-frame:
    if: github.head_ref == 'analysis/payoff-b-interaction-buffering-meta-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: python scripts/payoff_b_gezon_glopl_source_screen_20261125.py outputs/payoff_b_gezon_glopl_source_screen.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-gezon-glopl-source-frame
          path: outputs/payoff_b_gezon_glopl_source_screen.json
          if-no-files-found: warn
