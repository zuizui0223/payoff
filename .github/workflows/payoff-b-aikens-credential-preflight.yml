name: payoff-b Aikens credential preflight

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/payoff-b-aikens-credential-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check credential presence without network access
        env:
          APPEEARS_TOKEN: ${{ secrets.APPEEARS_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          mkdir -p outputs
          if [ -n "${APPEEARS_TOKEN}" ]; then
            CONFIGURED=true
            ROUTE=token
          elif [ -n "${EARTHDATA_USERNAME}" ] && [ -n "${EARTHDATA_PASSWORD}" ]; then
            CONFIGURED=true
            ROUTE=username_password
          else
            CONFIGURED=false
            ROUTE=none
          fi
          CONFIGURED="${CONFIGURED}" ROUTE="${ROUTE}" python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = {
              "status": "CONFIGURED" if os.environ["CONFIGURED"] == "true" else "NOT_CONFIGURED",
              "configured": os.environ["CONFIGURED"] == "true",
              "credential_route": os.environ["ROUTE"],
              "credential_values_recorded": False,
              "network_submission_performed": False,
              "environmental_values_opened": False,
              "lambda_outcome_opened": False,
          }
          Path("outputs/aikens_credential_preflight.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "Aikens credential preflight: "
              + ("configured" if payload["configured"] else "not configured")
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-aikens-credential-preflight
          path: outputs/aikens_credential_preflight.json
          if-no-files-found: error
