name: PAYOFF-B social-cue Dryad source admission

on:
  push:
    branches:
      - analysis/payoff-b-social-info-source-admission-20261011
    paths:
      - "data/payoff_b_social_cue_source_manifest_20261011.json"
      - "scripts/payoff_b_social_cue_source_audit.py"
      - "tests/test_payoff_b_social_cue_source_audit.py"
      - ".github/workflows/payoff-b-social-cue-source-gate.yml"
  pull_request:
    paths:
      - "data/payoff_b_social_cue_source_manifest_20261011.json"
      - "scripts/payoff_b_social_cue_source_audit.py"
      - "tests/test_payoff_b_social_cue_source_audit.py"
      - ".github/workflows/payoff-b-social-cue-source-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install network-free source-audit test runner
        run: python -m pip install "pytest>=8,<10"
      - name: Verify outcome firewall and manifest schema
        run: python -m pytest -q tests/test_payoff_b_social_cue_source_audit.py
      - name: Download only seven registered public Dryad sources and inspect schemas
        id: audit
        continue-on-error: true
        run: |
          python scripts/payoff_b_social_cue_source_audit.py \
            --manifest data/payoff_b_social_cue_source_manifest_20261011.json \
            --output "$RUNNER_TEMP/payoff_b_social_cue_source_only_receipt.json" \
            --timeout 35
      - name: Upload metadata/sha receipt only (no raw study outcomes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-social-cue-source-only
          path: ${{ runner.temp }}/payoff_b_social_cue_source_only_receipt.json
          if-no-files-found: error
      - name: Fail closed if any source is unavailable or invalid
        if: steps.audit.outcome == 'failure'
        run: |
          echo "SOURCE_ACCESS_OR_SCHEMA_BLOCKED; source-only receipt remains available"
          exit 1
