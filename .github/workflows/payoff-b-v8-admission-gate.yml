name: payoff-b-v8-admission-gate

on:
  push:
    branches:
      - feature/payoff-b-v8-admission-gate-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_admission_gate.R"
      - ".github/workflows/payoff-b-v8-admission-gate.yml"
      - "docs/PAYOFF_B_V8_PREDICTIVE_CONNECTIVITY_DEGRADATION_CONTRACT_20261005.md"

jobs:
  v8-admission-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run outcome-blind V8 admission gate
        run: Rscript analysis/movement_phenology/payoff_b_v8_admission_gate.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-admission-gate
          path: |
            outputs/payoff_b_v8_admission_gate_summary.csv
            outputs/payoff_b_v8_admission_gate_species.csv
            outputs/payoff_b_v8_admission_gate_pairs.csv
          if-no-files-found: error
