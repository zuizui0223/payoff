name: dryad-reference-panel-probe

on:
  push:
    branches:
      - scratch/dryad-streptomyces-reference-panel-20260911

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Dryad public metadata and workbook
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import json, re, sys, urllib.request
          from pathlib import Path

          DOI = 'doi%3A10.5061%2Fdryad.bnzs7h462'
          API = 'https://datadryad.org/api/v2'
          target_name = 'Data_Dryad_DoL-Zheren_Zhang.xlsx'

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'payoff-reference-panel-audit/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          versions = get_json(f'{API}/datasets/{DOI}/versions?per_page=100')
          rows = versions.get('_embedded', {}).get('stash:versions', [])
          parsed = []
          for d in rows:
              href = d.get('_links', {}).get('self', {}).get('href', '')
              m = re.search(r'/versions/(\d+)$', href)
              if m:
                  parsed.append((int(m.group(1)), d))
          if not parsed:
              print('NO_VERSION_ID_RECOVERED')
              print(json.dumps(versions, indent=2)[:6000])
              sys.exit(0)
          vid, version = max(parsed, key=lambda x: x[0])
          print('SELECTED_VERSION_ID', vid, 'TITLE', version.get('title'))

          files = get_json(f'{API}/versions/{vid}/files?per_page=100')
          rows = files.get('_embedded', {}).get('stash:files', [])
          print('FILE_COUNT', len(rows))
          for r in rows:
              print('FILE_META', r.get('id'), r.get('path'), r.get('size'), r.get('mimeType'))
          row = next((r for r in rows if r.get('path') == target_name), None)
          if row is None:
              print('TARGET_FILE_NOT_FOUND')
              sys.exit(0)

          fid = row.get('id')
          hrefs = []
          for rel in ('stash:download','self'):
              href = row.get('_links', {}).get(rel, {}).get('href')
              if href:
                  hrefs.append(href if href.startswith('http') else 'https://datadryad.org'+href)
          if fid:
              hrefs.extend([
                  f'{API}/files/{fid}/download',
                  f'https://datadryad.org/stash/downloads/file_stream/{fid}',
              ])
          hrefs.append(f'https://datadryad.org/api/v2/versions/{vid}/download')
          hrefs = list(dict.fromkeys(hrefs))
          print('DOWNLOAD_CANDIDATES', hrefs)

          out = Path('/tmp/dryad_payload')
          used = None
          for href in hrefs:
              try:
                  req = urllib.request.Request(href, headers={'User-Agent':'payoff-reference-panel-audit/1.0'})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                      ctype = r.headers.get('Content-Type','')
                  print('DOWNLOAD_ATTEMPT', href, 'BYTES', len(data), 'CTYPE', ctype)
                  if len(data) > 1000 and data[:2] == b'PK':
                      out.write_bytes(data)
                      used = href
                      break
              except Exception as e:
                  print('DOWNLOAD_FAILED', href, type(e).__name__, str(e)[:250])
          if used is None:
              print('PUBLIC_BYTES_NOT_RECOVERED')
              sys.exit(0)
          print('PUBLIC_BYTES_RECOVERED_FROM', used)

          import hashlib, zipfile, openpyxl
          data = out.read_bytes()
          print('PAYLOAD_SHA256', hashlib.sha256(data).hexdigest())
          workbook = out
          if zipfile.is_zipfile(out):
              z = zipfile.ZipFile(out)
              names = z.namelist()
              print('ZIP_MEMBERS', names)
              match = next((n for n in names if n.endswith(target_name)), None)
              if match:
                  workbook = Path('/tmp') / target_name
                  workbook.write_bytes(z.read(match))
              elif len(names) == 1 and names[0].lower().endswith('.xlsx'):
                  workbook = Path('/tmp') / target_name
                  workbook.write_bytes(z.read(names[0]))
              else:
                  print('TARGET_WORKBOOK_NOT_IN_ZIP')
                  sys.exit(0)
          if workbook == out:
              renamed = Path('/tmp') / target_name
              renamed.write_bytes(out.read_bytes())
              workbook = renamed

          print('WORKBOOK_BYTES', workbook.stat().st_size)
          print('WORKBOOK_SHA256', hashlib.sha256(workbook.read_bytes()).hexdigest())
          wb = openpyxl.load_workbook(workbook, read_only=True, data_only=False)
          print('SHEETNAMES', wb.sheetnames)
          keywords = re.compile(r'(delet|mutant|cml|argg|cams|arg[+−-]|genome|chromosome|pfge)', re.I)
          for ws in wb.worksheets:
              print('SHEET', ws.title, 'MAX_ROW', ws.max_row, 'MAX_COL', ws.max_column)
              hits=[]
              for row_cells in ws.iter_rows():
                  vals=[c.value for c in row_cells]
                  text=' | '.join('' if v is None else str(v) for v in vals)
                  if keywords.search(text):
                      hits.append((row_cells[0].row, text[:1200]))
              if hits:
                  print('RELEVANT_HITS', ws.title, 'COUNT', len(hits))
                  for r,text in hits[:120]:
                      print('HIT', ws.title, r, text)
          PY
