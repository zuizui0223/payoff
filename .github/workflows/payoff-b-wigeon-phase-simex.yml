name: payoff-b wigeon phase SIMEX sensitivity

concurrency:
  group: payoff-b-wigeon-phase-simex-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/wigeon_phase_simex_sensitivity_contract_20260923.json'
      - 'src/wigeon_phase_simex.py'
      - 'scripts/run_wigeon_phase_simex_sensitivity.py'
      - 'tests/test_wigeon_phase_simex.py'
      - '.github/workflows/payoff-b-wigeon-phase-simex.yml'

permissions:
  contents: read
  actions: read

jobs:
  simex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SIMEX dependencies
        run: >
          python -m pip install --disable-pip-version-check
          -e ".[test,empirical]" pandas numpy

      - name: Test event-structure SIMEX
        run: >
          pytest -q
          tests/test_wigeon_phase_simex.py

      - name: Download frozen source-faithful wigeon transitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/source
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10678143392/zip" \
            -o outputs/wigeon_source_faithful.zip
          echo "d61afae4a4dcf62f0947c5ec49684aeb4cebad18fabde9b8eb74035fe4326388  outputs/wigeon_source_faithful.zip" | sha256sum -c -
          unzip -q outputs/wigeon_source_faithful.zip \
            stage3_wigeon_controller_transitions.csv \
            -d outputs/source

      - name: Run frozen wigeon SIMEX sensitivity
        run: >
          python scripts/run_wigeon_phase_simex_sensitivity.py
          --transitions outputs/source/stage3_wigeon_controller_transitions.csv
          --contract-json data/wigeon_phase_simex_sensitivity_contract_20260923.json
          --curve-output outputs/wigeon_phase_simex_curve.csv
          --receipt-output outputs/wigeon_phase_simex_receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-wigeon-phase-simex
          path: |
            outputs/wigeon_phase_simex_curve.csv
            outputs/wigeon_phase_simex_receipt.json
            data/wigeon_phase_simex_sensitivity_contract_20260923.json
