name: payoff-b wigeon phase SIMEX sensitivity

concurrency:
  group: payoff-b-wigeon-phase-simex-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/wigeon_phase_simex_sensitivity_contract_20260923.json'
      - 'src/wigeon_phase_simex.py'
      - 'scripts/run_wigeon_phase_simex_sensitivity.py'
      - 'tests/test_wigeon_phase_simex.py'
      - 'data/wigeon_phase_simex_result_20260923.json'
      - '.github/workflows/payoff-b-wigeon-phase-simex.yml'

permissions:
  contents: read
  actions: read

jobs:
  simex:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SIMEX dependencies
        run: >
          python -m pip install --disable-pip-version-check
          -e ".[test,empirical]" pandas numpy

      - name: Test event-structure SIMEX
        run: >
          pytest -q
          tests/test_wigeon_phase_simex.py

      - name: Download frozen source-faithful wigeon transitions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/source
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10678143392/zip" \
            -o outputs/wigeon_source_faithful.zip
          echo "d61afae4a4dcf62f0947c5ec49684aeb4cebad18fabde9b8eb74035fe4326388  outputs/wigeon_source_faithful.zip" | sha256sum -c -
          unzip -q outputs/wigeon_source_faithful.zip \
            stage3_wigeon_controller_transitions.csv \
            -d outputs/source

      - name: Run frozen wigeon SIMEX sensitivity
        run: >
          python scripts/run_wigeon_phase_simex_sensitivity.py
          --transitions outputs/source/stage3_wigeon_controller_transitions.csv
          --contract-json data/wigeon_phase_simex_sensitivity_contract_20260923.json
          --curve-output outputs/wigeon_phase_simex_curve.csv
          --receipt-output outputs/wigeon_phase_simex_receipt.json

      - name: Verify deterministic SIMEX result against frozen provisional receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          observed = json.loads(
              Path("outputs/wigeon_phase_simex_receipt.json").read_text()
          )
          expected = json.loads(
              Path("data/wigeon_phase_simex_result_20260923.json").read_text()
          )

          obs = {
              row["scenario_name"]: row
              for row in observed["results"]
          }
          exp = {
              row["scenario_name"]: row
              for row in expected["results"]
          }
          assert set(obs) == set(exp)
          for name in sorted(exp):
              assert abs(
                  obs[name]["observed_lambda_hat"]
                  - exp[name]["observed_lambda_hat"]
              ) <= 1e-12
              assert abs(
                  obs[name]["simex_extrapolated_lambda_at_minus_one"]
                  - exp[name]["simex_extrapolated_lambda_at_minus_one"]
              ) <= 1e-10
              assert len(obs[name]["zeta_points"]) == len(
                  exp[name]["zeta_points"]
              )
              for got, want in zip(
                  obs[name]["zeta_points"],
                  exp[name]["zeta_points"],
              ):
                  assert got["zeta"] == want["zeta"]
                  assert abs(
                      got["mean_lambda_hat"]
                      - want["mean_lambda_hat"]
                  ) <= 1e-10
          print("WIGEON_SIMEX_FROZEN_RESULT_MATCH")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-wigeon-phase-simex
          path: |
            outputs/wigeon_phase_simex_curve.csv
            outputs/wigeon_phase_simex_receipt.json
            data/wigeon_phase_simex_sensitivity_contract_20260923.json
            data/wigeon_phase_simex_result_20260923.json
