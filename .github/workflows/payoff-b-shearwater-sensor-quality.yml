name: payoff-b-shearwater-treatment-sensor-quality
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_shearwater_sensor_quality.py"
      - "tests/test_payoff_b_shearwater_sensor_quality.py"
      - "docs/PAYOFF_B_SHEARWATER_SENSOR_QC_GATE_20261023.md"
      - ".github/workflows/payoff-b-shearwater-sensor-quality.yml"
jobs:
  sensor-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline synthetic telemetry completeness and repeated-subject tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_shearwater_sensor_quality.py
      - name: Verify treatment arm dependent GPS/Argos coverage and fix gaps
        run: |
          python -m scripts.qc_payoff_b_shearwater_sensor_quality \
            --out outputs/payoff_b_shearwater_sensor_quality
      - name: Archive aggregate sensor-group QC only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-shearwater-telemetry-treatment-QC
          path: outputs/payoff_b_shearwater_sensor_quality/
          if-no-files-found: warn
