name: PAYOFF-B temporal-buffering bird preflight

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-temporal-buffering-bird-holdout-20260925
    paths:
      - 'data/payoff_b_temporal_buffering_bird_holdout_registration_20260925.json'
      - 'docs/PAYOFF_B_TEMPORAL_BUFFERING_BIRD_REGISTRATION_20260925.md'
      - 'analysis/movement_phenology/temporal_buffering_bird_preflight.R'
      - '.github/workflows/payoff-b-temporal-buffering-bird-preflight.yml'
  pull_request:
    paths:
      - 'data/payoff_b_temporal_buffering_bird_holdout_registration_20260925.json'
      - 'docs/PAYOFF_B_TEMPORAL_BUFFERING_BIRD_REGISTRATION_20260925.md'
      - 'analysis/movement_phenology/temporal_buffering_bird_preflight.R'
      - '.github/workflows/payoff-b-temporal-buffering-bird-preflight.yml'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Download pinned Amaral source
        run: |
          mkdir -p external/amaral_2025/data
          curl --fail --location --retry 3             https://raw.githubusercontent.com/br-amaral/BirdMigrationSpeed/62c58d77c2028bd863dfe3697b0d9cf29ceaeab0/data/final.rds             --output external/amaral_2025/data/final.rds
          test -s external/amaral_2025/data/final.rds
          sha256sum external/amaral_2025/data/final.rds
      - name: Run response-blind structural preflight
        run: >-
          Rscript analysis/movement_phenology/temporal_buffering_bird_preflight.R
          outputs/temporal_buffering_bird_preflight.json
      - name: Print structural preflight only
        run: |
          cat outputs/temporal_buffering_bird_preflight.json
          cat outputs/temporal_buffering_bird_preflight_year_counts.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-temporal-buffering-bird-preflight
          path: |
            outputs/temporal_buffering_bird_preflight.json
            outputs/temporal_buffering_bird_preflight_year_counts.csv
            outputs/temporal_buffering_bird_preflight_species_counts.csv
          if-no-files-found: error
