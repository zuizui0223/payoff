name: payoff-b 2d corridor pilot

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-2d-corridor-pilot.yml

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run 2D corridor fragmentation pilot
        run: >
          python scripts/migration_phenology_2d_corridor.py
          --climate-velocities 0.02,0.03,0.04
          --phenology-limits 0,2,4
          --gap-widths 1,3,7,15
          --width 31
          --height 15
          --barrier-x-offset 4
          --patch-spacing 1
          --spatial-gradient 0.20
          --initial-distribution-sd 2
          --initial-total-abundance 400
          --local-carrying-capacity 80
          --density-coefficient 0.30
          --baseline-growth 0.30
          --interaction-strength 0.25
          --migration-cost 0.03
          --phenology-cost 0.03
          --steps 100
          --burn-in 20
          --max-migration-rate 1.0
          --max-phenology-rate 1.0
          --migration-points 5
          --phenology-points 5
          --output outputs/payoff_b_2d_corridor_pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-2d-corridor-pilot
          path: outputs/payoff_b_2d_corridor_pilot.csv
