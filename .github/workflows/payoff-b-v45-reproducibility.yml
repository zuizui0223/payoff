name: payoff-b-v45-reproducibility

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_*.R"
      - "scripts/payoff_b_ortega_variance_funnel.py"
      - "scripts/payoff_b_mule_deer_two_clock_channel.py"
      - "scripts/payoff_b_mule_deer_readiness_source_data.py"
      - "data/payoff_b_*"
      - "scripts/render_payoff_b_v45_main_figures.py"
      - "scripts/build_payoff_b_v45_reproducibility_bundle.py"
      - "tests/test_payoff_b_v45_reproducibility_bundle.py"
      - ".github/workflows/payoff-b-v45-reproducibility.yml"
  workflow_dispatch:

jobs:
  build-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test reproducibility bundle
        run: pytest -q tests/test_payoff_b_v45_reproducibility_bundle.py
      - name: Build reproducibility bundle
        run: |
          python scripts/build_payoff_b_v45_reproducibility_bundle.py \
            --output-dir outputs/payoff_b_v45_reproducibility \
            --zip outputs/payoff_b_v45_reproducibility.zip
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v45-reproducibility
          path: |
            outputs/payoff_b_v45_reproducibility/
            outputs/payoff_b_v45_reproducibility.zip
          if-no-files-found: error
