name: Build PAYOFF-B Theoretical Ecology review package

on:
  workflow_dispatch:
  push:
    paths:
      - 'manuscript/PAYOFF_B_THEORETICAL_ECOLOGY_BRIEF_V1.md'
      - 'theory/EXACT_ANTI_PHASE_OPTIMUM.md'
      - 'theory/WEAK_CONTRAST_UNIVERSAL_MIGRATION_OPTIMUM.md'
      - 'src/anti_phase_temporal.py'
      - 'src/two_patch_floquet.py'
      - 'scripts/build_payoff_b_figures_svg.py'
      - 'scripts/verify_payoff_b_note.py'
      - 'scripts/check_payoff_b_submission.py'
      - 'scripts/format_theoretical_ecology_docx.py'
      - 'tests/test_payoff_b_submission.py'
      - '.github/workflows/build-payoff-b-theoretical-ecology-package.yml'
  pull_request:
    paths:
      - 'manuscript/PAYOFF_B_THEORETICAL_ECOLOGY_BRIEF_V1.md'
      - 'theory/EXACT_ANTI_PHASE_OPTIMUM.md'
      - 'theory/WEAK_CONTRAST_UNIVERSAL_MIGRATION_OPTIMUM.md'
      - 'src/anti_phase_temporal.py'
      - 'src/two_patch_floquet.py'
      - 'scripts/build_payoff_b_figures_svg.py'
      - 'scripts/verify_payoff_b_note.py'
      - 'scripts/check_payoff_b_submission.py'
      - 'scripts/format_theoretical_ecology_docx.py'
      - 'tests/test_payoff_b_submission.py'
      - '.github/workflows/build-payoff-b-theoretical-ecology-package.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install review toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils librsvg2-bin
          python -m pip install --upgrade pip
          python -m pip install pytest python-docx

      - name: Validate manuscript and theorem implementation
        run: |
          python scripts/check_payoff_b_submission.py
          python -m pytest -q tests/test_anti_phase_temporal.py tests/test_payoff_b_submission.py
          python scripts/verify_payoff_b_note.py

      - name: Generate publication figures and review source
        run: |
          GEN=submission/theoretical_ecology/generated
          python scripts/build_payoff_b_figures_svg.py
          mkdir -p "$GEN/figures_png" "$GEN/rendered/pages"
          rsvg-convert "$GEN/figures/FIG1_UNIQUE_OPTIMUM.svg" -o "$GEN/figures_png/FIG1_UNIQUE_OPTIMUM.png"
          rsvg-convert "$GEN/figures/FIG2_SCALING_CURVE.svg" -o "$GEN/figures_png/FIG2_SCALING_CURVE.png"
          python - <<'PY'
          from pathlib import Path
          src = Path('manuscript/PAYOFF_B_THEORETICAL_ECOLOGY_BRIEF_V1.md').read_text(encoding='utf-8')
          src = src.replace(
              'Hence at least one finite positive maximum exists. The issue is uniqueness.',
              'Hence at least one finite positive maximum exists (Fig. 1). The issue is uniqueness.'
          )
          src += '''\n\n## Figure legends\n\n![Figure 1](figures_png/FIG1_UNIQUE_OPTIMUM.png)\n\n**Figure 1. Every nonzero contrast has one finite migration optimum.** Exact dimensionless temporal premium for three environmental contrasts. Open circles mark the unique maximizers. The three curves differ in height and exact optimum but each rises once and falls once.\n\n![Figure 2](figures_png/FIG2_SCALING_CURVE.png)\n\n**Figure 2. One scaling curve links weak and strong contrast.** Exact optimal dimensionless migration `u*(v)=m*τ` as a function of `v=|x|τ`. The optimum tends to 1.606115… under weak contrast and to 1 under strong contrast; the dashed curve shows the first strong-contrast approximation `1+1/v`.\n'''
          out = Path('submission/theoretical_ecology/generated/MANUSCRIPT_REVIEW_SOURCE.md')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(src, encoding='utf-8')
          PY

      - name: Build review DOCX
        run: |
          GEN=submission/theoretical_ecology/generated
          cd "$GEN"
          pandoc MANUSCRIPT_REVIEW_SOURCE.md \
            --from=markdown+tex_math_single_backslash \
            --to=docx \
            --output=PAYOFF_B_REVIEW_RAW.docx
          cd "$GITHUB_WORKSPACE"
          python scripts/format_theoretical_ecology_docx.py \
            "$GEN/PAYOFF_B_REVIEW_RAW.docx" \
            "$GEN/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.docx"
          rm -f "$GEN/PAYOFF_B_REVIEW_RAW.docx"

      - name: Validate DOCX
        run: |
          GEN=submission/theoretical_ecology/generated
          unzip -p "$GEN/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.docx" word/document.xml | grep -q 'w:lnNumType'
          unzip -p "$GEN/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.docx" word/footer1.xml | grep -q ' PAGE '
          MEDIA_COUNT=$(unzip -l "$GEN/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.docx" | grep -c 'word/media/' || true)
          if [ "$MEDIA_COUNT" -lt 2 ]; then
            echo "Expected two embedded figures; found $MEDIA_COUNT" >&2
            exit 1
          fi

      - name: Render review PDF
        run: |
          GEN=submission/theoretical_ecology/generated
          mkdir -p "$GEN/rendered"
          libreoffice --headless --convert-to pdf --outdir "$GEN/rendered" "$GEN/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.docx"

      - name: Validate rendered PDF and record QA
        run: |
          GEN=submission/theoretical_ecology/generated
          PDF="$GEN/rendered/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.pdf"
          TXT="$RUNNER_TEMP/payoff-b.txt"
          test -s "$PDF"
          pdftotext -layout "$PDF" "$TXT"
          grep -q 'Exactly one migration optimum under anti-phase environmental switching' "$TXT"
          grep -q 'The closed-form growth exponent is not claimed as new' "$TXT"
          grep -q 'Benaïm et al. (2023)' "$TXT"
          grep -q '1.6061152988' "$TXT"
          grep -q 'Figure 1' "$TXT"
          grep -q 'Figure 2' "$TXT"
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          if [ "$PAGES" -gt 20 ]; then
            echo "Review manuscript unexpectedly long: $PAGES pages" >&2
            exit 1
          fi
          MEDIA_COUNT=$(unzip -l "$GEN/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.docx" | grep -c 'word/media/' || true)
          {
            echo 'target=Theoretical Ecology Brief Communication'
            echo 'canonical_manuscript=manuscript/PAYOFF_B_THEORETICAL_ECOLOGY_BRIEF_V1.md'
            echo "review_pages=$PAGES"
            echo "embedded_figures=$MEDIA_COUNT"
            echo 'claim=unique_global_migration_optimum_in_symmetric_anti_phase_model'
            echo 'closed_form_novelty_claim=false'
            echo 'numerical_receipt_role=implementation_audit_not_proof'
            echo 'line_numbers=true'
            echo 'page_numbers=true'
          } > "$GEN/PACKAGE_QA_RECEIPT.txt"

      - name: Render page PNGs for visual QA
        run: |
          GEN=submission/theoretical_ecology/generated
          pdftoppm -png -r 120 \
            "$GEN/rendered/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.pdf" \
            "$GEN/rendered/pages/page" >/dev/null 2>&1
          test "$(find "$GEN/rendered/pages" -name 'page-*.png' | wc -l)" -gt 0

      - name: Upload PAYOFF-B review package
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-theoretical-ecology-review-package
          path: |
            submission/theoretical_ecology/generated/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.docx
            submission/theoretical_ecology/generated/rendered/PAYOFF_B_THEORETICAL_ECOLOGY_REVIEW.pdf
            submission/theoretical_ecology/generated/rendered/pages/*.png
            submission/theoretical_ecology/generated/figures/*.svg
            submission/theoretical_ecology/generated/figures_png/*.png
            submission/theoretical_ecology/generated/PAYOFF_B_VERIFICATION_RECEIPT.json
            submission/theoretical_ecology/generated/PACKAGE_QA_RECEIPT.txt
          if-no-files-found: error
