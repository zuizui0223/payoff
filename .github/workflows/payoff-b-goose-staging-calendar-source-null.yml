name: payoff-b-goose-staging-calendar-source-null

on:
  push:
    branches:
      - analysis/payoff-b-goose-staging-calendar-null-20261008
    paths:
      - 'scripts/payoff_b_goose_staging_calendar_null.py'
      - '.github/workflows/payoff-b-goose-staging-calendar-source-null.yml'
  pull_request:
    paths:
      - 'scripts/payoff_b_goose_staging_calendar_null.py'
      - '.github/workflows/payoff-b-goose-staging-calendar-source-null.yml'

jobs:
  source-only-stage-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic fixed-calendar identity control
        run: python scripts/payoff_b_goose_staging_calendar_null.py --self-test
      - name: Source-verified original goose stage timing audit without fitness
        run: python scripts/payoff_b_goose_staging_calendar_null.py
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-goose-stage-calendar-source-only
          path: outputs/payoff_b_goose_staging_calendar_null_result.json
          if-no-files-found: error
