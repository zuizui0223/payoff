name: payoff-b-stage-window-censoring-negative-control

on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/simulate_stage_timing_window_null.py"
      - "tests/test_stage_timing_window_null.py"
      - "docs/PAYOFF_B_STAGE_TIMING_WINDOW_NULL_20261019.md"
      - ".github/workflows/payoff-b-stage-window-null.yml"

jobs:
  synthetic-structural-null:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify synthetic fixed-censoring invariants
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_stage_timing_window_null.py
      - name: Run independent synthetic censoring control
        run: |
          python -m scripts.simulate_stage_timing_window_null --out outputs/payoff_b_stage_timing_window_null.json
      - name: Archive only synthetic diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stage-window-structural-null
          path: outputs/payoff_b_stage_timing_window_null.json
          if-no-files-found: error
