name: payoff-b 2d frontier resolution check

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-2d-frontier-resolution.yml

jobs:
  centered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck centered 2D frontier with 7x7 strategies
        run: >
          python scripts/migration_phenology_2d_corridor.py
          --climate-velocities 0.06,0.065,0.07,0.08,0.085,0.09
          --phenology-limits 2,4
          --gap-widths 1,3,15
          --width 31
          --height 15
          --barrier-x-offset 4
          --gap-center-offset 0
          --initial-total-abundance 400
          --local-carrying-capacity 80
          --density-coefficient 0.30
          --baseline-growth 0.30
          --interaction-strength 0.25
          --migration-cost 0.03
          --phenology-cost 0.03
          --steps 100
          --burn-in 20
          --migration-points 7
          --phenology-points 7
          --output outputs/payoff_b_2d_centered_resolution.csv
          --frontier-output outputs/payoff_b_2d_centered_resolution_frontier.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-2d-centered-resolution
          path: |
            outputs/payoff_b_2d_centered_resolution.csv
            outputs/payoff_b_2d_centered_resolution_frontier.csv

  offset6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck offset6 2D frontier with 7x7 strategies
        run: >
          python scripts/migration_phenology_2d_corridor.py
          --climate-velocities 0.06,0.065,0.07,0.08,0.085,0.09
          --phenology-limits 2,4
          --gap-widths 1,3,15
          --width 31
          --height 15
          --barrier-x-offset 4
          --gap-center-offset 6
          --initial-total-abundance 400
          --local-carrying-capacity 80
          --density-coefficient 0.30
          --baseline-growth 0.30
          --interaction-strength 0.25
          --migration-cost 0.03
          --phenology-cost 0.03
          --steps 100
          --burn-in 20
          --migration-points 7
          --phenology-points 7
          --output outputs/payoff_b_2d_offset6_resolution.csv
          --frontier-output outputs/payoff_b_2d_offset6_resolution_frontier.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-2d-offset6-resolution
          path: |
            outputs/payoff_b_2d_offset6_resolution.csv
            outputs/payoff_b_2d_offset6_resolution_frontier.csv
