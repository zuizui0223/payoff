name: PAYOFF-B original radar and greenup source admission (no effects)

on:
  push:
    branches:
      - analysis/payoff-b-radar-calendar-greenup-source-20261122
  workflow_dispatch:

jobs:
  original-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test-only dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify original-source integrity guardrails
        run: pytest -q tests/test_payoff_b_radar_source_gate_20261122.py
      - name: Retrieve and validate bounded official Figshare source inventory
        run: |
          python scripts/payoff_b_radar_source_gate_20261122.py \
            --output outputs/payoff_b_radar_source_inventory_20261122.json
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path("outputs/payoff_b_radar_source_inventory_20261122.json").read_text())
          assert x["new_biological_coefficient_fitted"] is False
          assert "raw_observations" not in x
          assert x["status"] in {"SOURCE_ONLY_NO_EFFECT_FIT", "SOURCE_NOT_ADMITTED"}
          print("source_status", x["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-radar-source-only-20261122
          path: outputs/payoff_b_radar_source_inventory_20261122.json
