name: Movement-phenology barnacle goose multiflyway discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_barnacle_multiflyway_discover.py'
      - '.github/workflows/movement-phenology-barnacle-multiflyway.yml'
  pull_request:
    paths:
      - 'analysis/movement_phenology/stage3_barnacle_multiflyway_discover.py'
      - '.github/workflows/movement-phenology-barnacle-multiflyway.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Discover three flyway bitstreams
        run: python analysis/movement_phenology/stage3_barnacle_multiflyway_discover.py

      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-barnacle-multiflyway-discovery
          path: |
            outputs/movement_phenology/stage3_barnacle_multiflyway_discovery.json
            outputs/movement_phenology/stage3_barnacle_multiflyway_bitstreams.csv
          if-no-files-found: error
