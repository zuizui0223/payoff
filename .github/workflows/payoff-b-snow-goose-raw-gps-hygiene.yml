name: PAYOFF-B snow goose raw GPS hygiene

on:
  push:
    branches:
      - analysis/payoff-b-snow-goose-visible-filter-amendment-20260929
    paths:
      - 'src/movebank_event_hygiene.py'
      - 'scripts/prepare_greater_snow_goose_movebank_for_movepp.py'
      - 'tests/test_movebank_event_hygiene.py'
      - 'data/payoff_b_greater_snow_goose_raw_gps_hygiene_contract_20260929.json'
      - 'data/payoff_b_greater_snow_goose_gps_cue_uptake_registration_20260929.json'
      - 'data/payoff_b_greater_snow_goose_preoutcome_amendment_2_20260929.json'
      - 'data/payoff_b_greater_snow_goose_preoutcome_freeze_v3_20260929.json'
      - '.github/workflows/payoff-b-snow-goose-raw-gps-hygiene.yml'
  pull_request:
    paths:
      - 'src/movebank_event_hygiene.py'
      - 'scripts/prepare_greater_snow_goose_movebank_for_movepp.py'
      - 'tests/test_movebank_event_hygiene.py'
      - 'data/payoff_b_greater_snow_goose_raw_gps_hygiene_contract_20260929.json'
      - 'data/payoff_b_greater_snow_goose_gps_cue_uptake_registration_20260929.json'
      - 'data/payoff_b_greater_snow_goose_preoutcome_amendment_2_20260929.json'
      - 'data/payoff_b_greater_snow_goose_preoutcome_freeze_v3_20260929.json'
      - '.github/workflows/payoff-b-snow-goose-raw-gps-hygiene.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,empirical]'
      - run: python -m pytest -q tests/test_movebank_event_hygiene.py
      - run: python scripts/prepare_greater_snow_goose_movebank_for_movepp.py --help
