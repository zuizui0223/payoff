name: payoff-b-v8-stagewise-subset

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_stagewise_subset_representativeness.R"
      - ".github/workflows/payoff-b-v8-stagewise-subset.yml"

jobs:
  stagewise-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run stagewise subset representativeness audit
        run: Rscript analysis/movement_phenology/payoff_b_v8_stagewise_subset_representativeness.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-stagewise-subset
          path: |
            outputs/payoff_b_v8_stagewise_subset_pairs.csv
            outputs/payoff_b_v8_stagewise_subset_summary.csv
            outputs/payoff_b_v8_stagewise_subset_units.csv
            outputs/payoff_b_v8_stagewise_subset_status.csv
          if-no-files-found: error
