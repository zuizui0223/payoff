name: payoff-b landscape frontier resolution check

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-landscape-frontier-resolution.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck frontier with 11x11 strategy grid
        run: >
          python scripts/migration_phenology_landscape_frontier.py
          --climate-velocities 0.025,0.03,0.035,0.04,0.045,0.05,0.055,0.06,0.065,0.07
          --phenology-limits 0,1,2,3,4,5
          --patches 41
          --patch-spacing 1
          --spatial-gradient 0.20
          --carrying-capacity 1000
          --density-coefficient 0.30
          --baseline-growth 0.30
          --interaction-strength 0.25
          --migration-cost 0.03
          --phenology-cost 0.03
          --steps 160
          --burn-in 40
          --max-migration-rate 1.0
          --max-phenology-rate 1.0
          --migration-points 11
          --phenology-points 11
          --output outputs/payoff_b_landscape_frontier_resolution_grid.csv
          --frontier-output outputs/payoff_b_landscape_frontier_resolution_summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-landscape-frontier-resolution
          path: |
            outputs/payoff_b_landscape_frontier_resolution_grid.csv
            outputs/payoff_b_landscape_frontier_resolution_summary.csv
