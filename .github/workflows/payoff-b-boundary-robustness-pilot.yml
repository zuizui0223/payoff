name: payoff-b boundary robustness pilot

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-boundary-robustness-pilot.yml

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare reflecting and leaky landscape boundaries
        run: >
          python scripts/migration_phenology_boundary_robustness.py
          --boundary-retentions 0,0.5,1
          --interaction-strengths 0.2,0.5,1.0
          --cost-biases=-0.08,0,0.08
          --climate-velocities 0.04,0.05
          --phenology-limits 2,4
          --base-cost 0.06
          --baseline-growth 0.30
          --patches 31
          --spatial-gradient 0.20
          --carrying-capacity 800
          --density-coefficient 0.30
          --steps 120
          --burn-in 30
          --mutation-step 0.1
          --max-migration-rate 1.0
          --max-phenology-rate 1.0
          --max-cycles 80
          --gap-tolerance 1e-8
          --output outputs/payoff_b_boundary_robustness_pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-boundary-robustness-pilot
          path: outputs/payoff_b_boundary_robustness_pilot.csv
