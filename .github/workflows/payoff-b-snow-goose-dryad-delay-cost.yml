name: PAYOFF-B snow goose Dryad delay-cost manifest

concurrency:
  group: payoff-b-snow-goose-dryad-delay-cost-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - analysis/payoff-b-snow-goose-dryad-delay-cost-20260929
    paths:
      - 'scripts/probe_snow_goose_dryad_manifest.py'
      - 'data/payoff_b_snow_goose_dryad_delay_cost_contract_20260929.json'
      - '.github/workflows/payoff-b-snow-goose-dryad-delay-cost.yml'
  pull_request:
    paths:
      - 'scripts/probe_snow_goose_dryad_manifest.py'
      - 'data/payoff_b_snow_goose_dryad_delay_cost_contract_20260929.json'
      - '.github/workflows/payoff-b-snow-goose-dryad-delay-cost.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/probe_snow_goose_dryad_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-snow-goose-dryad-manifest
          path: outputs/payoff_b_snow_goose_dryad_manifest_probe.json
          if-no-files-found: error
