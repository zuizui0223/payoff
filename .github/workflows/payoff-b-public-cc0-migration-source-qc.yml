name: payoff-b-public-cc0-migration-source-qc

on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_public_movebank_geese_2016.py"
      - "tests/test_public_movebank_geese_2016.py"
      - "docs/PAYOFF_B_PUBLIC_TRACK_QC_20261019.md"
      - ".github/workflows/payoff-b-public-cc0-migration-source-qc.yml"

jobs:
  public-source-structure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify tests before reading published public source
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_public_movebank_geese_2016.py
      - name: Verify original CC0 archive checksums, then summarize timestamps and sensor fields
        run: |
          python -m scripts.qc_public_movebank_geese_2016 \
            --output outputs/payoff_b_public_geese_qc_2016.json
      - name: Archive only non-identifying results, never raw tracks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-public-geese-2016-source-qc
          path: outputs/payoff_b_public_geese_qc_2016.json
          if-no-files-found: warn
