name: payoff-b Aikens anonymous MODIS S3 probe

concurrency:
  group: payoff-b-aikens-modis-anonymous-s3-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe_aikens_modis_public_s3.py'
      - '.github/workflows/payoff-b-aikens-modis-anonymous-s3.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anonymous S3 client
        run: python -m pip install --disable-pip-version-check boto3

      - name: Probe exact frozen MODIS V061 product buckets without credentials
        run: >
          python scripts/probe_aikens_modis_public_s3.py
          --output outputs/aikens_modis_anonymous_s3_probe.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-aikens-modis-anonymous-s3-probe
          path: outputs/aikens_modis_anonymous_s3_probe.json
