name: payoff-b drift escape pilot

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-drift-escape-pilot.yml

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run finite-N drift-assisted coordination escape pilot
        run: >
          python scripts/migration_phenology_drift_escape.py
          --population-sizes 10,30,100,300,1000
          --selection-strengths 5,20
          --interaction-strength 0.3
          --cost-bias 0.08
          --base-cost 0.08
          --climate-velocity 0.04
          --baseline-growth 0.35
          --steps 100
          --burn-in 20
          --max-rate 1.0
          --grid-points 11
          --mutation-events 20000
          --evolutionary-burn-in 2000
          --replicates 32
          --seed 20260920
          --output outputs/payoff_b_drift_escape_pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-drift-escape-pilot
          path: outputs/payoff_b_drift_escape_pilot.csv
