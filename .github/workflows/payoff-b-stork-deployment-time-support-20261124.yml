name: PAYOFF-B stork original CC0 deployment-time source support (no GPS)

on:
  push:
    branches:
      - analysis/payoff-b-stork-deployment-time-support-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-deployment-time-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test temporal censoring, overlap and source-contract privacy
        run: pytest -q -rs tests/test_payoff_b_stork_deployment_time_gate_20261124.py
      - name: Read only 3 checksum-frozen public CC0 reference CSVs
        run: |
          python scripts/payoff_b_stork_deployment_time_gate_20261124.py \
            --contract data/payoff_b_stork_deployment_time_contract_20261124.json \
            --output outputs/payoff_b_stork_deployment_time_receipt_20261124.json
          python - <<'PY'
          from pathlib import Path
          import json
          z=json.loads(Path("outputs/payoff_b_stork_deployment_time_receipt_20261124.json").read_text())
          assert z["group_count"]==3
          assert sum(v["original_csv_rows"] for v in z["source_cohorts"].values())==212
          assert z["status"] in {"TIME_METADATA_BOUNDED_SUPPORT_ONLY","TIME_WINDOW_ENDS_UNOBSERVED"}
          assert z["no_actual_bird_colocation_or_social_information_identified"] is True
          assert z["no_environmental_predictive_reliability_estimated"] is True
          assert z["raw_tag_ids_or_source_rows_exported"] is False
          assert z["GPS_ZIPs_downloaded"] is False
          assert z["original_fitness_or_treatment_effect_refitted"] is False
          assert z["no_ebird"] is True
          print("ORIGINAL_STORK_DEPLOYMENT_SUPPORT_STATUS",z["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stork-deployment-time-derived-only-20261124
          path: outputs/payoff_b_stork_deployment_time_receipt_20261124.json
          if-no-files-found: error
