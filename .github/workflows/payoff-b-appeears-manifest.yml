name: payoff-b AppEEARS manifest

concurrency:
  group: payoff-b-appeears-manifest-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'src/appeears_modis_request.py'
      - 'scripts/build_aikens_appeears_manifest.py'
      - 'tests/test_appeears_modis_request.py'
      - 'src/appeears_manifest_gate.py'
      - 'scripts/evaluate_aikens_appeears_manifest.py'
      - 'tests/test_appeears_manifest_gate.py'
      - 'src/appeears_client.py'
      - 'scripts/run_appeears_manifest.py'
      - 'tests/test_appeears_client.py'
      - 'tests/test_run_appeears_manifest.py'
      - 'pyproject.toml'
      - '.github/workflows/payoff-b-appeears-manifest.yml'
  pull_request:
    paths:
      - 'src/appeears_modis_request.py'
      - 'scripts/build_aikens_appeears_manifest.py'
      - 'tests/test_appeears_modis_request.py'
      - 'src/appeears_manifest_gate.py'
      - 'scripts/evaluate_aikens_appeears_manifest.py'
      - 'tests/test_appeears_manifest_gate.py'
      - 'src/appeears_client.py'
      - 'scripts/run_appeears_manifest.py'
      - 'tests/test_appeears_client.py'
      - 'tests/test_run_appeears_manifest.py'
      - 'pyproject.toml'
      - '.github/workflows/payoff-b-appeears-manifest.yml'
  workflow_dispatch:

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Earthdata manifest dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test,earthdata]"
      - name: Test AppEEARS request builder, source gate, and client
        run: >
          pytest -q
          tests/test_appeears_modis_request.py
          tests/test_appeears_manifest_gate.py
          tests/test_appeears_client.py
          tests/test_run_appeears_manifest.py
      - name: Build synthetic projected GPS fixture
        run: |
          mkdir -p outputs
          cat > outputs/ci_aikens_projected_gps.csv <<'EOF'
          observation_id,animal_id,animal_year,group,timestamp,x,y
          o1,A,A_2020,small,2020-04-01T12:00:00,500000,4700000
          o2,A,A_2020,small,2020-04-02T12:00:00,500010,4700010
          o3,A,A_2020,small,2020-04-03T12:00:00,501000,4700000
          o4,A,A_2021,small,2021-04-01T12:00:00,500000,4700000
          EOF
      - name: Build AppEEARS V061 sensitivity manifest
        run: >
          python scripts/build_aikens_appeears_manifest.py
          outputs/ci_aikens_projected_gps.csv
          --source-crs EPSG:32613
          --max-points-per-task 1
          --manifest-output outputs/ci_aikens_appeears_v061_manifest.json
          --cells-output outputs/ci_aikens_modis250_cells.csv
          --links-output outputs/ci_aikens_gps_modis250_links.csv
          --receipt-output outputs/ci_aikens_appeears_v061_manifest_receipt.json
      - name: Evaluate synthetic manifest coverage gate
        run: >
          python scripts/evaluate_aikens_appeears_manifest.py
          outputs/ci_aikens_appeears_v061_manifest.json
          --expected-gps-observations 4
          --required-years 2020,2021
          --required-groups small
          --exact-year-set
          --fail-on-gate-failure
          --output outputs/ci_aikens_appeears_manifest_coverage_gate.json
      - name: Dry-run one AppEEARS manifest task
        run: >
          python scripts/run_appeears_manifest.py
          outputs/ci_aikens_appeears_v061_manifest.json
          --task-index 0
          --output outputs/ci_aikens_appeears_submission_dry_run.json
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-appeears-manifest
          path: |
            outputs/ci_aikens_projected_gps.csv
            outputs/ci_aikens_appeears_v061_manifest.json
            outputs/ci_aikens_modis250_cells.csv
            outputs/ci_aikens_gps_modis250_links.csv
            outputs/ci_aikens_appeears_v061_manifest_receipt.json
            outputs/ci_aikens_appeears_manifest_coverage_gate.json
            outputs/ci_aikens_appeears_submission_dry_run.json
