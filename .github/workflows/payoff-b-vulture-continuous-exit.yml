name: payoff-b-vulture-continuous-GPS-exit-resolution

on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_vulture_continuous_exit.py"
      - "tests/test_payoff_b_vulture_continuous_exit.py"
      - "docs/PAYOFF_B_VULTURE_CONTINUOUS_EXIT_PRELOCK_20261022.md"
      - ".github/workflows/payoff-b-vulture-continuous-exit.yml"
  workflow_dispatch:

jobs:
  original-vulture-fix-time:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test synthetic sub-day excursion versus sustained outward GPS fixes
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_vulture_continuous_exit.py
      - name: Verify original MD5 and compare continuous GPS to day-boundary timing
        run: |
          python -m scripts.qc_payoff_b_vulture_continuous_exit \
            --out outputs/payoff_b_vulture_continuous_exit
      - name: Archive only aggregate nonlocatable sensitive bird timing results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-vulture-continuous-source-time-audit
          path: outputs/payoff_b_vulture_continuous_exit/
          if-no-files-found: warn
