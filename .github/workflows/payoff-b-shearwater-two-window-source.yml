name: payoff-b-shearwater-early-late-GPS-source-gate

on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_shearwater_two_window_source.py"
      - "tests/test_payoff_b_shearwater_two_window_source.py"
      - "docs/PAYOFF_B_SHEARWATER_TWO_WINDOW_SOURCE_GATE_20261028.md"
      - ".github/workflows/payoff-b-shearwater-two-window-source.yml"

jobs:
  original_GPS_two_windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test original device groups and independent early-late GPS windows
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_shearwater_two_window_source.py
      - name: Verify original CC0 shearwater GPS early-late coverage without route effects
        run: |
          python -m scripts.qc_payoff_b_shearwater_two_window_source \
            --out outputs/payoff_b_shearwater_two_window_source.json
      - name: Archive aggregate group coverage only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-shearwater-two-window-GPS-coverage
          path: outputs/payoff_b_shearwater_two_window_source.json
          if-no-files-found: warn
