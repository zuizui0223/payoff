name: PAYOFF-B snow goose Movebank materializer safeguards

on:
  push:
    branches:
      - ops/payoff-b-snow-goose-movebank-materialize-20260929
    paths:
      - 'scripts/payoff_b_greater_snow_goose_movebank_materialize.py'
      - 'tests/test_snow_goose_movebank_materialize.py'
      - 'data/payoff_b_greater_snow_goose_movebank_materialization_contract_20260929.json'
      - 'docs/PAYOFF_B_SNOW_GOOSE_MOVEBANK_MATERIALIZATION_20260929.md'
      - '.github/workflows/payoff-b-snow-goose-movebank-materialize.yml'
  pull_request:
    paths:
      - 'scripts/payoff_b_greater_snow_goose_movebank_materialize.py'
      - 'tests/test_snow_goose_movebank_materialize.py'
      - 'data/payoff_b_greater_snow_goose_movebank_materialization_contract_20260929.json'
      - 'docs/PAYOFF_B_SNOW_GOOSE_MOVEBANK_MATERIALIZATION_20260929.md'
      - '.github/workflows/payoff-b-snow-goose-movebank-materialize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safeguards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,empirical]'
      - run: python -m pytest -q tests/test_snow_goose_movebank_materialize.py
      - run: python scripts/payoff_b_greater_snow_goose_movebank_materialize.py --help
