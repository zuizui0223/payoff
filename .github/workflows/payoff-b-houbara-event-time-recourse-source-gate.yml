name: payoff-b-houbara-event-time-recourse-source-gate

on:
  push:
    branches:
      - analysis/payoff-b-goose-staging-calendar-null-20261008
    paths:
      - 'scripts/payoff_b_houbara_event_time_recourse_gate.py'
      - 'scripts/payoff_b_houbara_zenodo_metadata_gate.py'
      - '.github/workflows/payoff-b-houbara-event-time-recourse-source-gate.yml'
  pull_request:
    paths:
      - 'scripts/payoff_b_houbara_event_time_recourse_gate.py'
      - 'scripts/payoff_b_houbara_zenodo_metadata_gate.py'
      - '.github/workflows/payoff-b-houbara-event-time-recourse-source-gate.yml'

jobs:
  exact-original-rows-and-observation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic chronology and source count tests
        run: python scripts/payoff_b_houbara_event_time_recourse_gate.py --self-test
      - name: Read exactly published houbara workbook events and source code
        run: python scripts/payoff_b_houbara_event_time_recourse_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-houbara-event-time-and-recourse-source-audit
          path: outputs/payoff_b_houbara_event_time_recourse_gate_20261008.json
          if-no-files-found: error
