name: payoff-b Aikens exact AppEEARS manifest

concurrency:
  group: payoff-b-aikens-exact-manifest-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - '.github/workflows/payoff-b-aikens-exact-manifest.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install request-building dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test,earthdata]"

      - name: Download frozen raw-GPS source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/source
          curl -fL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10643405042/zip"             -o outputs/aikens_raw_gps_source.zip
          echo "1f0d706dc6a102261009b7099c748dcce40abb2adedf7b88828395a1d392cfa0  outputs/aikens_raw_gps_source.zip" | sha256sum -c -
          unzip -q outputs/aikens_raw_gps_source.zip             stage3_industrial_mule_deer_gps.csv             -d outputs/source
          echo "03426804557a0244be3ed6eb9f461db578d3ce26fa2b28637f8e98bee9f09466  outputs/source/stage3_industrial_mule_deer_gps.csv" | sha256sum -c -

      - name: Build exact 64,539-point AppEEARS manifest
        run: >
          python scripts/build_aikens_appeears_manifest.py
          outputs/source/stage3_industrial_mule_deer_gps.csv
          --source-crs EPSG:32613
          --max-points-per-task 1000
          --manifest-output outputs/aikens_exact_appeears_v061_manifest.json
          --cells-output outputs/aikens_exact_modis250_cells.csv
          --links-output outputs/aikens_exact_gps_modis250_links.csv
          --receipt-output outputs/aikens_exact_appeears_v061_manifest_receipt.json

      - name: Enforce canonical source identity
        run: >
          python scripts/evaluate_aikens_appeears_manifest.py
          outputs/aikens_exact_appeears_v061_manifest.json
          --canonical-aikens
          --fail-on-gate-failure
          --output outputs/aikens_exact_manifest_coverage_gate.json

      - name: Verify frozen exact-manifest hashes
        run: |
          echo "d50e69a20d6e65ec3426a8c938d1dea9d4e2f836c9bf07e02d30c560f5fa8463  outputs/aikens_exact_appeears_v061_manifest.json" | sha256sum -c -
          echo "3570bc04dfef9da677954246b636a99fa069c4b2e5b0020dd9ac1c4ee9dc8d02  outputs/aikens_exact_modis250_cells.csv" | sha256sum -c -
          echo "ef7445152bf2217a81088e1765cd215dfafb87036366c8f789e6ebe3747cbff1  outputs/aikens_exact_gps_modis250_links.csv" | sha256sum -c -

      - name: Check AppEEARS credential availability without exposing values
        env:
          APPEEARS_TOKEN: ${{ secrets.APPEEARS_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          token = bool(os.environ.get("APPEEARS_TOKEN"))
          userpass = bool(
              os.environ.get("EARTHDATA_USERNAME")
              and os.environ.get("EARTHDATA_PASSWORD")
          )
          if token:
              source = "APPEEARS_TOKEN"
          elif userpass:
              source = "EARTHDATA_USERNAME_PASSWORD"
          else:
              source = None
          payload = {
              "appeears_credentials_configured": bool(token or userpass),
              "authentication_source": source,
              "credential_values_recorded": False,
              "network_submission_performed": False,
              "lambda_outcome_opened": False,
          }
          Path("outputs/aikens_appeears_credential_status.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              "appeears_credentials "
              f"configured={int(payload['appeears_credentials_configured'])} "
              f"source={source or 'none'} "
              "values_recorded=0"
          )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-aikens-exact-appeears-manifest
          path: |
            outputs/aikens_exact_appeears_v061_manifest.json
            outputs/aikens_exact_modis250_cells.csv
            outputs/aikens_exact_gps_modis250_links.csv
            outputs/aikens_exact_appeears_v061_manifest_receipt.json
            outputs/aikens_exact_manifest_coverage_gate.json
            outputs/aikens_appeears_credential_status.json
