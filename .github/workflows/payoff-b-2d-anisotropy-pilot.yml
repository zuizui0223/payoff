name: payoff-b 2d anisotropy pilot

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-2d-anisotropy-pilot.yml

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run anisotropic movement sensitivity
        run: >
          python scripts/migration_phenology_2d_anisotropy.py
          --y-weight-ratios 1,0.5,0.25,0.1
          --climate-velocities 0.05,0.06,0.07
          --phenology-limits 0,2,4
          --width 31
          --height 15
          --first-wall-offset 3
          --second-wall-offset 7
          --detour-offset 5
          --gap-width 1
          --initial-total-abundance 400
          --local-carrying-capacity 80
          --density-coefficient 0.30
          --baseline-growth 0.30
          --interaction-strength 0.25
          --migration-cost 0.03
          --phenology-cost 0.03
          --steps 100
          --burn-in 20
          --migration-points 7
          --phenology-points 7
          --output outputs/payoff_b_2d_anisotropy_pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-2d-anisotropy-pilot
          path: outputs/payoff_b_2d_anisotropy_pilot.csv
