name: payoff-b-matched-predeparture-weather-exploratory
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/audit_payoff_b_paired_weather.py"
      - "tests/test_payoff_b_paired_weather.py"
      - "docs/PAYOFF_B_MATCHED_WEATHER_EXPLORATORY_LOCK_20261019.md"
      - ".github/workflows/payoff-b-matched-predeparture-weather.yml"
jobs:
  matched-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        system: [stork, white_fronted_goose, curlew]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate source chronology and aggregation with synthetic data
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_paired_weather.py tests/test_payoff_b_stationary_case_controls.py
      - name: Match and query only predeparture hourly NASA weather
        run: |
          python -m scripts.audit_payoff_b_paired_weather --system ${{ matrix.system }} --out outputs/payoff_b_matched_weather
      - name: Archive only grouped weather contrasts and missingness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-matched-weather-${{ matrix.system }}
          path: outputs/payoff_b_matched_weather/
          if-no-files-found: warn
