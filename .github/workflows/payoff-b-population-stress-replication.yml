name: payoff-b population stress replication

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-population-stress-replication.yml

jobs:
  replication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent 675-cell demographic stress replication
        run: >
          python scripts/migration_phenology_population_stress_sweep.py
          --interaction-strengths 0,0.1,0.3,0.6,1.0
          --cost-biases=-0.08,-0.04,0,0.04,0.08
          --climate-velocities 0.02,0.04,0.06
          --baseline-growths 0.04,0.08,0.12
          --carrying-capacities 30,100,300
          --initial-fraction 0.5
          --steps 160
          --burn-in 20
          --mutation-step 0.1
          --max-rate 1.0
          --max-cycles 40
          --replicates 128
          --extinction-threshold 0
          --persistence-gain-threshold 0.10
          --seed 20260921
          --output outputs/payoff_b_population_stress_replication.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-population-stress-replication
          path: outputs/payoff_b_population_stress_replication.csv
