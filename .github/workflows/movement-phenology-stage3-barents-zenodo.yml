name: Movement-phenology Barents Zenodo source

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_barents_zenodo_discover.py'
      - '.github/workflows/movement-phenology-stage3-barents-zenodo.yml'
  pull_request:
    paths:
      - 'analysis/movement_phenology/stage3_barents_zenodo_discover.py'
      - '.github/workflows/movement-phenology-stage3-barents-zenodo.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pandas
      - name: Discover Zenodo processed tracking file
        run: python analysis/movement_phenology/stage3_barents_zenodo_discover.py

      - name: Record processed-data access gate
        run: |
          python - <<'PY'
          import json, pathlib, requests
          out = pathlib.Path("outputs/movement_phenology")
          out.mkdir(parents=True, exist_ok=True)
          url = "https://datadryad.org/api/v2/files/2963968"
          r = requests.get(url, headers={"Accept":"application/json"}, timeout=30)
          receipt = {
              "dryad_doi": "10.5061/dryad.zw3r228fd",
              "file_id": 2963968,
              "filename": "ProcessedTrackingData_MakingBeterUseOfTrackingData_2023.csv",
              "metadata_http_status": r.status_code,
              "metadata": r.json() if r.ok else r.text[:1000],
              "download_gate": "Dryad Files API download currently requires bearer authentication; use original Movebank/METS acquisition for automated direct-controller reconstruction.",
          }
          (out/"stage3_barents_processed_access_gate.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )
          print(json.dumps(receipt, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-barents-zenodo-discovery
          path: |
            outputs/movement_phenology/stage3_barents_zenodo_discovery.json
            outputs/movement_phenology/stage3_barents_processed_access_gate.json
          if-no-files-found: error
