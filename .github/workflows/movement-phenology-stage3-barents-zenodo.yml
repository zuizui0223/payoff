name: Movement-phenology Barents Zenodo source

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_barents_zenodo_discover.py'
      - '.github/workflows/movement-phenology-stage3-barents-zenodo.yml'
  pull_request:
    paths:
      - 'analysis/movement_phenology/stage3_barents_zenodo_discover.py'
      - '.github/workflows/movement-phenology-stage3-barents-zenodo.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pandas
      - name: Discover Zenodo processed tracking file
        run: python analysis/movement_phenology/stage3_barents_zenodo_discover.py

      - name: Download processed hourly tracking release
        run: |
          mkdir -p external/barnacle_processed
          curl --fail --location --retry 4             'https://zenodo.org/records/10214988/files/ProcessedTrackingData_MakingBeterUseOfTrackingData_2023.csv?download=1'             --output external/barnacle_processed/ProcessedTrackingData_MakingBeterUseOfTrackingData_2023.csv
          test -s external/barnacle_processed/ProcessedTrackingData_MakingBeterUseOfTrackingData_2023.csv
          ls -lh external/barnacle_processed/ProcessedTrackingData_MakingBeterUseOfTrackingData_2023.csv

      - name: Inventory Barents and Svalbard subsets
        run: python analysis/movement_phenology/stage3_barents_processed_source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-barents-zenodo-discovery
          path: |
            outputs/movement_phenology/stage3_barents_zenodo_discovery.json
            outputs/movement_phenology/stage3_barents_processed_source_receipt.json
            outputs/movement_phenology/stage3_barents_processed_tracking_subset.csv
            outputs/movement_phenology/stage3_svalbard_processed_tracking_subset.csv
          if-no-files-found: error
