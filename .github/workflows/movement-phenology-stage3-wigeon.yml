name: Movement-phenology Stage 3 wigeon

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_wigeon_*.py'
      - 'analysis/movement_phenology/wigeon_hmm.py'
      - 'analysis/movement_phenology/tgs.py'
      - 'tests/test_movement_phenology_tgs.py'
      - 'tests/test_movement_phenology_wigeon_hmm.py'
      - '.github/workflows/movement-phenology-stage3-wigeon.yml'

jobs:
  wigeon:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest pandas numpy scipy requests statsmodels scikit-learn \
            beautifulsoup4 pyproj

      - name: Download original Movebank raw burst export
        continue-on-error: true
        run: python analysis/movement_phenology/stage3_wigeon_original_download.py

      - name: Download public Zenodo hourly fallback
        run: python analysis/movement_phenology/stage3_wigeon_zenodo_download.py

      - name: Normalize preferred wigeon source
        run: python analysis/movement_phenology/stage3_wigeon_source_probe.py

      - name: Extract published HMM and staging code contract
        run: python analysis/movement_phenology/stage3_wigeon_supplement_probe.py

      - name: Reconstruct published HMM states and staging sites
        run: python analysis/movement_phenology/stage3_wigeon_hmm_reconstruction.py

      - name: Reconstruct TGS and fit direct phase controller
        run: python analysis/movement_phenology/stage3_wigeon_power_tgs_controller.py

      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-stage3-wigeon
          path: |
            outputs/movement_phenology/stage3_wigeon_original_movebank_receipt.json
            outputs/movement_phenology/stage3_wigeon_zenodo_download.json
            outputs/movement_phenology/stage3_wigeon_source_receipt.json
            outputs/movement_phenology/stage3_wigeon_individual_source_summary.csv
            outputs/movement_phenology/stage3_wigeon_raw_subset.csv
            outputs/movement_phenology/stage3_wigeon_supplement_probe.json
            outputs/movement_phenology/stage3_wigeon_hmm_contract.json
            outputs/movement_phenology/stage3_wigeon_supplement_hmm_blocks.txt
            outputs/movement_phenology/stage3_wigeon_supplement_hmm_contexts.txt
            outputs/movement_phenology/stage3_wigeon_hmm_reconstruction_receipt.json
            outputs/movement_phenology/stage3_wigeon_staging_sites.csv
            outputs/movement_phenology/stage3_wigeon_hmm_states.csv
            outputs/movement_phenology/stage3_wigeon_track_summary.csv
            outputs/movement_phenology/stage3_wigeon_track_filter_audit.csv
            outputs/movement_phenology/stage3_wigeon_power_tgs_cells.csv
            outputs/movement_phenology/stage3_wigeon_power_tgs_queries.csv
            outputs/movement_phenology/stage3_wigeon_tgs_validation.csv
            outputs/movement_phenology/stage3_wigeon_tgs_events.csv
            outputs/movement_phenology/stage3_wigeon_controller_transitions.csv
            outputs/movement_phenology/stage3_wigeon_direct_controller_receipt.json
          if-no-files-found: error
