name: Movement-phenology Stage 3 wigeon

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_wigeon_*.py'
      - 'analysis/movement_phenology/tgs.py'
      - 'tests/test_movement_phenology_tgs.py'
      - '.github/workflows/movement-phenology-stage3-wigeon.yml'
  pull_request:
    paths:
      - 'analysis/movement_phenology/stage3_wigeon_*.py'
      - 'analysis/movement_phenology/tgs.py'
      - 'tests/test_movement_phenology_tgs.py'
      - '.github/workflows/movement-phenology-stage3-wigeon.yml'

jobs:
  wigeon:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pytest pandas numpy scipy requests statsmodels scikit-learn beautifulsoup4

      - name: Download public Zenodo raw GPS release
        run: |
          mkdir -p external/wigeon
          curl --fail --location --retry 4 \
            'https://zenodo.org/records/16940654/files/250823_LNU_dabbling_ducks_hourly.csv?download=1' \
            --output external/wigeon/250823_LNU_dabbling_ducks_hourly.csv
          test -s external/wigeon/250823_LNU_dabbling_ducks_hourly.csv
          ls -lh external/wigeon/250823_LNU_dabbling_ducks_hourly.csv
          sha256sum external/wigeon/250823_LNU_dabbling_ducks_hourly.csv

      - name: Inventory Zenodo wigeon study subset
        run: python analysis/movement_phenology/stage3_wigeon_source_probe.py

      - name: Extract published HMM and staging code contract
        run: python analysis/movement_phenology/stage3_wigeon_supplement_probe.py

      - name: Discover original Movebank repository bitstreams
        run: python analysis/movement_phenology/stage3_wigeon_movebank_discover.py

      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-stage3-wigeon
          path: |
            outputs/movement_phenology/stage3_wigeon_source_receipt.json
            outputs/movement_phenology/stage3_wigeon_individual_source_summary.csv
            outputs/movement_phenology/stage3_wigeon_raw_subset.csv
            outputs/movement_phenology/stage3_wigeon_supplement_probe.json
            outputs/movement_phenology/stage3_wigeon_supplement_hmm_blocks.txt
            outputs/movement_phenology/stage3_wigeon_supplement_hmm_contexts.txt
            outputs/movement_phenology/stage3_wigeon_movebank_discovery.json
            outputs/movement_phenology/stage3_wigeon_movebank_bitstreams.csv
          if-no-files-found: error
