name: Movement-phenology Stage 3 wigeon source discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_wigeon_movebank_discover.py'
      - '.github/workflows/movement-phenology-stage3-wigeon.yml'
  pull_request:
    paths:
      - 'analysis/movement_phenology/stage3_wigeon_movebank_discover.py'
      - '.github/workflows/movement-phenology-stage3-wigeon.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install discovery dependencies
        run: python -m pip install --disable-pip-version-check requests pandas

      - name: Discover wigeon Movebank item and bitstreams
        run: python analysis/movement_phenology/stage3_wigeon_movebank_discover.py

      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-stage3-wigeon-discovery
          path: |
            outputs/movement_phenology/stage3_wigeon_movebank_discovery.json
            outputs/movement_phenology/stage3_wigeon_movebank_bitstreams.csv
          if-no-files-found: error
