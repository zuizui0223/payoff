name: payoff-b-v8-predictive-connectivity-degradation

on:
  push:
    branches:
      - feature/payoff-b-v8-analysis-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_predictive_connectivity_degradation_v8.R"
      - ".github/workflows/payoff-b-v8-predictive-connectivity-degradation.yml"
      - "docs/PAYOFF_B_V8_PREDICTIVE_CONNECTIVITY_DEGRADATION_CONTRACT_20261005.md"
  workflow_dispatch:

jobs:
  v8-degradation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run frozen V8 environmental analysis
        run: Rscript analysis/movement_phenology/payoff_b_predictive_connectivity_degradation_v8.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-predictive-connectivity-degradation
          path: |
            outputs/payoff_b_v8_admission.csv
            outputs/payoff_b_v8_primary_result.csv
            outputs/payoff_b_v8_pair_windows_all.csv
            outputs/payoff_b_v8_eligible_pairs.csv
            outputs/payoff_b_v8_species_change.csv
          if-no-files-found: warn
