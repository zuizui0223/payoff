name: payoff-b-shearwater-sensory-experiment-source-qc
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_shearwater_cue_experiment_source.py"
      - "tests/test_payoff_b_shearwater_cue_experiment_source.py"
      - "docs/PAYOFF_B_SHEARWATER_EXPERIMENT_SOURCE_GATE_20261023.md"
      - ".github/workflows/payoff-b-shearwater-sensory-source.yml"
jobs:
  original-cc0-shearwater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic treatment-label and GPS source identity checks
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_shearwater_cue_experiment_source.py
      - name: Verify original CC0 GPS Argos and reference MD5 and treatment crosswalk
        run: |
          python -m scripts.qc_payoff_b_shearwater_cue_experiment_source \
            --out outputs/payoff_b_shearwater_cue_source
      - name: Archive only aggregate arm-specific source readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-shearwater-experimental-cue-source-qc
          path: outputs/payoff_b_shearwater_cue_source/
          if-no-files-found: warn
