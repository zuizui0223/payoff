name: GEB integrated PREOUTCOME package

on:
  workflow_dispatch:
  push:
    branches:
      - feature/payoff-b-integrated-geb-overlay-20260925
    paths:
      - 'scripts/build_geb_integrated_preoutcome_package.py'
      - 'scripts/build_geb_integrated_preoutcome_source.py'
      - 'scripts/audit_geb_integrated_preoutcome.py'
      - 'scripts/render_geb_integrated_figures.py'
      - 'submission/GEB_INTEGRATED_*'
      - '.github/workflows/build-geb-integrated-preoutcome-package.yml'
  pull_request:
    paths:
      - 'scripts/build_geb_integrated_preoutcome_package.py'
      - 'scripts/build_geb_integrated_preoutcome_source.py'
      - 'scripts/audit_geb_integrated_preoutcome.py'
      - 'scripts/render_geb_integrated_figures.py'
      - 'submission/GEB_INTEGRATED_*'
      - '.github/workflows/build-geb-integrated-preoutcome-package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GEB PREOUTCOME package
        run: >-
          python scripts/build_geb_integrated_preoutcome_package.py
          --output-dir outputs/geb_integrated_preoutcome_package
          --zip outputs/GEB_INTEGRATED_PREOUTCOME_PACKAGE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-geb-integrated-preoutcome-package
          path: |
            outputs/GEB_INTEGRATED_PREOUTCOME_PACKAGE.zip
            outputs/geb_integrated_preoutcome_package/GEB_INTEGRATED_PREOUTCOME_PACKAGE_MANIFEST.json
            outputs/geb_integrated_preoutcome_package/GEB_INTEGRATED_PREOUTCOME_AUDIT.json
          if-no-files-found: error
