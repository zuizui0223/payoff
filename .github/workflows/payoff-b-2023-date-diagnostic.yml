name: PAYOFF-B 2023 original date units diagnostic
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-2023-timing-units-diagnostic-20261115
    paths:
      - "scripts/payoff_b_2023_timing_units_diagnostic.py"
      - ".github/workflows/payoff-b-2023-date-diagnostic.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl
      - run: python -m scripts.payoff_b_2023_timing_units_diagnostic --output outputs/dryad/2023_date_units_diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-2023-date-units-diagnostic
          path: outputs/dryad/2023_date_units_diagnostic.json
          if-no-files-found: warn
