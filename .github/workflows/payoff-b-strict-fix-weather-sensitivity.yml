name: payoff-b-strict-GPS-fix-weather-sensitivity
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/run_payoff_b_strict_fix_weather.py"
      - "tests/test_payoff_b_strict_fix_weather.py"
      - "docs/PAYOFF_B_STRICT_FIX_WEATHER_LOCK_20261022.md"
      - ".github/workflows/payoff-b-strict-fix-weather-sensitivity.yml"
jobs:
  strict-source:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        system: [stork, white_fronted_goose, curlew, egyptian_vulture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test unchanged source filtered populations and method
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_strict_fix_weather.py
      - name: Analyze original strict quality subset with predecision daily weather
        run: |
          python -m scripts.run_payoff_b_strict_fix_weather \
            --system ${{ matrix.system }} \
            --out outputs/payoff_b_strict_fix_weather
      - name: Archive aggregate differences and missingness only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-strict-fix-weather-${{ matrix.system }}
          path: outputs/payoff_b_strict_fix_weather/
          if-no-files-found: warn
