name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python scripts/self_check.py
      - run: pytest -q
      - run: python scripts/phase_sweep.py --phi-min -0.2 --phi-max 0.2 --eta-min -0.2 --eta-max 0.2 --step 0.2 --output outputs/ci_phase_grid.csv
      - run: python scripts/lke_phase_sweep.py --s 0.5 --l-min 0 --l-max 0.4 --k-min 0 --k-max 0.4 --eta-min -0.2 --eta-max 0.2 --step 0.2 --output outputs/ci_lke_phase_grid.csv
      - run: python scripts/finite_population_sweep.py --n 20 --beta 0.05 --phi-min -0.2 --phi-max 0.2 --eta-min -0.2 --eta-max 0.2 --step 0.2 --output outputs/ci_finite_population_grid.csv
      - run: python scripts/release_curve.py --n 30 --phi 0.2 --eta 1.0 --beta 1.0 --output outputs/ci_release_curve.csv
      - run: python scripts/stationary_profile.py --n 30 --phi 0.1 --eta -0.8 --beta 0.5 --u-sd 0.01 --u-ds 0.02 --output outputs/ci_stationary_profile.csv
      - run: python scripts/spatial_two_patch_sweep.py --eta 1.0 --m-min 0 --m-max 0.3 --step 0.05 --output outputs/ci_spatial_two_patch.csv
      - run: python scripts/regular_graph_degree_sweep.py --phi 0.2 --eta 1.0 --recovery 1.0 --k-min 3 --k-max 10 --output outputs/ci_regular_graph_degree.csv
      - run: python scripts/environment_mosaic_two_patch.py --r-source 0.5 --r-sink -1.5 --m-min 0 --m-max 1.5 --step 0.15 --output outputs/ci_environment_mosaic_two_patch.csv
      - run: python scripts/spatial_environment_threshold_sweep.py --phi-source 0.6 --phi-sink -1.0 --alpha 1.0 --m-min 0 --m-max 2.0 --step 0.2 --output outputs/ci_spatial_environment_thresholds.csv
      - run: python scripts/two_patch_floquet_sweep.py --m-min 0 --m-max 0.8 --step 0.1 --output outputs/ci_two_patch_floquet.csv
      - run: python scripts/two_season_temporal_premium_sweep.py --m-min 0 --m-max 0.6 --m-step 0.2 --period-min 0.1 --period-max 0.5 --period-step 0.2 --output outputs/ci_two_season_temporal_premium.csv
      - run: python scripts/anti_phase_temporal_sweep.py --mean-margin -0.08 --contrast-half-amplitude 1.5 --season-duration 1.0 --m-min 0 --m-max 1.0 --step 0.2 --output outputs/ci_anti_phase_temporal.csv
      - run: python scripts/temporal_coordination_phase_sweep.py --eta 0.1 --phi-bar 0 --season-duration 1 --u-min 0 --u-max 3 --u-step 0.5 --ratio-min 0 --ratio-max 12 --ratio-step 2 --output outputs/ci_temporal_coordination_phase.csv
      - run: python scripts/continuous_architecture_sweep.py --max-recovery 2 --linear-cost-slope 0.4 --curvature 1 --gamma-min -1.0 --gamma-max 0.2 --step 0.25 --output outputs/ci_continuous_architecture.csv
      - run: python scripts/topology_landscape_sweep.py --gamma -0.5 --population-size 20 --beta 0.4 --mutation-rate 0.01 --output outputs/ci_topology_landscape.csv
      - run: python scripts/three_function_topology_example.py --edge-cost 0.4 --topologies-output outputs/ci_three_function_topologies.csv --path-output outputs/ci_three_function_release_path.csv
      - run: python scripts/three_function_population_example.py --edge-cost 0.4 --gamma -0.25 --population-size 20 --beta 0.4 --output outputs/ci_three_function_population.csv
      - run: python scripts/predict_modular_topology.py --functions examples/three_function/functions.csv --edges examples/three_function/edges.csv --output-dir outputs/ci_generic_topology
      - run: python scripts/topology_uncertainty_ensemble.py --input examples/three_function/ensemble.json --output-dir outputs/ci_topology_ensemble
      - run: python scripts/identify_hard_module_cost.py --input examples/three_function/hard_module_worldlines.csv --output-dir outputs/ci_hard_module_cost
      - run: python scripts/validate_hard_module_cost_out_of_sample.py --input examples/three_function/hard_module_worldlines_validation.csv --output-dir outputs/ci_hard_module_validation
      - run: python scripts/hard_module_end_to_end.py --functions examples/three_function/functions.csv --worldlines examples/three_function/hard_module_end_to_end_worldlines.csv --output-dir outputs/ci_hard_module_end_to_end
      - run: python scripts/validate_hard_partition_feedback.py --functions examples/three_function/functions.csv --pairs examples/three_function/hard_partition_feedback_validation.csv --kappa 1.0 --output-dir outputs/ci_hard_partition_feedback
      - run: python scripts/predict_hard_module_partition.py --functions examples/three_function/functions.csv --extra-module-cost 1.0 --output-dir outputs/ci_hard_modules
      - run: python scripts/migration_phenology_phase_sweep.py --climate-velocities 0.02,0.04 --partner-spatial-shares 0,0.5,1 --max-rate 0.8 --grid-points 5 --steps 60 --burn-in 10 --output outputs/ci_migration_phenology_phase.csv
      - run: python scripts/migration_phenology_stochastic_sweep.py --samples 2 --replicates 2 --strategy-points 3 --max-rate 0.6 --steps 40 --burn-in 10 --output outputs/ci_migration_phenology_stochastic.csv
      - run: python scripts/migration_phenology_coevolution_sweep.py --interaction-strengths 0,0.3 --cost-biases 0,0.08 --steps 60 --burn-in 10 --mutation-step 0.2 --max-rate 0.8 --max-cycles 20 --output outputs/ci_migration_phenology_coevolution.csv
      - run: python scripts/migration_phenology_population_barrier_sweep.py --interaction-strengths 0,0.3 --cost-biases 0,0.08 --climate-velocities 0.04 --steps 60 --burn-in 10 --mutation-step 0.2 --max-rate 0.8 --max-cycles 20 --replicates 4 --initial-population 30 --carrying-capacity 60 --density-coefficient 0.12 --extinction-threshold 1 --output outputs/ci_migration_phenology_population_barriers.csv
      - run: python scripts/migration_phenology_population_stress_sweep.py --interaction-strengths 0.3 --cost-biases 0.08 --climate-velocities 0.04 --baseline-growths 0.04,0.12 --carrying-capacities 30,100 --steps 50 --burn-in 10 --mutation-step 0.2 --max-rate 0.8 --max-cycles 20 --replicates 2 --output outputs/ci_migration_phenology_population_stress.csv
      - run: python scripts/migration_phenology_finite_occupancy.py --population-sizes 10,30 --selection-strengths 2,5 --partner-spatial-shares 0,1 --steps 50 --burn-in 10 --max-rate 0.8 --grid-points 5 --output outputs/ci_migration_phenology_finite_occupancy.csv
      - run: python scripts/migration_phenology_drift_escape.py --population-sizes 10,30 --selection-strengths 5 --interaction-strength 0.3 --cost-bias 0.08 --base-cost 0.08 --steps 50 --burn-in 10 --max-rate 0.8 --grid-points 5 --mutation-events 200 --evolutionary-burn-in 20 --replicates 2 --output outputs/ci_migration_phenology_drift_escape.csv
      - run: python scripts/migration_phenology_moving_landscape.py --climate-velocities 0.02,0.06 --phenology-limits 0,2 --patches 21 --steps 50 --burn-in 10 --max-migration-rate 0.8 --max-phenology-rate 0.8 --migration-points 3 --phenology-points 3 --output outputs/ci_migration_phenology_moving_landscape.csv
      - run: python scripts/migration_phenology_2d_corridor.py --climate-velocities 0.02 --phenology-limits 0,2 --gap-widths 1,11 --width 21 --height 11 --barrier-x-offset 3 --steps 40 --burn-in 10 --max-migration-rate 0.6 --max-phenology-rate 0.6 --migration-points 3 --phenology-points 3 --output outputs/ci_migration_phenology_2d_corridor.csv
      - run: python scripts/migration_phenology_2d_gate_audit.py --interaction-strength 1.0 --climate-velocity 0.06 --phenology-limit 4 --width 31 --height 15 --first-wall-offset 3 --second-wall-offset 7 --detour-offset 5 --gap-width 1 --migration-cost 0.10 --phenology-cost 0.02 --baseline-growth 0.35 --initial-total-abundance 400 --local-carrying-capacity 80 --density-coefficient 0.35 --steps 100 --burn-in 20 --resident-migration 0.2 --resident-phenology 0 --neighbor-migration 0.2 --neighbor-phenology 0.2
      - run: python scripts/migration_phenology_2d_anisotropy.py --y-weight-ratios 1,0.25 --climate-velocities 0.05 --phenology-limits 0,4 --width 15 --height 9 --first-wall-offset 2 --second-wall-offset 5 --detour-offset 3 --gap-width 1 --initial-total-abundance 120 --local-carrying-capacity 40 --steps 40 --burn-in 10 --migration-points 3 --phenology-points 3 --output outputs/ci_payoff_b_2d_anisotropy.csv
      - run: python scripts/parameterize_migration_phenology_tracking.py --variance-x 0.08 --variance-y 0.02 --patch-spacing 0.5 --spatial-gradient 0.2 --wave-speed 0.3 --phenology-correction-fraction 0.25 --phenology-scale 0.1 --max-abs-phenology-shift 20 --output outputs/ci_payoff_b_empirical_tracking_parameterization.json
      - run: python scripts/parameterize_migration_phenology_fitness.py --baseline-growth 0.4 --abiotic-growth 0.25 --abiotic-mismatch 0.5 --interaction-growth 0.336 --interaction-mismatch 0.4 --migration-growth 0.364 --migration-rate 0.6 --phenology-growth 0.3755 --phenology-rate 0.7 --joint-growth 0.3645 --joint-migration-rate 0.4 --joint-phenology-rate 0.5 --output outputs/ci_payoff_b_tracking_fitness_parameterization.json
      - run: python scripts/migration_phenology_2d_bypass_capacity.py --phenology-limits 0,2,4 --phenology-rates 0,0.16666666666666666,0.3333333333333333 --width 31 --height 15 --barrier-x-offset 3 --spatial-gradient 0.20 --baseline-growth 0.30 --phenology-cost 0.03 --steps 100
      - run: python scripts/migration_phenology_2d_partner_asymmetry.py --cost-biases=-0.08,0.08 --interaction-strengths 0,1 --width 15 --height 9 --first-wall-offset 2 --second-wall-offset 5 --detour-offset 3 --gap-width 1 --climate-velocity 0.04 --phenology-limit 3 --steps 40 --burn-in 10 --mutation-step 0.2 --max-rate 0.6 --max-cycles 20 --output outputs/ci_migration_phenology_2d_partner_asymmetry.csv
      - run: python scripts/migration_phenology_2d_zigzag.py --climate-velocities 0.03 --phenology-limits 0,2 --gap-widths 1 --width 21 --height 11 --first-wall-offset 2 --second-wall-offset 5 --detour-offset 3 --steps 40 --burn-in 10 --max-migration-rate 0.6 --max-phenology-rate 0.6 --migration-points 3 --phenology-points 3 --output outputs/ci_migration_phenology_2d_zigzag.csv
      - run: python scripts/migration_phenology_2d_coevolution.py --interaction-strengths 0,0.5 --climate-velocities 0.03 --phenology-limits 2 --width 15 --height 9 --first-wall-offset 2 --second-wall-offset 4 --detour-offset 2 --gap-width 1 --steps 40 --burn-in 10 --mutation-step 0.3 --max-migration-rate 0.6 --max-phenology-rate 0.6 --max-cycles 12 --output outputs/ci_migration_phenology_2d_coevolution.csv
      - run: python scripts/migration_phenology_landscape_coevolution.py --interaction-strengths 0,0.5 --cost-biases 0.08 --climate-velocities 0.03 --phenology-limits 2 --patches 21 --steps 50 --burn-in 10 --mutation-step 0.2 --max-migration-rate 0.8 --max-phenology-rate 0.8 --max-cycles 20 --output outputs/ci_migration_phenology_landscape_coevolution.csv
      - run: python scripts/migration_phenology_landscape_gate_audit.py --interaction-strength 0.5 --migration-cost 0.10 --phenology-cost 0.02 --climate-velocity 0.05 --phenology-limit 4 --patches 31 --steps 120 --burn-in 30 --resident-migration 0.2 --resident-phenology 0 --mutation-step 0.2
      - run: python scripts/migration_phenology_landscape_frontier.py --climate-velocities 0.02,0.04 --phenology-limits 0,2 --patches 21 --steps 50 --burn-in 10 --max-migration-rate 0.8 --max-phenology-rate 0.8 --migration-points 3 --phenology-points 3 --output outputs/ci_landscape_frontier_grid.csv --frontier-output outputs/ci_landscape_frontier_summary.csv
