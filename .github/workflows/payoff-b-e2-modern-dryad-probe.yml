name: PAYOFF-B E2 modern Dryad source probe

on:
  push:
    branches:
      - analysis/payoff-b-e2-modern-dryad-probe-20260930
    paths:
      - 'scripts/payoff_b_e2_modern_dryad_probe.py'
      - 'data/payoff_b_e2_modern_dryad_probe_contract_20260930.json'
      - '.github/workflows/payoff-b-e2-modern-dryad-probe.yml'
  pull_request:
    paths:
      - 'scripts/payoff_b_e2_modern_dryad_probe.py'
      - 'data/payoff_b_e2_modern_dryad_probe_contract_20260930.json'
      - '.github/workflows/payoff-b-e2-modern-dryad-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests pandas
      - run: >
          python scripts/payoff_b_e2_modern_dryad_probe.py
          --output outputs/e2_modern_dryad_probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-e2-modern-dryad-probe
          path: outputs/e2_modern_dryad_probe.json
          if-no-files-found: error
