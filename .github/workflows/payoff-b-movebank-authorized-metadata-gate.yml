name: PAYOFF-B Movebank authorized metadata gate

on:
  push:
    branches:
      - ops/payoff-b-movebank-secret-metadata-gate-20261001
    paths:
      - 'scripts/probe_movebank_authorized_secret_gate.py'
      - 'scripts/fetch_greater_snow_goose_movebank_authorized.py'
      - 'tests/test_movebank_authorized_secret_gate.py'
      - '.github/workflows/payoff-b-movebank-authorized-metadata-gate.yml'
  pull_request:
    paths:
      - 'scripts/probe_movebank_authorized_secret_gate.py'
      - 'scripts/fetch_greater_snow_goose_movebank_authorized.py'
      - 'tests/test_movebank_authorized_secret_gate.py'
      - '.github/workflows/payoff-b-movebank-authorized-metadata-gate.yml'
  workflow_dispatch:

concurrency:
  group: payoff-b-movebank-authorized-metadata-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  metadata-gate:
    runs-on: ubuntu-latest
    env:
      MOVEBANK_USERNAME: ${{ secrets.MOVEBANK_USERNAME }}
      MOVEBANK_PASSWORD: ${{ secrets.MOVEBANK_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest requests
      - run: python -m pytest -q tests/test_movebank_authorized_secret_gate.py
      - name: Probe authenticated metadata only
        run: >
          python scripts/probe_movebank_authorized_secret_gate.py
          --output "$RUNNER_TEMP/payoff_b_movebank_gate/gate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-movebank-authorized-metadata-gate
          path: ${{ runner.temp }}/payoff_b_movebank_gate/gate.json
          if-no-files-found: error
