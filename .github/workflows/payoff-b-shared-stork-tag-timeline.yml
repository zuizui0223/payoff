name: payoff-b-shared-stork-tag-date-audit
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_shared_tag_timeline.py"
      - "tests/test_payoff_b_shared_tag_timeline.py"
      - "docs/PAYOFF_B_SHARED_STORK_TAG_CHRONOLOGY_LOCK_20261022.md"
      - ".github/workflows/payoff-b-shared-stork-tag-timeline.yml"
jobs:
  original-tag-reference-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source date fields and hard original overlapping-ID gate
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_shared_tag_timeline.py
      - name: Compare public deployment periods for shared study tag IDs
        run: |
          python -m scripts.qc_payoff_b_shared_tag_timeline --out outputs/payoff_b_tag_timeline
      - name: Save only aggregated tracker and animal relation counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stork-study-shared-tag-timeline
          path: outputs/payoff_b_tag_timeline/
          if-no-files-found: warn
