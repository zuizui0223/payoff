name: payoff-b-sweden-dryad-readiness

on:
  push:
    branches:
      - feature/payoff-b-natural-hysteresis-gate-20260926
    paths:
      - ".github/workflows/payoff-b-sweden-dryad-readiness.yml"

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Dryad metadata and file
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p outputs/sweden
          curl -fL --retry 3 \
            "https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.sq651" \
            -o outputs/sweden/dataset.json || true
          curl -fL --retry 3 \
            "https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.sq651/versions" \
            -o outputs/sweden/versions.json || true
          curl -fL --retry 3 \
            "https://datadryad.org/dataset/doi%3A10.5061/dryad.sq651" \
            -o outputs/sweden/page.html || true
          grep -Eo "api/v2/files/[0-9]+/download|files/[0-9]+|All laydate.xlsx" outputs/sweden/page.html 2>/dev/null | sort -u > outputs/sweden/links.txt || true
          cat outputs/sweden/dataset.json 2>/dev/null || true
          cat outputs/sweden/links.txt 2>/dev/null || true
      - name: Try file links discovered from API
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib, re, subprocess
          root=pathlib.Path("outputs/sweden")
          ids=[]
          for name in ("dataset.json","versions.json"):
              p=root/name
              if not p.exists(): continue
              text=p.read_text(errors="ignore")
              ids += re.findall(r'"id"\s*:\s*(\d+)', text)
              ids += re.findall(r'/files/(\d+)', text)
          ids=list(dict.fromkeys(ids))
          (root/"candidate_ids.txt").write_text("\n".join(ids)+"\n")
          for fid in ids:
              url=f"https://datadryad.org/api/v2/files/{fid}/download"
              out=root/f"file_{fid}"
              proc=subprocess.run(["curl","-fL","--retry","2",url,"-o",str(out)])
              if proc.returncode==0 and out.stat().st_size>1000:
                  subprocess.run(["file",str(out)])
          PY
          find outputs/sweden -maxdepth 1 -type f -printf "%f\t%s\n" | sort > outputs/sweden/files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-sweden-dryad-readiness
          path: outputs/sweden/
          if-no-files-found: error
