name: payoff-b-sweden-dryad-readiness

on:
  push:
    branches:
      - feature/payoff-b-natural-hysteresis-gate-20260926
    paths:
      - ".github/workflows/payoff-b-sweden-dryad-readiness.yml"

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe Dryad metadata and file
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p outputs/sweden
          curl -fL --retry 3 \
            "https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.sq651" \
            -o outputs/sweden/dataset.json || true
          curl -fL --retry 3 \
            "https://datadryad.org/api/v2/datasets/doi%3A10.5061%2Fdryad.sq651/versions" \
            -o outputs/sweden/versions.json || true
          curl -fL --retry 3 \
            "https://datadryad.org/api/v2/versions/7042/files" \
            -o outputs/sweden/version_files.json
          curl -fL --retry 3 \
            "https://datadryad.org/dataset/doi%3A10.5061/dryad.sq651" \
            -o outputs/sweden/page.html || true
          grep -Eo "api/v2/files/[0-9]+/download|files/[0-9]+|All laydate.xlsx" outputs/sweden/page.html 2>/dev/null | sort -u > outputs/sweden/links.txt || true
          cat outputs/sweden/dataset.json 2>/dev/null || true
          cat outputs/sweden/links.txt 2>/dev/null || true
      - name: Download public Dryad file stream
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://datadryad.org/downloads/file_stream/34004" \
            -o "outputs/sweden/All laydate.xlsx"
          echo "50bb3503258e5f8ce4db043d0bfe895d  outputs/sweden/All laydate.xlsx" | md5sum -c -
          file "outputs/sweden/All laydate.xlsx"
          python -m pip install --disable-pip-version-check pandas openpyxl statsmodels
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          p=Path("outputs/sweden/All laydate.xlsx")
          xls=pd.ExcelFile(p)
          out={"sheets":xls.sheet_names,"tables":{}}
          for sheet in xls.sheet_names:
              df=pd.read_excel(p,sheet_name=sheet)
              out["tables"][sheet]={
                  "rows":int(len(df)),
                  "columns":[str(c) for c in df.columns],
                  "head":df.head(8).astype(object).where(pd.notna(df),None).to_dict(orient="records")
              }
              df.to_csv(Path("outputs/sweden")/f"{sheet}.csv",index=False)
          Path("outputs/sweden/workbook_audit.json").write_text(json.dumps(out,indent=2,default=str)+"\n")
          PY
          python scripts/payoff_b_sweden_resident_migrant_timing.py \
            --input "outputs/sweden/All laydate.xlsx" \
            --output-json outputs/sweden/sweden_long_term_timing_result.json \
            --paired-output outputs/sweden/sweden_resident_migrant_pairs.csv
          find outputs/sweden -maxdepth 1 -type f -printf "%f\t%s\n" | sort > outputs/sweden/files.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-sweden-dryad-readiness
          path: outputs/sweden/
          if-no-files-found: error
