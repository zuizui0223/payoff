name: PAYOFF-B Curlew original Dryad source-grain gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/payoff-b-curlew-source-grain.yml'
      - 'scripts/payoff_b_curlew_dryad_source_gate.py'
      - 'tests/test_payoff_b_curlew_dryad_source_gate.py'
      - 'docs/PAYOFF_B_CURLEW_SOURCE_GRAIN_FREEZE_20261119.md'
  push:
    branches:
      - analysis/payoff-b-curlew-source-grain-gate-20261119
    paths:
      - '.github/workflows/payoff-b-curlew-source-grain.yml'
      - 'scripts/payoff_b_curlew_dryad_source_gate.py'
      - 'tests/test_payoff_b_curlew_dryad_source_gate.py'
      - 'docs/PAYOFF_B_CURLEW_SOURCE_GRAIN_FREEZE_20261119.md'

permissions:
  contents: read

jobs:
  dryad-read-only-source-grain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-source-only dependencies
        run: python -m pip install --disable-pip-version-check pytest requests
      - name: Tests with synthetic source semantics (NO ecological effect)
        run: python -m pytest -q tests/test_payoff_b_curlew_dryad_source_gate.py
      - name: Original public Dryad metadata and bounded CSV-in-ZIP Range gate
        run: |
          python -m scripts.payoff_b_curlew_dryad_source_gate \
            --output outputs/payoff_b_curlew_source_grain_20261119.json
      - name: Publish only source metadata, access status and aggregate eligibility
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-curlew-source-grain-20261119
          path: outputs/payoff_b_curlew_source_grain_20261119.json
          if-no-files-found: warn
