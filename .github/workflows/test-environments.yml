name: test-environments

concurrency:
  group: payoff-b-test-environments-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  pandas-without-statsmodels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandas/scipy without statsmodels
        run: python -m pip install --disable-pip-version-check pytest pandas scipy
      - name: Verify dynamic loaders and graceful empirical skips
        run: >
          pytest -q
          tests/test_dynamic_test_module_loaders.py
          tests/test_cv24c_cue_driver.py
          tests/test_barnacle_goose_phase_error_calibration.py
          tests/test_barnacle_phase_error_calibration.py

  empirical-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared empirical test environment
        run: python -m pip install --disable-pip-version-check -e ".[test,empirical]"
      - name: Verify lambda estimators execute without skips
        shell: bash
        run: |
          set -euo pipefail
          result="$(pytest -q -rs \
            tests/test_phase_retention_contrast_fit.py \
            tests/test_barnacle_goose_phase_error_calibration.py \
            tests/test_barnacle_phase_error_calibration.py \
            tests/test_wigeon_phase_error_calibration.py)"
          printf '%s\n' "$result"
          if grep -Eq '[0-9]+ skipped' <<<"$result"; then
            echo "lambda estimator tests must execute, not skip, in the empirical environment" >&2
            exit 1
          fi
      - name: Run Ortega within-animal empirical tests (no skips allowed)
        shell: bash
        run: |
          set -euo pipefail
          result="$(pytest -q -rs tests/test_ortega_within_animal.py)"
          printf '%s\n' "$result"
          if grep -Eq '[0-9]+ skipped' <<<"$result"; then
            echo "Within-animal tests must execute under empirical extras" >&2
            exit 1
          fi
      - name: Run full pytest suite with empirical dependencies enabled
        run: pytest -q

  deer-calendar-support:
    if: github.head_ref == 'analysis/payoff-b-deer-calendar-vs-phase-20261122' || github.ref_name == 'analysis/payoff-b-deer-calendar-vs-phase-20261122'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only NumPy for outcome-blind design screening
        run: python -m pip install --disable-pip-version-check numpy
      - name: Authenticate original data and check collinearity BEFORE the coefficient
        run: |
          python scripts/payoff_b_deer_calendar_discrimination.py \
            --support-only \
            --output outputs/payoff_b_deer_calendar_support_20261122.json
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-deer-calendar-support-only
          path: outputs/payoff_b_deer_calendar_support_20261122.json
