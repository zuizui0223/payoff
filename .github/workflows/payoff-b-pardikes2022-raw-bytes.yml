name: PAYOFF-B Pardikes 2022 raw bytes gate
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/payoff-b-pardikes2022-raw-bytes.yml'
      - 'scripts/payoff_b_pardikes2022_raw_bytes_wave17_20261125.py'
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'analysis/payoff-b-interaction-buffering-meta-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: python scripts/payoff_b_pardikes2022_raw_bytes_wave17_20261125.py outputs/payoff_b_pardikes2022_raw_bytes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-pardikes2022-raw-bytes
          path: outputs/payoff_b_pardikes2022_raw_bytes.json
          if-no-files-found: warn
