name: PAYOFF-B global migratory tracking source-schema gate
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-global-tracking-information-20261117
    paths:
      - "scripts/payoff_b_brlik_global_tracking_source_gate.py"
      - "tests/test_payoff_b_brlik_global_tracking_source_gate.py"
      - ".github/workflows/payoff-b-global-tracking-source.yml"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pure-source test requirements
        run: python -m pip install pytest
      - name: Run synthetic checksum and schema admission tests
        run: python -m pytest -q tests/test_payoff_b_brlik_global_tracking_source_gate.py
      - name: Inspect Zenodo paper-concept and v3 original source files
        run: python -m scripts.payoff_b_brlik_global_tracking_source_gate --output outputs/global_tracking/brlik_source_gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-global-tracking-original-source-gate
          path: outputs/global_tracking/brlik_source_gate.json
          if-no-files-found: warn
