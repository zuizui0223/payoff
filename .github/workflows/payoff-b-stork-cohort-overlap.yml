name: payoff-b-public-stork-cohort-reuse-audit
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_stork_cohort_overlap.py"
      - "tests/test_payoff_b_stork_cohort_overlap.py"
      - "docs/PAYOFF_B_STORK_COHORT_OVERLAP_GATE_20261022.md"
      - ".github/workflows/payoff-b-stork-cohort-overlap.yml"
jobs:
  published-reference-cohort-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test overlap without publishing animal identities
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_stork_cohort_overlap.py
      - name: Verify two original CC0 reference checksums and join study subject IDs
        run: |
          python -m scripts.qc_payoff_b_stork_cohort_overlap \
            --out outputs/payoff_b_stork_cohort_overlap
      - name: Archive aggregate overlap counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-2016-2018-white-stork-published-cohort-overlap
          path: outputs/payoff_b_stork_cohort_overlap/
          if-no-files-found: warn
