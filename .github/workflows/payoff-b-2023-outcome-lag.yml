name: PAYOFF-B Dryad 2023 outcome and lag sensitivity
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-2023-outcome-lag-sensitivity-20261115
    paths:
      - "scripts/payoff_b_2023_outcome_lag_sensitivity.py"
      - ".github/workflows/payoff-b-2023-outcome-lag.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl numpy
      - run: python -m scripts.payoff_b_2023_outcome_lag_sensitivity --output outputs/dryad/2023_outcome_lag_sensitivity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-2023-outcome-lag-sensitivity
          path: outputs/dryad/2023_outcome_lag_sensitivity.json
          if-no-files-found: warn
