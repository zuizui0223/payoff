name: payoff-b-ruppel-rdata-real-object-schema

on:
  push:
    branches:
      - analysis/payoff-b-goose-staging-calendar-null-20261008
    paths:
      - 'scripts/payoff_b_ruppel_fetch_verified_zip.py'
      - 'scripts/payoff_b_ruppel_rdata_schema.R'
      - '.github/workflows/payoff-b-ruppel-rdata-real-object-schema.yml'
  pull_request:
    paths:
      - 'scripts/payoff_b_ruppel_fetch_verified_zip.py'
      - 'scripts/payoff_b_ruppel_rdata_schema.R'
      - '.github/workflows/payoff-b-ruppel-rdata-real-object-schema.yml'

jobs:
  structural-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: false
      - name: Synthetic pinned source checksum failure test
        run: python scripts/payoff_b_ruppel_fetch_verified_zip.py --self-test
      - name: Synthetic R column schema test
        run: Rscript scripts/payoff_b_ruppel_rdata_schema.R --self-test
      - name: Download and verify author Figshare ZIP against MD5 and SHA256
        run: python scripts/payoff_b_ruppel_fetch_verified_zip.py
      - name: Inspect two real RData object structures and original code (no source outcomes)
        run: Rscript scripts/payoff_b_ruppel_rdata_schema.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-ruppel-original-RData-schema-only
          path: |
            outputs/payoff_b_ruppel_original_object_schema.csv
            outputs/payoff_b_ruppel_original_column_schema.csv
            outputs/payoff_b_ruppel_author_Rmd_source_structure.txt
          if-no-files-found: warn
