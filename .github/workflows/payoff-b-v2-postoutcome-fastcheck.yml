name: PAYOFF-B V2 postoutcome fastcheck

on:
  push:
    branches:
      - feature/payoff-b-v2-postoutcome-pipeline-20260927
    paths:
      - "scripts/build_payoff_b_v2_geb_postoutcome_*"
      - "scripts/build_payoff_b_v2_geb_source.py"
      - "scripts/build_payoff_b_v2_geb_supporting_information.py"
      - "scripts/render_aikens_lambda_manuscript.py"
      - "scripts/render_information_deadlines_figures.py"
      - "submission/GEB_V2_*POSTOUTCOME*"
      - "tests/test_payoff_b_v2_postoutcome_package.py"
      - "tests/test_aikens_full_workflow_order.py"
      - ".github/workflows/payoff-b-aikens-appeears-full-extraction.yml"
      - ".github/workflows/payoff-b-v2-postoutcome-fastcheck.yml"
  pull_request:
    paths:
      - "scripts/build_payoff_b_v2_geb_postoutcome_*"
      - "scripts/build_payoff_b_v2_geb_source.py"
      - "scripts/build_payoff_b_v2_geb_supporting_information.py"
      - "scripts/render_aikens_lambda_manuscript.py"
      - "scripts/render_information_deadlines_figures.py"
      - "submission/GEB_V2_*POSTOUTCOME*"
      - "tests/test_payoff_b_v2_postoutcome_package.py"
      - "tests/test_aikens_full_workflow_order.py"
      - ".github/workflows/payoff-b-aikens-appeears-full-extraction.yml"
      - ".github/workflows/payoff-b-v2-postoutcome-fastcheck.yml"

jobs:
  fastcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify V2 postoutcome invariance and active workflow routing
        run: >
          pytest -q
          tests/test_payoff_b_v2_postoutcome_package.py
          tests/test_aikens_full_workflow_order.py
