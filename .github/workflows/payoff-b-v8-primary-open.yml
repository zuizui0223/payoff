name: payoff-b-v8-primary-open

on:
  push:
    branches:
      - analysis/payoff-b-v8-primary-open-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_primary_environmental_change.R"
      - ".github/workflows/payoff-b-v8-primary-open.yml"
      - "docs/PAYOFF_B_V8_PREDICTIVE_CONNECTIVITY_DEGRADATION_CONTRACT_20261005.md"
      - "analysis/movement_phenology/payoff_b_v8_admission_gate.R"

jobs:
  v8-primary-open:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run frozen V8 primary environmental analysis
        run: Rscript analysis/movement_phenology/payoff_b_v8_primary_environmental_change.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-primary-open
          path: |
            outputs/payoff_b_v8_primary_summary.csv
            outputs/payoff_b_v8_primary_spatial_pairs_all.csv
            outputs/payoff_b_v8_primary_spatial_pairs_estimable.csv
            outputs/payoff_b_v8_primary_species_pair_incidence.csv
            outputs/payoff_b_v8_primary_species_summary.csv
            outputs/payoff_b_v8_primary_bootstrap.csv
          if-no-files-found: error
