name: payoff-b-v8-matched-between-within

on:
  push:
    branches:
      - analysis/payoff-b-v8-transfer-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_matched_between_within.R"
      - "analysis/movement_phenology/payoff_b_v8_downstream_transfer_primary.R"
      - "docs/PAYOFF_B_V8_MATCHED_BETWEEN_WITHIN_CONTRACT_20261005.md"
      - ".github/workflows/payoff-b-v8-matched-between-within.yml"

jobs:
  v8-matched-between-within:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run matched V8 between-within decomposition
        run: Rscript analysis/movement_phenology/payoff_b_v8_matched_between_within.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-matched-between-within
          path: |
            outputs/payoff_b_v8_matched_between_within_summary.csv
            outputs/payoff_b_v8_matched_between_within_panel.csv
            outputs/payoff_b_v8_matched_between_within_bootstrap.csv
          if-no-files-found: error
