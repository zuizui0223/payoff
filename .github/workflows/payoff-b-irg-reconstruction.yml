name: payoff-b IRG reconstruction

on:
  push:
    paths:
      - 'src/irg_reconstruction.py'
      - 'scripts/fit_peak_irg_from_ndvi.py'
      - 'tests/test_irg_reconstruction.py'
      - 'pyproject.toml'
      - '.github/workflows/payoff-b-irg-reconstruction.yml'
  pull_request:
    paths:
      - 'src/irg_reconstruction.py'
      - 'scripts/fit_peak_irg_from_ndvi.py'
      - 'tests/test_irg_reconstruction.py'
      - 'pyproject.toml'
      - '.github/workflows/payoff-b-irg-reconstruction.yml'
  workflow_dispatch:

jobs:
  irg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IRG reconstruction dependencies
        run: python -m pip install --disable-pip-version-check -e ".[test,irg]"
      - name: Test IRG reconstruction
        run: pytest -q tests/test_irg_reconstruction.py
      - name: Build synthetic MODIS-like NDVI fixture
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          from src.irg_reconstruction import (
              DoubleLogisticParameters,
              double_logistic_ndvi,
          )

          output = Path("outputs/ci_synthetic_modis_ndvi.csv")
          output.parent.mkdir(parents=True, exist_ok=True)
          params = DoubleLogisticParameters(
              alpha=0.05,
              beta=0.85,
              gamma=0.08,
              delta=120.0,
              epsilon=0.04,
              theta=285.0,
          )
          with output.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=[
                      "pixel_id",
                      "year",
                      "doy",
                      "ndvi",
                      "snow_free",
                      "quality_good",
                  ],
              )
              writer.writeheader()
              for doy in range(1, 362, 8):
                  writer.writerow(
                      {
                          "pixel_id": "synthetic_pixel",
                          "year": 2020,
                          "doy": doy,
                          "ndvi": double_logistic_ndvi(float(doy), params),
                          "snow_free": int(doy >= 73),
                          "quality_good": 1,
                      }
                  )
          PY
      - name: Reconstruct synthetic peak IRG
        run: >
          python scripts/fit_peak_irg_from_ndvi.py
          outputs/ci_synthetic_modis_ndvi.csv
          --modis-product MOD09Q1.006
          --output outputs/ci_peak_irg.csv
          --receipt-output outputs/ci_peak_irg_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-irg-reconstruction
          path: |
            outputs/ci_synthetic_modis_ndvi.csv
            outputs/ci_peak_irg.csv
            outputs/ci_peak_irg_receipt.json
