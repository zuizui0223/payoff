name: payoff-b Aikens IID target coverage support

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-aikens-iid-target-coverage.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen fixed-target artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/source
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10676913354/zip" \
            -o outputs/aikens_support_ceiling.zip
          echo "ab88ade2ec53c8f91b1a2099d58ad210ad57ab80d826375938c94bfe8689efa2  outputs/aikens_support_ceiling.zip" | sha256sum -c -
          unzip -q outputs/aikens_support_ceiling.zip aikens_primary_fixed_gps_targets.csv -d outputs/source
      - name: Run exact IID target-coverage support audit
        run: >
          python scripts/audit_fixed_target_coverage_support.py
          outputs/source/aikens_primary_fixed_gps_targets.csv
          --probabilities 0.25,0.3,0.32,0.34,0.342,0.35,0.4,1
          --target-joint-support-probability 0.95
          --min-animals-per-group 10
          --min-pairs-per-group 100
          --threshold-tolerance 0.0001
          --output outputs/aikens_iid_target_coverage_support.json
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-aikens-iid-target-coverage-support
          path: outputs/aikens_iid_target_coverage_support.json
