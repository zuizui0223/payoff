name: PAYOFF-B dual-use information theorem

on:
  push:
    branches:
      - theory/payoff-b-dual-use-information-20260929
    paths:
      - 'src/dual_use_information_value.py'
      - 'tests/test_dual_use_information_value.py'
      - 'theory/DUAL_USE_INFORMATION_VALUE.md'
      - '.github/workflows/payoff-b-dual-use-information.yml'
  pull_request:
    paths:
      - 'src/dual_use_information_value.py'
      - 'tests/test_dual_use_information_value.py'
      - 'theory/DUAL_USE_INFORMATION_VALUE.md'
      - '.github/workflows/payoff-b-dual-use-information.yml'
  workflow_dispatch:

concurrency:
  group: payoff-b-dual-use-information-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  theorem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: >
          python -m pytest -q
          tests/test_dual_use_information_value.py
          tests/test_endogenous_information_timing.py
          tests/test_compensated_information_deadline.py
