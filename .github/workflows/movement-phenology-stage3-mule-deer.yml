name: Movement-phenology Stage 3 mule deer source audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_mule_deer_source_probe.py'
      - '.github/workflows/movement-phenology-stage3-mule-deer.yml'
  pull_request:
    paths:
      - 'analysis/movement_phenology/stage3_mule_deer_source_probe.py'
      - 'docs/MOVEMENT_PHENOLOGY_STAGE3_VALIDATION_REGISTRY.md'
      - '.github/workflows/movement-phenology-stage3-mule-deer.yml'

jobs:
  source-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook readers
        run: python -m pip install --disable-pip-version-check pandas openpyxl scipy statsmodels

      - name: Download official Nature Communications source data
        run: |
          mkdir -p external/mule_deer_ortega_2023
          curl --fail --location --retry 3 \
            'https://media.springernature.com/original/springer-static/esm/art%3A10.1038%2Fs41467-023-37750-z/MediaObjects/41467_2023_37750_MOESM4_ESM.xlsx' \
            --output external/mule_deer_ortega_2023/source_data.xlsx
          test -s external/mule_deer_ortega_2023/source_data.xlsx
          file external/mule_deer_ortega_2023/source_data.xlsx
          sha256sum external/mule_deer_ortega_2023/source_data.xlsx

      - name: Inventory published source-data workbook
        run: python analysis/movement_phenology/stage3_mule_deer_source_probe.py

      - name: Test phase-error feedback in mule deer
        run: python analysis/movement_phenology/stage3_mule_deer_phase_feedback.py

      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-stage3-mule-deer-source-audit
          path: |
            outputs/movement_phenology/stage3_mule_deer_source_inventory.json
            outputs/movement_phenology/stage3_mule_deer_source_inventory.csv
            outputs/movement_phenology/stage3_mule_deer_phase_feedback.json
            outputs/movement_phenology/stage3_mule_deer_phase_feedback.csv
            outputs/movement_phenology/stage3_mule_deer_feedback_by_year.csv
            outputs/movement_phenology/stage3_mule_deer_joined_source_data.csv
            outputs/movement_phenology/stage3_mule_deer_*_summary.txt
          if-no-files-found: error
