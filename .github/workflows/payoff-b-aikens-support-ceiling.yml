name: payoff-b Aikens pre-environment support ceiling

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-aikens-support-ceiling.yml

permissions:
  contents: read
  actions: read

jobs:
  ceiling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install manifest dependencies
        run: python -m pip install --disable-pip-version-check -e ".[earthdata]"

      - name: Download frozen raw-GPS artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/source
          curl -fL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10643405042/zip"             -o outputs/aikens_raw_gps_source.zip
          echo "1f0d706dc6a102261009b7099c748dcce40abb2adedf7b88828395a1d392cfa0  outputs/aikens_raw_gps_source.zip" | sha256sum -c -
          unzip -q outputs/aikens_raw_gps_source.zip             stage3_industrial_mule_deer_gps.csv             -d outputs/source
          echo "03426804557a0244be3ed6eb9f461db578d3ce26fa2b28637f8e98bee9f09466  outputs/source/stage3_industrial_mule_deer_gps.csv" | sha256sum -c -

      - name: Rebuild frozen exact GPS-to-MODIS identity
        run: >
          python scripts/build_aikens_appeears_manifest.py
          outputs/source/stage3_industrial_mule_deer_gps.csv
          --source-crs EPSG:32613
          --max-points-per-task 1000
          --manifest-output outputs/aikens_exact_appeears_v061_manifest.json
          --cells-output outputs/aikens_exact_modis250_cells.csv
          --links-output outputs/aikens_exact_gps_modis250_links.csv
          --receipt-output outputs/aikens_exact_appeears_v061_manifest_receipt.json

      - name: Verify frozen exact manifest identity
        run: |
          echo "d50e69a20d6e65ec3426a8c938d1dea9d4e2f836c9bf07e02d30c560f5fa8463  outputs/aikens_exact_appeears_v061_manifest.json" | sha256sum -c -

      - name: Build raw GPS phase keys without environment
        run: >
          python scripts/prepare_phase_gps_from_modis_links.py
          outputs/aikens_exact_gps_modis250_links.csv
          --expected-observations 64539
          --output outputs/aikens_primary_phase_gps_keys.csv
          --receipt-output outputs/aikens_primary_phase_gps_keys_receipt.json

      - name: Require frozen target-selection v2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(
              Path("data/aikens2022_phase_reconstruction_execution_contract_v2_20260922.json")
              .read_text(encoding="utf-8")
          )
          assert contract["outcome_state_at_freeze"] == "lambda_outcome_unopened"
          assert contract["target_selection"]["environment_used_for_selection"] is False
          assert "earlier observed timestamp" in contract["target_selection"]["tie_break_rule"]
          print("AIKENS_FIXED_TARGET_V2_CONTRACT_OK")
          PY

      - name: Freeze 24-hour GPS targets before environment
        run: >
          python scripts/select_fixed_interval_gps_targets.py
          outputs/aikens_primary_phase_gps_keys.csv
          --target-interval-hours 24
          --max-target-deviation-hours 3
          --output outputs/aikens_primary_fixed_gps_targets.csv
          --receipt-output outputs/aikens_primary_fixed_gps_targets_receipt.json

      - name: Audit maximum registered sample support
        run: >
          python scripts/audit_fixed_target_support_ceiling.py
          outputs/aikens_primary_fixed_gps_targets.csv
          --min-animals-per-group 10
          --min-pairs-per-group 100
          --output outputs/aikens_pre_environment_support_ceiling.json

      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-aikens-pre-environment-support-ceiling
          path: |
            outputs/aikens_exact_appeears_v061_manifest_receipt.json
            outputs/aikens_primary_phase_gps_keys_receipt.json
            outputs/aikens_primary_fixed_gps_targets.csv
            outputs/aikens_primary_fixed_gps_targets_receipt.json
            outputs/aikens_pre_environment_support_ceiling.json
