name: PAYOFF-B MODIS-only forest midgreenup source admission
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-modis-only-spring-coherence-20261117
    paths:
      - "analysis/movement_phenology/payoff_b_modis_source_quality_20261117.R"
      - ".github/workflows/payoff-b-modis-only-source.yml"
permissions:
  contents: read
jobs:
  modis-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Check source-year/latitude/longitude and pure satellite measurement origin
        run: Rscript analysis/movement_phenology/payoff_b_modis_source_quality_20261117.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-modis-only-source-qa
          path: outputs/payoff_b_modis_source_quality.csv
          if-no-files-found: warn
