name: payoff-b-v8-environment-to-bird-transfer

on:
  push:
    branches:
      - analysis/payoff-b-v8-environment-to-bird-transfer-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_environment_to_bird_transfer.R"
      - "analysis/movement_phenology/payoff_b_v8_transfer_helpers.R"
      - "docs/PAYOFF_B_V8_ENVIRONMENT_TO_BIRD_TRANSFER_CONTRACT_20261005.md"
      - ".github/workflows/payoff-b-v8-environment-to-bird-transfer.yml"

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Install inference dependency
        run: Rscript -e 'install.packages("sandwich", repos="https://cloud.r-project.org")'
      - name: Run locked environment-to-bird transfer test
        run: Rscript analysis/movement_phenology/payoff_b_v8_environment_to_bird_transfer.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-environment-to-bird-transfer
          path: |
            outputs/payoff_b_v8_environment_to_bird_transfer_summary.csv
            outputs/payoff_b_v8_environment_to_bird_transfer_rows.csv
            outputs/payoff_b_v8_environment_to_bird_transfer_loo.csv
            outputs/payoff_b_v8_environment_to_bird_transfer_bootstrap.csv
          if-no-files-found: error
