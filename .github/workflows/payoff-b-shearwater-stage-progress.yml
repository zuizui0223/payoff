name: payoff-b-shearwater-two-stage-progress-calibration
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/audit_payoff_b_shearwater_stagewise_progress.py"
      - "tests/test_payoff_b_shearwater_stagewise_progress.py"
      - "docs/PAYOFF_B_SHEARWATER_STAGE_PROGRESS_LOCK_20261028.md"
      - ".github/workflows/payoff-b-shearwater-stage-progress.yml"
jobs:
  stage-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic geometry and attrition bound controls
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_shearwater_stagewise_progress.py
      - name: Read originally published CC0 shearwater stagewise progress
        run: |
          python -m scripts.audit_payoff_b_shearwater_stagewise_progress \
            --out outputs/payoff_b_shearwater_stage_progress.json
      - name: Preserve only group aggregates and bounds, never source positions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-shearwater-stage-progress-bounds
          path: outputs/payoff_b_shearwater_stage_progress.json
          if-no-files-found: warn
