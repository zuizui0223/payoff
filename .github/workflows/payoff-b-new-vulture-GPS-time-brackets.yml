name: payoff-b-new-vulture-original-GPS-timing-resolution
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_new_vulture_departure_brackets.py"
      - "tests/test_payoff_b_new_vulture_departure_brackets.py"
      - "docs/PAYOFF_B_NEW_VULTURE_GPS_TIMING_GATE_20261022.md"
      - ".github/workflows/payoff-b-new-vulture-GPS-time-brackets.yml"
jobs:
  source-time-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify synthetic time bracket gates without real locations
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_new_vulture_departure_brackets.py
      - name: Check original threatened-species GPS timing aggregate
        run: |
          python -m scripts.qc_payoff_b_new_vulture_departure_brackets \
            --out outputs/payoff_b_new_vulture_time
      - name: Archive no bird locations and only source timing counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-new-vulture-original-GPS-time-gate
          path: outputs/payoff_b_new_vulture_time/
          if-no-files-found: warn
