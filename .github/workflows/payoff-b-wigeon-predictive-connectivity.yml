name: payoff-b-wigeon-predictive-connectivity

on:
  push:
    branches:
      - feature/payoff-b-predictive-connectivity-20260926
    paths:
      - 'scripts/payoff_b_wigeon_predictive_connectivity.py'
      - '.github/workflows/payoff-b-wigeon-predictive-connectivity.yml'
      - 'data/payoff_b_predictive_connectivity_contract_20260926.json'

jobs:
  wigeon-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install empirical dependencies
        run: python -m pip install --disable-pip-version-check -e ".[empirical]" requests scipy pandas
      - name: Download frozen wigeon source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/source
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10678143392/zip" \
            -o outputs/wigeon_source_faithful.zip
          echo "d61afae4a4dcf62f0947c5ec49684aeb4cebad18fabde9b8eb74035fe4326388  outputs/wigeon_source_faithful.zip" | sha256sum -c -
          unzip -q outputs/wigeon_source_faithful.zip \
            stage3_wigeon_tgs_events.csv \
            stage3_wigeon_controller_transitions.csv \
            -d outputs/source
      - name: Run frozen historical predictive-connectivity bridge
        run: >
          python scripts/payoff_b_wigeon_predictive_connectivity.py
          --staging-events outputs/source/stage3_wigeon_tgs_events.csv
          --transitions outputs/source/stage3_wigeon_controller_transitions.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-wigeon-predictive-connectivity
          path: |
            outputs/wigeon_predictive_connectivity_pairs.csv
            outputs/wigeon_predictive_connectivity_transitions.csv
            outputs/wigeon_predictive_connectivity_result.json
          if-no-files-found: error
