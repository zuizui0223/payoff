name: payoff-b-predictive-connectivity-broad

on:
  push:
    branches:
      - feature/payoff-b-predictive-connectivity-20260926
    paths:
      - "analysis/movement_phenology/payoff_b_predictive_connectivity_amaral.R"
      - ".github/workflows/payoff-b-predictive-connectivity-broad.yml"
      - "data/payoff_b_predictive_connectivity_contract_20260926.json"

jobs:
  broad-connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run frozen broad predictive-connectivity analysis
        run: Rscript analysis/movement_phenology/payoff_b_predictive_connectivity_amaral.R
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pandas statsmodels
      - name: Run post-primary dependency audit
        run: python scripts/audit_broad_predictive_connectivity_dependency.py
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-broad-predictive-connectivity
          path: |
            outputs/payoff_b_broad_predictive_connectivity_result.csv
            outputs/payoff_b_broad_predictive_connectivity_rows.csv
            outputs/payoff_b_broad_predictive_connectivity_dependency_audit.json
          if-no-files-found: error
