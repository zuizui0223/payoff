name: PAYOFF-B V2 anonymous reviewer archive

concurrency:
  group: payoff-b-v2-reviewer-archive-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/payoff-b-v2-reviewer-archive-20260927
    paths:
      - "scripts/build_payoff_b_v2_reviewer_archive.py"
      - "scripts/build_payoff_b_v2_geb_*"
      - "scripts/render_information_deadlines_figures.py"
      - "manuscript/PAYOFF_B_INFORMATION_COORDINATION_V2_PREOUTCOME.md"
      - "data/payoff_b_*"
      - "analysis/movement_phenology/payoff_b_predictive_connectivity_amaral*.R"
      - "tests/test_payoff_b_v2_reviewer_archive.py"
      - ".github/workflows/payoff-b-v2-reviewer-archive.yml"
  pull_request:
    paths:
      - "scripts/build_payoff_b_v2_reviewer_archive.py"
      - "scripts/build_payoff_b_v2_geb_*"
      - "scripts/render_information_deadlines_figures.py"
      - "manuscript/PAYOFF_B_INFORMATION_COORDINATION_V2_PREOUTCOME.md"
      - "data/payoff_b_*"
      - "analysis/movement_phenology/payoff_b_predictive_connectivity_amaral*.R"
      - "tests/test_payoff_b_v2_reviewer_archive.py"
      - ".github/workflows/payoff-b-v2-reviewer-archive.yml"

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run reviewer-archive tests
        run: >
          python -m pip install --disable-pip-version-check pytest
          && pytest -q tests/test_payoff_b_v2_reviewer_archive.py
      - name: Build PREOUTCOME anonymous reviewer archive
        run: >
          python scripts/build_payoff_b_v2_reviewer_archive.py
          --output-dir outputs/payoff_b_v2_anonymous_review
          --zip outputs/PAYOFF_B_V2_ANON_REVIEW.zip
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v2-anonymous-review-archive
          path: |
            outputs/PAYOFF_B_V2_ANON_REVIEW.zip
            outputs/PAYOFF_B_V2_ANON_REVIEW_ARCHIVE_RECEIPT.json
            outputs/payoff_b_v2_anonymous_review/PAYOFF_B_V2_ANON_REVIEW_MANIFEST.json
          if-no-files-found: error
