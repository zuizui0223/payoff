name: PAYOFF-B Dryad 2023 original files manifest
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-dryad-2023-file-inventory-20261115
    paths:
      - "scripts/payoff_b_dryad_2023_file_inventory.py"
      - ".github/workflows/payoff-b-dryad-2023-files.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/payoff_b_dryad_2023_file_inventory.py --output outputs/dryad/2023_original_files.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-dryad-2023-original-files
          path: outputs/dryad/2023_original_files.json
          if-no-files-found: warn
