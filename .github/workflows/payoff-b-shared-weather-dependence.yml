name: payoff-b-shared-weather-dependence-audit
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/audit_payoff_b_weather_block_dependence.py"
      - "tests/test_payoff_b_weather_block_dependence.py"
      - "docs/PAYOFF_B_SHARED_WEATHER_DEPENDENCE_LOCK_20261022.md"
      - ".github/workflows/payoff-b-shared-weather-dependence.yml"
jobs:
  shared-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        system: [stork, white_fronted_goose, curlew]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify identical original estimand and grouped weather resampling
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_weather_block_dependence.py
      - name: Recheck original MD5 source, daily weather and block sensitivity
        run: |
          python -m scripts.audit_payoff_b_weather_block_dependence --system ${{ matrix.system }} --out outputs/payoff_b_weather_dependence
      - name: Archive aggregate groupwise estimates and no raw bird information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-shared-weather-${{ matrix.system }}
          path: outputs/payoff_b_weather_dependence/
          if-no-files-found: warn
