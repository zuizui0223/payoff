name: PAYOFF-B V2 GEB PREOUTCOME package

on:
  push:
    branches:
      - feature/payoff-b-v2-geb-package-20260927
    paths:
      - "manuscript/PAYOFF_B_INFORMATION_COORDINATION_V2_PREOUTCOME.md"
      - "scripts/build_payoff_b_v2_geb_*"
      - "scripts/audit_payoff_b_v2_geb_source.py"
      - "scripts/render_information_deadlines_figures.py"
      - "submission/GEB_V2_*"
      - "tests/test_payoff_b_v2_geb_package.py"
      - "tests/test_information_deadlines_figure_render.py"
      - ".github/workflows/payoff-b-v2-geb-package.yml"
  pull_request:
    paths:
      - "manuscript/PAYOFF_B_INFORMATION_COORDINATION_V2_PREOUTCOME.md"
      - "scripts/build_payoff_b_v2_geb_*"
      - "scripts/audit_payoff_b_v2_geb_source.py"
      - "scripts/render_information_deadlines_figures.py"
      - "submission/GEB_V2_*"
      - "tests/test_payoff_b_v2_geb_package.py"
      - "tests/test_information_deadlines_figure_render.py"
      - ".github/workflows/payoff-b-v2-geb-package.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V2 package tests
        run: >
          python -m pip install --disable-pip-version-check pytest
          && pytest -q
          tests/test_payoff_b_v2_geb_package.py
          tests/test_information_deadlines_figure_render.py
      - name: Build deterministic V2 GEB package
        run: >
          python scripts/build_payoff_b_v2_geb_preoutcome_package.py
          --output-dir outputs/payoff_b_v2_geb_preoutcome_package
          --zip outputs/PAYOFF_B_V2_GEB_PREOUTCOME_PACKAGE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v2-geb-preoutcome-package
          path: |
            outputs/PAYOFF_B_V2_GEB_PREOUTCOME_PACKAGE.zip
            outputs/payoff_b_v2_geb_preoutcome_package/GEB_V2_PREOUTCOME_PACKAGE_MANIFEST.json
            outputs/payoff_b_v2_geb_preoutcome_package/GEB_V2_PREOUTCOME_AUDIT.json
          if-no-files-found: error
