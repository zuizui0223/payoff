name: PAYOFF-B V2 GEB PREOUTCOME package\n\non:\n  push:\n    branches:\n      - feature/payoff-b-v2-geb-package-20260927\n    paths:\n      - "manuscript/PAYOFF_B_INFORMATION_COORDINATION_V2_PREOUTCOME.md"\n      - "scripts/build_payoff_b_v2_geb_*"\n      - "scripts/audit_payoff_b_v2_geb_source.py"\n      - "scripts/render_information_deadlines_figures.py"\n      - "submission/GEB_V2_*"\n      - "tests/test_payoff_b_v2_geb_package.py"\n      - "tests/test_information_deadlines_figure_render.py"\n      - ".github/workflows/payoff-b-v2-geb-package.yml"\n  pull_request:\n    paths:\n      - "manuscript/PAYOFF_B_INFORMATION_COORDINATION_V2_PREOUTCOME.md"\n      - "scripts/build_payoff_b_v2_geb_*"\n      - "scripts/audit_payoff_b_v2_geb_source.py"\n      - "scripts/render_information_deadlines_figures.py"\n      - "submission/GEB_V2_*"\n      - "tests/test_payoff_b_v2_geb_package.py"\n      - "tests/test_information_deadlines_figure_render.py"\n      - ".github/workflows/payoff-b-v2-geb-package.yml"\n\njobs:\n  package:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Run V2 package tests\n        run: >\n          python -m pip install --disable-pip-version-check pytest\n          && pytest -q\n          tests/test_payoff_b_v2_geb_package.py\n          tests/test_information_deadlines_figure_render.py\n      - name: Build deterministic V2 GEB package\n        run: >\n          python scripts/build_payoff_b_v2_geb_preoutcome_package.py\n          --output-dir outputs/payoff_b_v2_geb_preoutcome_package\n          --zip outputs/PAYOFF_B_V2_GEB_PREOUTCOME_PACKAGE.zip\n      - uses: actions/upload-artifact@v4\n        with:\n          name: payoff-b-v2-geb-preoutcome-package\n          path: |\n            outputs/PAYOFF_B_V2_GEB_PREOUTCOME_PACKAGE.zip\n            outputs/payoff_b_v2_geb_preoutcome_package/GEB_V2_PREOUTCOME_PACKAGE_MANIFEST.json\n            outputs/payoff_b_v2_geb_preoutcome_package/GEB_V2_PREOUTCOME_AUDIT.json\n          if-no-files-found: error\n