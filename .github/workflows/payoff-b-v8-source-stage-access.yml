name: payoff-b-v8-source-stage-access

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_source_stage_access_diagnostic.R"
      - ".github/workflows/payoff-b-v8-source-stage-access.yml"

jobs:
  source-stage-access:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run source-stage migration-front access diagnostic
        run: Rscript analysis/movement_phenology/payoff_b_v8_source_stage_access_diagnostic.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-source-stage-access
          path: |
            outputs/payoff_b_v8_source_stage_access_year_rows.csv
            outputs/payoff_b_v8_source_stage_access_units.csv
            outputs/payoff_b_v8_source_stage_access_pairs.csv
            outputs/payoff_b_v8_source_stage_access_species.csv
            outputs/payoff_b_v8_source_stage_access_summary.csv
          if-no-files-found: error
