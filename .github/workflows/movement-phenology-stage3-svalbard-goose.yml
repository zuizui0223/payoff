name: Movement-phenology Stage 3 Svalbard goose source audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/movement_phenology/stage3_barnacle_goose_source_probe.py'
      - '.github/workflows/movement-phenology-stage3-svalbard-goose.yml'
  pull_request:
    paths:
      - 'analysis/movement_phenology/stage3_barnacle_goose_source_probe.py'
      - '.github/workflows/movement-phenology-stage3-svalbard-goose.yml'

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check pandas

      - name: Download public Movebank Data Repository bitstreams
        run: |
          mkdir -p external/barnacle_goose_svalbard
          curl --fail --location --retry 3 \
            'https://datarepository.movebank.org/server/api/core/bitstreams/df28a80e-e0c4-49fb-aa87-76ceb2d2b76f/content' \
            --output external/barnacle_goose_svalbard/gps.csv
          curl --fail --location --retry 3 \
            'https://datarepository.movebank.org/server/api/core/bitstreams/a6e123b0-7588-40da-8f06-73559bb3ff6b/content' \
            --output external/barnacle_goose_svalbard/reference.csv
          test -s external/barnacle_goose_svalbard/gps.csv
          test -s external/barnacle_goose_svalbard/reference.csv
          wc -c external/barnacle_goose_svalbard/*.csv
          sha256sum external/barnacle_goose_svalbard/*.csv

      - name: Inventory Svalbard goose source data
        run: python analysis/movement_phenology/stage3_barnacle_goose_source_probe.py

      - uses: actions/upload-artifact@v4
        with:
          name: movement-phenology-stage3-svalbard-goose-source
          path: |
            outputs/movement_phenology/stage3_barnacle_goose_svalbard_source_inventory.json
            outputs/movement_phenology/stage3_barnacle_goose_svalbard_source_inventory.csv
          if-no-files-found: error
