name: PAYOFF-B V7 Movebank three-flyway archived GPS source admission
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-global-tracking-information-20261117
    paths:
      - "scripts/payoff_b_movebank_v7_published_source_gate.py"
      - "scripts/payoff_b_movebank_v7_bitstream_gate.py"
      - "scripts/payoff_b_movebank_v7_fix_quality.py"
      - "tests/test_payoff_b_movebank_v7_published_source_gate.py"
      - "tests/test_payoff_b_movebank_v7_bitstream_gate.py"
      - "tests/test_payoff_b_movebank_v7_fix_quality.py"
      - ".github/workflows/payoff-b-movebank-v7-source.yml"
permissions:
  contents: read
jobs:
  published-source-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic-test prerequisite
        run: python -m pip install pytest
      - name: Synthetic DOI and DSpace link contract tests
        run: python -m pytest -q tests/test_payoff_b_movebank_v7_published_source_gate.py tests/test_payoff_b_movebank_v7_bitstream_gate.py tests/test_payoff_b_movebank_v7_fix_quality.py
      - name: Check official Movebank Data Repository for Kölzsch GPS archive metadata
        run: python -m scripts.payoff_b_movebank_v7_published_source_gate --output outputs/global_tracking/movebank_v7_published_source_gate.json
      - name: Verify original GPS and reference bitstreams from official archive links
        run: python -m scripts.payoff_b_movebank_v7_bitstream_gate --output outputs/global_tracking/movebank_v7_verified_gps_bitstreams.json
      - name: Audit source GPS timestamps, coordinates, duplicate fixes and year support
        run: python -m scripts.payoff_b_movebank_v7_fix_quality --output outputs/global_tracking/movebank_v7_fix_quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-v7-three-flyway-archive-gate
          path: outputs/global_tracking/movebank_v7_*.json
          if-no-files-found: warn
