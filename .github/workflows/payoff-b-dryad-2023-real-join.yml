name: PAYOFF-B original Dryad 2023 population-year join
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-2023-real-join-20261115
    paths:
      - "scripts/payoff_b_2023_real_fitness_resource_join.py"
      - ".github/workflows/payoff-b-dryad-2023-real-join.yml"
permissions:
  contents: read
jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl
      - run: python scripts/payoff_b_2023_real_fitness_resource_join.py --output outputs/dryad/2023_real_population_year_join.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-dryad-2023-real-population-year-join
          path: outputs/dryad/2023_real_population_year_join.json
          if-no-files-found: warn
