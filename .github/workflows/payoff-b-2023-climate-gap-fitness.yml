name: PAYOFF-B 2023 climate gap fitness incremental prediction
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-2023-climate-gap-fitness-increment-20261115
    paths:
      - "scripts/payoff_b_2023_climate_gap_fitness_increment.py"
      - ".github/workflows/payoff-b-2023-climate-gap-fitness.yml"
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl numpy
      - run: python -m scripts.payoff_b_2023_climate_gap_fitness_increment --output outputs/dryad/2023_climate_gap_fitness_increment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-2023-climate-gap-fitness-increment
          path: outputs/dryad/2023_climate_gap_fitness_increment.json
          if-no-files-found: warn
