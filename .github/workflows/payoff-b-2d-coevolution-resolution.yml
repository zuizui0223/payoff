name: payoff-b 2d coevolution resolution check

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-2d-coevolution-resolution.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck 2D barriers with mutation step 0.1
        run: >
          python scripts/migration_phenology_2d_coevolution.py
          --interaction-strengths 0.5,1.0
          --climate-velocities 0.05,0.06
          --phenology-limits 2,4
          --width 31
          --height 15
          --first-wall-offset 3
          --second-wall-offset 7
          --detour-offset 5
          --gap-width 1
          --base-cost 0.06
          --cost-bias=-0.08
          --baseline-growth 0.35
          --initial-total-abundance 400
          --local-carrying-capacity 80
          --density-coefficient 0.35
          --steps 100
          --burn-in 20
          --mutation-step 0.1
          --max-migration-rate 1.0
          --max-phenology-rate 1.0
          --max-cycles 80
          --output outputs/payoff_b_2d_coevolution_resolution.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-2d-coevolution-resolution
          path: outputs/payoff_b_2d_coevolution_resolution.csv
