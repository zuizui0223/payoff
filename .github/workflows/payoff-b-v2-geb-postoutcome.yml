name: PAYOFF-B V2 GEB postoutcome pipeline

on:
  push:
    branches:
      - feature/payoff-b-v2-postoutcome-pipeline-20260927
    paths:
      - "scripts/build_payoff_b_v2_geb_postoutcome_*"
      - "scripts/build_payoff_b_v2_geb_source.py"
      - "scripts/build_payoff_b_v2_geb_supporting_information.py"
      - "scripts/audit_payoff_b_v2_geb_source.py"
      - "scripts/render_information_deadlines_figures.py"
      - "scripts/render_aikens_lambda_manuscript.py"
      - "submission/GEB_V2_*POSTOUTCOME*"
      - "tests/test_payoff_b_v2_postoutcome_package.py"
      - ".github/workflows/payoff-b-v2-geb-postoutcome.yml"
  pull_request:
    paths:
      - "scripts/build_payoff_b_v2_geb_postoutcome_*"
      - "scripts/build_payoff_b_v2_geb_source.py"
      - "scripts/build_payoff_b_v2_geb_supporting_information.py"
      - "scripts/audit_payoff_b_v2_geb_source.py"
      - "scripts/render_information_deadlines_figures.py"
      - "scripts/render_aikens_lambda_manuscript.py"
      - "submission/GEB_V2_*POSTOUTCOME*"
      - "tests/test_payoff_b_v2_postoutcome_package.py"
      - ".github/workflows/payoff-b-v2-geb-postoutcome.yml"

jobs:
  postoutcome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run V2 postoutcome invariance tests
        run: >
          python -m pip install --disable-pip-version-check pytest
          && pytest -q tests/test_payoff_b_v2_postoutcome_package.py
