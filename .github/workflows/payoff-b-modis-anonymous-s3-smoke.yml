name: payoff-b MODIS anonymous S3 smoke

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-modis-anonymous-s3-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test anonymous LP DAAC S3 listing
        run: |
          set +e
          mkdir -p outputs
          MOD09_OUT="$(mktemp)"
          MOD10_OUT="$(mktemp)"
          aws s3 ls --no-sign-request --region us-west-2 s3://lp-prod-protected/MOD09Q1.061/ >"${MOD09_OUT}" 2>&1
          MOD09_CODE=$?
          aws s3 ls --no-sign-request --region us-west-2 s3://lp-prod-protected/MOD10A2.061/ >"${MOD10_OUT}" 2>&1
          MOD10_CODE=$?
          python - "${MOD09_CODE}" "${MOD10_CODE}" "${MOD09_OUT}" "${MOD10_OUT}" <<'PY'
          import json
          import sys
          from pathlib import Path

          mod09_code = int(sys.argv[1])
          mod10_code = int(sys.argv[2])
          mod09_text = Path(sys.argv[3]).read_text(errors="replace")
          mod10_text = Path(sys.argv[4]).read_text(errors="replace")
          payload = {
              "status": (
                  "ANONYMOUS_S3_AVAILABLE"
                  if mod09_code == 0 and mod10_code == 0
                  else "ANONYMOUS_S3_NOT_AVAILABLE"
              ),
              "mod09q1_061": {
                  "bucket": "s3://lp-prod-protected/MOD09Q1.061/",
                  "exit_code": mod09_code,
                  "listing_preview": mod09_text[:2000],
              },
              "mod10a2_061": {
                  "bucket": "s3://lp-prod-protected/MOD10A2.061/",
                  "exit_code": mod10_code,
                  "listing_preview": mod10_text[:2000],
              },
              "claim_boundary": (
                  "network/access smoke only; no environmental values or "
                  "lambda outcome are inspected"
              ),
          }
          Path("outputs/modis_anonymous_s3_smoke.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-modis-anonymous-s3-smoke
          path: outputs/modis_anonymous_s3_smoke.json
