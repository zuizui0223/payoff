name: payoff-b-movebank-crossguild-public-source-qc
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_public_movebank_crossguild.py"
      - "tests/test_movebank_crossguild_source_qc.py"
      - "docs/PAYOFF_B_CROSSGUILD_SOURCE_QC_20261019.md"
      - ".github/workflows/payoff-b-movebank-crossguild-public-source-qc.yml"
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [bean_goose, curlew, steppe_eagle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deterministic synthetic test fixtures
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_movebank_crossguild_source_qc.py
      - name: Read each original CC0 source after checksum verification
        run: |
          python -m scripts.qc_public_movebank_crossguild --system ${{ matrix.system }} --out outputs/payoff_b_crossguild
      - name: Archive aggregate counts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-crossguild-source-${{ matrix.system }}
          path: outputs/payoff_b_crossguild/
          if-no-files-found: warn
