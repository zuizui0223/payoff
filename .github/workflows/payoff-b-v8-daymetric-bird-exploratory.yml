name: PAYOFF-B V8 exploratory day-metric to bird-mismatch transfer

on:
  push:
    branches:
      - analysis/payoff-b-v8-daymetric-to-bird-exploratory-20261015
    paths:
      - ".github/workflows/payoff-b-v8-daymetric-bird-exploratory.yml"
      - "analysis/movement_phenology/payoff_b_v8_daymetric_bird_transfer_exploratory.R"
      - "tests/test_payoff_b_v8_daymetric_bird_transfer_exploratory.py"
      - "docs/PAYOFF_B_V8_DAYMETRIC_BIRD_TRANSFER_EXPLORATORY_LOCK_20261015.md"
  pull_request:
    paths:
      - ".github/workflows/payoff-b-v8-daymetric-bird-exploratory.yml"
      - "analysis/movement_phenology/payoff_b_v8_daymetric_bird_transfer_exploratory.R"
      - "tests/test_payoff_b_v8_daymetric_bird_transfer_exploratory.py"
      - "docs/PAYOFF_B_V8_DAYMETRIC_BIRD_TRANSFER_EXPLORATORY_LOCK_20261015.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fixed-six-exploratory-slopes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preserve analysis label and all specified contrasts
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_payoff_b_v8_daymetric_bird_transfer_exploratory.py
          Rscript -e 'parse(file="analysis/movement_phenology/payoff_b_v8_daymetric_bird_transfer_exploratory.R"); cat("ORIGINAL POSTHOC SIX-MODEL DESIGN PARSE PASS\n")' > /dev/null
      - name: Restore exactly verified exploratory pair, bird, and RMSE outcome coordinates
        uses: actions/download-artifact@v4
        with:
          run-id: 38585167565
          repository: zuizui0223/payoff
          github-token: ${{ github.token }}
          name: payoff-b-paper2-20261014-day-scale-posthoc-source-verified-NONANON
          path: inputs/day
      - name: Restore original preregistered transfer and fixed-arrival structural-null rows
        uses: actions/download-artifact@v4
        with:
          run-id: 38404051747
          repository: zuizui0223/payoff
          github-token: ${{ github.token }}
          name: payoff-b-v8-20261005-original-row-archive-internal-NOT-ANONYMOUS
          path: inputs/frozen
      - name: Select exact restored files with unambiguous paths
        run: |
          mkdir -p inputs/verified
          for filename in \
            payoff_b_v8_metric_scale_pairs.csv \
            payoff_b_v8_metric_scale_bird_rows.csv; do
            matches=$(find inputs/day -type f -name "$filename" | wc -l)
            test "$matches" -eq 1 || { echo "Ambiguous/missing day metric $filename"; exit 2; }
            srcfile=$(find inputs/day -type f -name "$filename")
            cp "$srcfile" "inputs/verified/$filename"
          done
          cp inputs/frozen/original_20261005_outputs/transfer/payoff_b_v8_transfer_primary_rows.csv \
            inputs/verified/payoff_b_v8_transfer_primary_rows.csv
          cp inputs/frozen/original_20261005_outputs/structural/payoff_b_v8_transfer_structural_null_rows.csv \
            inputs/verified/payoff_b_v8_transfer_structural_null_rows.csv
      - name: Run all two by three day-metric posthoc tests, including structural null and bird increment
        run: |
          Rscript analysis/movement_phenology/payoff_b_v8_daymetric_bird_transfer_exploratory.R \
            --pairs inputs/verified/payoff_b_v8_metric_scale_pairs.csv \
            --birds inputs/verified/payoff_b_v8_metric_scale_bird_rows.csv \
            --transfer inputs/verified/payoff_b_v8_transfer_primary_rows.csv \
            --structural inputs/verified/payoff_b_v8_transfer_structural_null_rows.csv \
            --output outputs/exploratory_transfer
      - name: Mechanically audit all 6 slopes, exact samples, CI widths, and null decomposition
        run: |
          python - <<'PY'
          import csv, math
          from pathlib import Path
          root=Path("outputs/exploratory_transfer")
          with (root/"day_metric_to_bird_exploratory_slopes.csv").open() as f:
            rr=list(csv.DictReader(f))
          with (root/"day_metric_to_bird_exploratory_status.csv").open() as f:
            summary=list(csv.DictReader(f))
          assert len(rr)==6 and len(summary)==1
          keys={(z["predictor"],z["response"]) for z in rr}
          assert keys=={(a,b) for a in ("delta_loo_rmse","delta_loo_value_mse")
                        for b in ("observed","fixed_arrival","bird_increment")}
          assert summary[0]["status"]=="POST_OUTCOME_EXPLORATORY_SIX_SLOPES_COMPLETE"
          assert summary[0]["n_environment_pairs_joined"]=="72"
          assert summary[0]["n_species_target_rows"]=="150"
          assert summary[0]["n_pair_bootstrap"]=="10000"
          for z in rr:
            for col in ("beta_per_original_eligible_pair_SD","ci_low_95","ci_high_95"):
              assert math.isfinite(float(z[col]))
            assert float(z["ci_low_95"])<=float(z["ci_high_95"])
            assert z["preregistered"]=="FALSE"
          with (root/"day_metric_to_bird_exploratory_bootstrap.csv").open() as f:
            assert sum(1 for _ in f)==10001
          for p in ("delta_loo_rmse","delta_loo_value_mse"):
            coeff={z["response"]:float(z["beta_per_original_eligible_pair_SD"])
                   for z in rr if z["predictor"]==p}
            assert abs(coeff["observed"]-coeff["fixed_arrival"]-coeff["bird_increment"])<1e-10
          print("EXPLORATORY SIX-SLOPE STUDY FULLY REPORTED; NONE IS A PREREGISTERED RESULT")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PAYOFF-B-V8-POSTHOC-day-metric-bird-transfer-6-SLOPES-NONCONFIRMATORY
          path: outputs/exploratory_transfer/
          if-no-files-found: warn
