name: payoff-b-v8-source-rank-sensitivity

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_source_rank_sensitivity.R"
      - ".github/workflows/payoff-b-v8-source-rank-sensitivity.yml"

jobs:
  source-rank-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run source-rank sensitivity
        run: Rscript analysis/movement_phenology/payoff_b_v8_source_rank_sensitivity.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-source-rank-sensitivity
          path: |
            outputs/payoff_b_v8_source_rank_common_rows.csv
            outputs/payoff_b_v8_source_rank_summary.csv
            outputs/payoff_b_v8_source_rank_paired.csv
            outputs/payoff_b_v8_source_rank_paired_summary.csv
            outputs/payoff_b_v8_source_rank_bootstrap.csv
          if-no-files-found: error
