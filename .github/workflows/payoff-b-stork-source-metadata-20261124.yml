name: PAYOFF-B experimental stork original DOI metadata admission

on:
  push:
    branches:
      - analysis/payoff-b-stork-experiment-source-screen-20261124
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test requirements
        run: python -m pip install --disable-pip-version-check pytest
      - name: Validate exactly pinned archives and no-event safeguards
        run: pytest -q -rs tests/test_payoff_b_stork_experiment_source_metadata_audit_20261124.py
      - name: Read only original archive metadata (no GPS or animal events)
        run: |
          python scripts/payoff_b_stork_experiment_source_metadata_audit_20261124.py \
            --output outputs/payoff_b_stork_experiment_source_audit_20261124.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("outputs/payoff_b_stork_experiment_source_audit_20261124.json").read_text())
          assert x["original_tracking_or_code_files_downloaded"] is False
          assert x["movebank_events_requested"] is False
          assert x["license_terms_accepted"] is False
          assert x["ebird_used"] is False
          assert x["new_ecological_effect_fitted"] is False
          assert len(x["movebank_archives"])==3
          print("STORK_METADATA_SOURCE_STATUS",x["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stork-source-metadata-only-20261124
          path: outputs/payoff_b_stork_experiment_source_audit_20261124.json
          if-no-files-found: error

  pinned-original-author-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check notebook-source integrity and social-data admission logic
        run: pytest -q -rs tests/test_payoff_b_stork_author_code_cue_audit_20261124.py
      - name: Audit author notebooks by exact original Git blob sha, not individual tracks
        run: |
          python scripts/payoff_b_stork_author_code_cue_audit_20261124.py \
            --output outputs/payoff_b_stork_author_code_cue_audit_20261124.json
          python - <<'PY'
          from pathlib import Path
          import json
          z=json.loads(Path("outputs/payoff_b_stork_author_code_cue_audit_20261124.json").read_text())
          assert z["exact_file_count"] == 6
          assert z["n_original_code_cells"] > 100
          assert z["source_code_executed"] is False
          assert z["tracking_or_individual_data_accessed"] is False
          assert z["experimental_fitness_result_reestimated"] is False
          assert z["no_ebird"] is True
          assert all(x["original_data_files_opened"] is False for x in z["files"].values())
          print("AUTHOR_CODE_CUE_EVIDENCE_STATUS",z["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stork-author-code-cue-source-only-20261124
          path: outputs/payoff_b_stork_author_code_cue_audit_20261124.json
          if-no-files-found: error

  stork-archive-head-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Assert pinned URL and no-redirect/no-body policy
        run: pytest -q -rs tests/test_payoff_b_stork_archive_head_probe_20261124.py
      - name: HEAD only original three public archive landing and DOI URLs
        run: |
          python scripts/payoff_b_stork_archive_head_probe_20261124.py \
            --output outputs/payoff_b_stork_archival_landing_receipt_20261124.json
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("outputs/payoff_b_stork_archival_landing_receipt_20261124.json").read_text())
          assert len(x["archive_status"])==3
          assert x["events_or_tracking_files_downloaded"] is False
          assert x["original_license_terms_accepted"] is False
          assert x["file_level_direct_download_available"] is None
          assert x["social_cue_reliability_or_remain_recourse_estimated"] is False
          assert x["no_ebird"] is True
          for row in x["archive_status"]:
            for key in ("doi_status","landing_status"):
              assert row[key]["no_response_body_read"] is True
              assert row[key]["tracking_or_event_bytes_downloaded"] is False
          print("ORIGINAL_PUBLIC_ARCHIVE_HEAD_SCOPE_VERIFIED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stork-head-only-archive-access-20261124
          path: outputs/payoff_b_stork_archival_landing_receipt_20261124.json
          if-no-files-found: error

  stork-archive-html-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal tests
        run: python -m pip install --disable-pip-version-check pytest
      - name: Guard against event/body download in HTML discovery
        run: pytest -q -rs tests/test_payoff_b_stork_archival_landing_html_probe_20261124.py
      - name: Inspect at most 8KiB of original three HTML landing pages only
        run: |
          python scripts/payoff_b_stork_archival_landing_html_probe_20261124.py \
            --output outputs/payoff_b_stork_html_page_manifest_20261124.json
          python - <<'PY'
          from pathlib import Path
          import json
          x=json.loads(Path("outputs/payoff_b_stork_html_page_manifest_20261124.json").read_text())
          assert len(x["archive_pages"])==3
          assert x["limit_bytes_per_original_landing"]==8192
          assert x["original_GPS_files_downloaded"] is False
          assert x["tracking_events_queried"] is False
          assert x["link_destinations_followed"] is False
          assert x["original_user_terms_accepted"] is False
          assert x["social_predictive_reliability_or_payoff_estimated"] is False
          assert x["no_ebird"] is True
          print("MOVE_BANK_HTML_META_SOURCE_STATUS",x["status"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stork-first8k-html-source-20261124
          path: outputs/payoff_b_stork_html_page_manifest_20261124.json
          if-no-files-found: error
