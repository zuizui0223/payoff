name: PAYOFF-B GloPL seasonal contrast
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/payoff-b-glopl-seasonal-contrast.yml'
      - 'scripts/payoff_b_glopl_seasonal_contrast_20261125.py'
      - 'docs/PAYOFF_B_GLOPL_SEASONAL_CONTRAST_FREEZE_20261125.md'
permissions:
  contents: read
jobs:
  seasonal:
    if: github.head_ref == 'analysis/payoff-b-interaction-buffering-meta-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - run: python scripts/payoff_b_glopl_seasonal_contrast_20261125.py outputs/payoff_b_glopl_seasonal_contrast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-glopl-seasonal-contrast
          path: outputs/payoff_b_glopl_seasonal_contrast.json
          if-no-files-found: warn
