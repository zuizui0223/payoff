name: PAYOFF-B Ortega variance-funnel audit

on:
  push:
    paths:
      - "scripts/payoff_b_ortega_variance_funnel.py"
      - "data/payoff_b_ortega_variance_funnel_contract_20261003.json"
      - ".github/workflows/payoff-b-ortega-variance-funnel.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python scripts/payoff_b_ortega_variance_funnel.py \
            --bootstrap-replicates 10000 \
            --output outputs/payoff_b_ortega_variance_funnel_result.json
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-ortega-variance-funnel
          path: outputs/payoff_b_ortega_variance_funnel_result.json
