name: payoff-b-v8-downstream-transfer-primary

on:
  push:
    branches:
      - analysis/payoff-b-v8-transfer-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_downstream_transfer_primary.R"
      - "analysis/movement_phenology/payoff_b_v8_primary.R"
      - "docs/PAYOFF_B_V8_DOWNSTREAM_TRANSFER_CONTRACT_20261005.md"
      - ".github/workflows/payoff-b-v8-downstream-transfer-primary.yml"

jobs:
  v8-transfer-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run frozen V8 downstream transfer primary test
        run: Rscript analysis/movement_phenology/payoff_b_v8_downstream_transfer_primary.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-downstream-transfer-primary
          path: |
            outputs/payoff_b_v8_transfer_primary_summary.csv
            outputs/payoff_b_v8_transfer_primary_rows.csv
            outputs/payoff_b_v8_transfer_primary_bootstrap.csv
          if-no-files-found: error
