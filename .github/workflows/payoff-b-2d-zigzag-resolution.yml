name: payoff-b 2d zigzag resolution check

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-2d-zigzag-resolution.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck zigzag penalty with 7x7 strategies
        run: >
          python scripts/migration_phenology_2d_zigzag.py
          --climate-velocities 0.04,0.05,0.06,0.07
          --phenology-limits 0,2,4
          --gap-widths 1
          --width 31
          --height 15
          --first-wall-offset 3
          --second-wall-offset 7
          --detour-offset 5
          --initial-total-abundance 400
          --local-carrying-capacity 80
          --density-coefficient 0.30
          --baseline-growth 0.30
          --interaction-strength 0.25
          --migration-cost 0.03
          --phenology-cost 0.03
          --steps 100
          --burn-in 20
          --migration-points 7
          --phenology-points 7
          --output outputs/payoff_b_2d_zigzag_resolution.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-2d-zigzag-resolution
          path: outputs/payoff_b_2d_zigzag_resolution.csv
