name: m5-t0-public-marker-audit

on:
  push:
    branches:
      - ops/m5-t0-public-marker-audit-20260912

jobs:
  marker-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minimap2 samtools
          python -m pip install --quiet biopython
      - name: Recover reference loci and M5 T0 PacBio reads
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p outputs/m5_marker_audit
          curl -L --fail --retry 3 \
            'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id=NC_003888.3&rettype=gbwithparts&retmode=text' \
            -o outputs/m5_marker_audit/NC_003888.3.gb
          python - <<'PY'
          from Bio import SeqIO
          rec = SeqIO.read('outputs/m5_marker_audit/NC_003888.3.gb', 'genbank')
          SeqIO.write(rec, 'outputs/m5_marker_audit/NC_003888.3.fa', 'fasta')
          targets = {'SCO7662','SCO7350','SCO7036','SCO3879'}
          rows=[]
          for feat in rec.features:
              if feat.type not in {'gene','CDS'}:
                  continue
              locus_tags=set(feat.qualifiers.get('locus_tag', []))
              old_tags=set(feat.qualifiers.get('old_locus_tag', []))
              aliases=locus_tags | old_tags
              matched=targets & aliases
              if matched:
                  target=sorted(matched)[0]
                  current=(feat.qualifiers.get('locus_tag') or [''])[0]
                  start=int(feat.location.start)+1
                  end=int(feat.location.end)
                  rows.append((target,current,start,end,end-start+1,feat.type))
          best={}
          for row in rows:
              target=row[0]
              if target not in best or (best[target][5] != 'gene' and row[5]=='gene'):
                  best[target]=row
          missing=targets-set(best)
          if missing:
              # Emit nearby annotation evidence to distinguish schema failure from true absence.
              examples=[]
              for feat in rec.features:
                  olds=feat.qualifiers.get('old_locus_tag', [])
                  if olds:
                      examples.extend((feat.type, feat.qualifiers.get('locus_tag', [''])[0], old) for old in olds[:2])
                  if len(examples) >= 20:
                      break
              print('OLD_LOCUS_EXAMPLES', examples[:20])
              raise SystemExit(f'Missing loci in reference annotation: {sorted(missing)}')
          with open('outputs/m5_marker_audit/loci.tsv','w') as f:
              f.write('legacy_locus\tcurrent_locus\tstart\tend\tlength\n')
              for target in sorted(best):
                  legacy,current,s,e,n,_=best[target]
                  f.write(f'{legacy}\t{current}\t{s}\t{e}\t{n}\n')
          print(open('outputs/m5_marker_audit/loci.tsv').read())
          PY
          curl -L --fail --retry 3 \
            'https://www.ebi.ac.uk/ena/portal/api/filereport?accession=SRR16954720&result=read_run&fields=run_accession,fastq_ftp,fastq_md5,fastq_bytes&format=tsv' \
            -o outputs/m5_marker_audit/m5_fastq_meta.tsv
          python - <<'PY'
          import csv, pathlib
          p=pathlib.Path('outputs/m5_marker_audit/m5_fastq_meta.tsv')
          rows=list(csv.DictReader(p.open(), delimiter='\t'))
          if len(rows)!=1 or rows[0]['run_accession']!='SRR16954720':
              raise SystemExit(f'Unexpected ENA metadata: {rows}')
          urls=[x for x in rows[0]['fastq_ftp'].split(';') if x]
          if not urls:
              raise SystemExit('No FASTQ URL returned')
          print('FASTQ_URLS', urls)
          pathlib.Path('outputs/m5_marker_audit/fastq_urls.txt').write_text('\n'.join(urls)+'\n')
          PY
          while read -r u; do
            [ -z "$u" ] && continue
            curl -L --fail --retry 3 "https://$u" -O
          done < outputs/m5_marker_audit/fastq_urls.txt
          mv SRR16954720*.fastq.gz outputs/m5_marker_audit/
      - name: Map reads and score frozen marker panel
        shell: bash
        run: |
          set -euxo pipefail
          fq=$(ls outputs/m5_marker_audit/SRR16954720*.fastq.gz | head -n1)
          minimap2 -t 4 -ax map-pb outputs/m5_marker_audit/NC_003888.3.fa "$fq" \
            | samtools sort -@ 4 -o outputs/m5_marker_audit/m5_t0.bam
          samtools index outputs/m5_marker_audit/m5_t0.bam
          python - <<'PY'
          import csv, subprocess
          loci=list(csv.DictReader(open('outputs/m5_marker_audit/loci.tsv'), delimiter='\t'))
          out=[]
          for x in loci:
              region=f"NC_003888.3:{x['start']}-{x['end']}"
              text=subprocess.check_output(['samtools','coverage','-r',region,'outputs/m5_marker_audit/m5_t0.bam'], text=True)
              rows=[r for r in text.splitlines() if r and not r.startswith('#')]
              if len(rows)!=1:
                  raise SystemExit(f'Unexpected coverage output for {region}: {text}')
              cols=rows[0].split('\t')
              out.append({
                  'locus':x['legacy_locus'], 'current_locus':x['current_locus'],
                  'start':x['start'], 'end':x['end'], 'length':x['length'],
                  'numreads':cols[3], 'covbases':cols[4], 'coverage_pct':cols[5], 'mean_depth':cols[6]
              })
          core=next(float(x['mean_depth']) for x in out if x['locus']=='SCO3879')
          for x in out:
              x['depth_over_core']=str(float(x['mean_depth'])/core if core else float('nan'))
          fields=['locus','current_locus','start','end','length','numreads','covbases','coverage_pct','mean_depth','depth_over_core']
          with open('outputs/m5_marker_audit/marker_coverage.tsv','w') as f:
              w=csv.DictWriter(f, fieldnames=fields, delimiter='\t')
              w.writeheader(); w.writerows(out)
          print(open('outputs/m5_marker_audit/marker_coverage.tsv').read())
          PY
          sha256sum outputs/m5_marker_audit/SRR16954720*.fastq.gz outputs/m5_marker_audit/marker_coverage.tsv \
            > outputs/m5_marker_audit/checksums.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: m5-t0-public-marker-audit
          path: |
            outputs/m5_marker_audit/loci.tsv
            outputs/m5_marker_audit/m5_fastq_meta.tsv
            outputs/m5_marker_audit/marker_coverage.tsv
            outputs/m5_marker_audit/checksums.sha256
