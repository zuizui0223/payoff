name: payoff-b-crossguild-spring-source-geometry

on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_public_movebank_spring_geometry.py"
      - "tests/test_movebank_spring_geometry.py"
      - "docs/PAYOFF_B_CROSSGUILD_SPRING_SOURCE_GEOMETRY_20261019.md"
      - ".github/workflows/payoff-b-crossguild-spring-source-geometry.yml"

jobs:
  source-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        system: [curlew, woodcock_argos, dabbling_ducks, stork, white_fronted_goose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test northward source checkpoint handling
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_movebank_spring_geometry.py
      - name: Recheck original published source and assess February-May geometry
        run: |
          python -m scripts.qc_public_movebank_spring_geometry \
            --system ${{ matrix.system }} \
            --out outputs/payoff_b_spring_geometry
      - name: Archive aggregate source geometry only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-spring-source-geometry-${{ matrix.system }}
          path: outputs/payoff_b_spring_geometry/
          if-no-files-found: warn
