name: PAYOFF-B Dryad experimental food delivery source admission
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-food-supplement-provisioning-source-20261116
    paths:
      - "scripts/payoff_b_dryad_food_supplement_provisioning_probe.py"
      - "tests/test_payoff_b_dryad_food_supplement_provisioning_probe.py"
      - ".github/workflows/payoff-b-dryad-food-supplement-source.yml"
permissions:
  contents: read
jobs:
  dryad-source:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema-test prerequisites
        run: python -m pip install pytest openpyxl
      - name: Synthetic Dryad API schema and digest tests
        run: python -m pytest -q tests/test_payoff_b_dryad_food_supplement_provisioning_probe.py
      - name: Inspect official Dryad source manifest and certified original workbooks
        run: python -m scripts.payoff_b_dryad_food_supplement_provisioning_probe --output outputs/external_food/provisioning_dryad_original_schema.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-food-supplement-actual-provisioning-source
          path: outputs/external_food/provisioning_dryad_original_schema.json
          if-no-files-found: warn
