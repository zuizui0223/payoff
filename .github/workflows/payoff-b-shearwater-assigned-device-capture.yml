name: payoff-b-shearwater-assigned-device-capture
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/audit_payoff_b_shearwater_device_allocation.py"
      - "tests/test_payoff_b_shearwater_device_allocation.py"
      - "docs/PAYOFF_B_SHEARWATER_DEVICE_ALLOCATION_AND_MISSINGNESS_20261023.md"
      - ".github/workflows/payoff-b-shearwater-assigned-device-capture.yml"
jobs:
  allocation-vs-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify device allocations, exact conditional probabilities and sharp missing-data bounds
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_shearwater_device_allocation.py
      - name: Audit only original source aggregate sensor selection
        run: |
          python -m scripts.audit_payoff_b_shearwater_device_allocation \
            --output outputs/payoff_b_shearwater_device_allocation.json
      - name: Archive grouped capture results, never animal locations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-shearwater-assigned-device-source-audit
          path: outputs/payoff_b_shearwater_device_allocation.json
          if-no-files-found: warn
