name: payoff-b-v8-primary

on:
  push:
    branches:
      - feature/payoff-b-v8-primary-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_primary.R"
      - ".github/workflows/payoff-b-v8-primary.yml"
      - "docs/PAYOFF_B_V8_PREDICTIVE_CONNECTIVITY_DEGRADATION_CONTRACT_20261005.md"
      - "docs/PAYOFF_B_V8_DEPENDENCY_CORRECTION_20261005.md"

jobs:
  v8-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run corrected V8 primary environmental analysis
        run: Rscript analysis/movement_phenology/payoff_b_v8_primary.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-primary
          path: |
            outputs/payoff_b_v8_primary_summary.csv
            outputs/payoff_b_v8_primary_unique_pairs.csv
            outputs/payoff_b_v8_primary_species_means.csv
            outputs/payoff_b_v8_primary_pair_species_incidence.csv
            outputs/payoff_b_v8_primary_bootstrap.csv
            outputs/payoff_b_v8_primary_status.csv
          if-no-files-found: warn
