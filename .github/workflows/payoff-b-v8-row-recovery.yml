name: PAYOFF-B V8 original row-output recovery

on:
  pull_request:
    paths:
      - ".github/workflows/payoff-b-v8-row-recovery.yml"
      - "scripts/audit_payoff_b_v8_restored_rows.py"
      - "tests/test_payoff_b_v8_restored_rows.py"
      - "data/payoff_b_v8_row_archive_provenance_20261013.json"
      - "submission/AMNAT_V4_V8_ROW_REPRODUCIBILITY_20261013.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  immutable-original-v8-row-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run network-free registered formula/identity guards
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_payoff_b_v8_restored_rows.py
      - name: Independently verify original artifact ID and GitHub-reported ZIP digest
        env:
          GH_AUDIT_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          config=json.loads(Path("data/payoff_b_v8_row_archive_provenance_20261013.json").read_text())
          for item in config["historical_artifacts"]:
              url="https://api.github.com/repos/zuizui0223/payoff/actions/runs/"+str(item["run_id"])+"/artifacts"
              request=Request(url,headers={
                  "Authorization":"Bearer "+os.environ["GH_AUDIT_TOKEN"],
                  "Accept":"application/vnd.github+json",
                  "X-GitHub-Api-Version":"2022-11-28"
              })
              with urlopen(request,timeout=60) as h:
                  v=json.load(h)
              original=[a for a in v["artifacts"] if a["id"]==item["artifact_id"]
                        and a["name"]==item["name"] and not a["expired"]]
              if len(original)!=1:
                  raise SystemExit("EXACT_FROZEN_ARTIFACT_NOT_FOUND: "+item["role"])
              if original[0].get("digest")!="sha256:"+item["sha256_archive"]:
                  raise SystemExit("ORIGINAL_ARCHIVE_DIGEST_DRIFT: "+item["role"])
              print("CERTIFIED_ORIGINAL",item["role"],item["artifact_id"],
                    item["sha256_archive"])
          PY
      - name: Restore original 2026-10-05 environmental pair and bootstrap outputs
        uses: actions/download-artifact@v4
        with:
          run-id: 37285260343
          repository: zuizui0223/payoff
          github-token: ${{ github.token }}
          name: payoff-b-v8-primary
          path: outputs/v8_original_artifacts/environment
      - name: Restore original 2026-10-05 bird-transfer rows and bootstraps
        uses: actions/download-artifact@v4
        with:
          run-id: 37289801143
          repository: zuizui0223/payoff
          github-token: ${{ github.token }}
          name: payoff-b-v8-downstream-transfer-primary
          path: outputs/v8_original_artifacts/transfer
      - name: Restore original 2026-10-05 structural-null and permutation outputs
        uses: actions/download-artifact@v4
        with:
          run-id: 37291407274
          repository: zuizui0223/payoff
          github-token: ${{ github.token }}
          name: payoff-b-v8-transfer-structural-null
          path: outputs/v8_original_artifacts/structural
      - name: Verify exact upstream published-data blob, without committing or uploading raw RDS
        run: |
          mkdir -p "$RUNNER_TEMP/payoff_b_v8_original"
          curl --fail --location --retry 3 --max-time 180 \
            "https://raw.githubusercontent.com/br-amaral/BirdMigrationSpeed/62c58d77c2028bd863dfe3697b0d9cf29ceaeab0/data/final.rds" \
            -o "$RUNNER_TEMP/payoff_b_v8_original/final.rds"
          echo "Source original Git blob: $(git hash-object "$RUNNER_TEMP/payoff_b_v8_original/final.rds")"
          test "$(git hash-object "$RUNNER_TEMP/payoff_b_v8_original/final.rds")" = \
            "f1c9e63a377bb96152c573081e7c482cfe49ebc3"
      - name: Independent frozen-row arithmetic and bootstrap quantile verification
        run: |
          mkdir -p outputs/v8_row_recovery
          python scripts/audit_payoff_b_v8_restored_rows.py \
            --artifacts outputs/v8_original_artifacts \
            --source-rds "$RUNNER_TEMP/payoff_b_v8_original/final.rds" \
            --receipt outputs/v8_row_recovery/independent_restoration_receipt.json
          cp -R outputs/v8_original_artifacts outputs/v8_row_recovery/original_20261005_outputs
          cp data/payoff_b_v8_row_archive_provenance_20261013.json \
            outputs/v8_row_recovery/locked_manifest.json
      - name: Stop fake causal or submission-ready status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/v8_row_recovery/independent_restoration_receipt.json")
          data=json.loads(p.read_text())
          assert data["status"]=="FROZEN_V8_ROW_LEVEL_ARTIFACTS_RESTORED_AND_ARITHMETIC_VERIFIED"
          assert data["full_raw_R_bootstrap_replay"] is False
          assert data["submission_ready"] is False
          assert data["individual_perception_or_demographic_fitness_identified"] is False
          assert data["source_rds"]["source_content_checked"] is True
          print("INTERNAL_ROW_LEVEL_RECOVERY_PASS / ANONYMOUS_SUBMISSION_HOLD")
          PY
      - name: Upload original frozen row-output recovery as INTERNAL scientific receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-20261005-original-row-archive-internal-NOT-ANONYMOUS
          path: outputs/v8_row_recovery/
          if-no-files-found: warn
