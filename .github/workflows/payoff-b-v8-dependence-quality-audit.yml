name: payoff-b-v8-dependence-quality-audit

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_dependence_quality_audit.R"
      - "analysis/movement_phenology/payoff_b_v8_primary.R"
      - "docs/PAYOFF_B_V8_DEPENDENCE_QUALITY_AUDIT_LOCK_20261005.md"
      - ".github/workflows/payoff-b-v8-dependence-quality-audit.yml"

jobs:
  v8-dependence-quality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run V8 dependence and measurement-quality audit
        run: Rscript analysis/movement_phenology/payoff_b_v8_dependence_quality_audit.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-dependence-quality-audit
          path: |
            outputs/payoff_b_v8_audit_*.csv
            outputs/payoff_b_v8_dependence_quality_audit_status.csv
          if-no-files-found: error
