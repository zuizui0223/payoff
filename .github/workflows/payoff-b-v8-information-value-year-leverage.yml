name: payoff-b-v8-information-value-year-leverage

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_information_value_year_leverage.R"
      - ".github/workflows/payoff-b-v8-information-value-year-leverage.yml"

jobs:
  year-leverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run information-value calendar-year leverage test
        run: Rscript analysis/movement_phenology/payoff_b_v8_information_value_year_leverage.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-information-value-year-leverage
          path: |
            outputs/payoff_b_v8_information_value_year_leverage.csv
            outputs/payoff_b_v8_information_value_year_leverage_summary.csv
          if-no-files-found: error
