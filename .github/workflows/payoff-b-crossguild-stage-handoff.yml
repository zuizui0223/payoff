name: payoff-b-crossguild-exploratory-stage-handoff

on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/run_payoff_b_crossguild_timing_handoff.py"
      - "tests/test_payoff_b_crossguild_timing_handoff.py"
      - "docs/PAYOFF_B_CROSSGUILD_TIMING_HANDOFF_CONTRACT_20261019.md"
      - ".github/workflows/payoff-b-crossguild-stage-handoff.yml"
  workflow_dispatch:

jobs:
  per-system-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        system: [stork, woodcock_argos, white_fronted_goose, curlew, dabbling_ducks]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify independence and censoring failure gates on synthetic tracks
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_crossguild_timing_handoff.py
      - name: Re-run source checksums, exact frozen cohort identity and exploratory timing slopes
        run: |
          python -m scripts.run_payoff_b_crossguild_timing_handoff \
            --system ${{ matrix.system }} \
            --out outputs/payoff_b_crossguild_timing
      - name: Publish aggregate descriptive estimates, never raw tracks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-crossguild-exploratory-${{ matrix.system }}
          path: outputs/payoff_b_crossguild_timing/
          if-no-files-found: warn
