name: payoff-b-v4-general-actionability-boundary

on:
  push:
    branches:
      - analysis/payoff-b-goose-staging-calendar-null-20261008
    paths:
      - 'src/general_exponential_actionability.py'
      - 'tests/test_general_exponential_actionability.py'
      - '.github/workflows/payoff-b-v4-general-actionability-boundary.yml'
  pull_request:
    paths:
      - 'src/general_exponential_actionability.py'
      - 'tests/test_general_exponential_actionability.py'
      - '.github/workflows/payoff-b-v4-general-actionability-boundary.yml'

jobs:
  generalized-canonical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated pytest
        run: python -m pip install pytest
      - name: Compare canonical and generalized decision-time optima
        run: python -m pytest -q tests/test_general_exponential_actionability.py tests/test_actionability_balance.py
