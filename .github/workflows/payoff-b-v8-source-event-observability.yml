name: payoff-b-v8-source-event-observability

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_source_event_observability_audit.R"
      - ".github/workflows/payoff-b-v8-source-event-observability.yml"

jobs:
  source-event-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run source-event observability boundary audit
        run: Rscript analysis/movement_phenology/payoff_b_v8_source_event_observability_audit.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-source-event-observability
          path: |
            outputs/payoff_b_v8_source_event_observability_year_rows.csv
            outputs/payoff_b_v8_source_event_observability_period.csv
            outputs/payoff_b_v8_source_event_observability_units.csv
            outputs/payoff_b_v8_source_event_observability_pairs.csv
            outputs/payoff_b_v8_source_event_observability_species.csv
            outputs/payoff_b_v8_source_event_observability_summary.csv
          if-no-files-found: error
