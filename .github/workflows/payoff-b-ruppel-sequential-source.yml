name: PAYOFF-B Ruppel 2023 original Figshare source admission

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-ruppel-sequential-decisions-source-20261119
    paths:
      - '.github/workflows/payoff-b-ruppel-sequential-source.yml'
      - 'scripts/payoff_b_ruppel_figshare_source_gate.py'
      - 'tests/test_payoff_b_ruppel_figshare_source_gate.py'
      - 'scripts/payoff_b_ruppel_rdata_source_gate.py'
      - 'tests/test_payoff_b_ruppel_rdata_source_gate.py'
      - 'scripts/payoff_b_ruppel_original_RData_schema.R'
      - 'scripts/payoff_b_ruppel_native_schema_receipt.py'
      - 'tests/test_payoff_b_ruppel_native_schema_receipt.py'
      - 'scripts/payoff_b_ruppel_original_decision_join.R'
      - 'scripts/payoff_b_ruppel_join_source_receipt.py'
      - 'tests/test_payoff_b_ruppel_join_source_receipt.py'
      - 'scripts/payoff_b_ruppel_GFS_issued_forecast_gate.py'
      - 'tests/test_payoff_b_ruppel_GFS_issued_forecast_gate.py'
      - 'data/payoff_b_ruppel_GFS_2019_2021_forecast_source_gate_20261119.json'
      - 'docs/PAYOFF_B_RUPPEL_GFS_ISSUE_TIME_SOURCE_GATE_20261119.md'
      - 'docs/PAYOFF_B_RUPPEL_NATIVE_JOIN_PREFIT_20261119.md'
      - 'docs/PAYOFF_B_RUPPEL_RDATA_SOURCE_ESCALATION_20261119.md'
      - 'docs/PAYOFF_B_RUPPEL_SEQUENTIAL_SOURCE_CONTRACT_20261119.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  original-figshare-public-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded original-data reader dependencies
        run: python -m pip install --disable-pip-version-check requests pytest pandas pyreadr
      - name: Validate schema / ownership / HTTP hold without model fitting
        run: python -m pytest -q tests/test_payoff_b_ruppel_figshare_source_gate.py tests/test_payoff_b_ruppel_rdata_source_gate.py
      - name: Inspect only provider original Figshare public source metadata and bounded small tables
        run: |
          python -m scripts.payoff_b_ruppel_figshare_source_gate \
            --output outputs/payoff_b_ruppel_figshare_source_receipt.json
      - name: Obtain exact original public Figshare 2023 analysis-data ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs/ruppel_original
          curl -fLsS --retry 3 --retry-all-errors --max-time 90 \
            'https://figshare.com/ndownloader/files/38968813' \
            -o outputs/ruppel_original/rsos221420_si_002.zip
          test "$(stat -c%s outputs/ruppel_original/rsos221420_si_002.zip)" = "100303"
          printf '%s  %s\n' \
            '0ef08e19104aaceff5ef2700c324a094c49cbe2cd24ca198e3853b656d7744c6' \
            'outputs/ruppel_original/rsos221420_si_002.zip' | sha256sum -c -
      - name: Read original RData objects and R code references, output aggregate schema only
        run: |
          PAYOFF_RUPPEL_2023_ORIGINAL_ZIP=outputs/ruppel_original/rsos221420_si_002.zip \
            python -m pytest -q tests/test_payoff_b_ruppel_rdata_source_gate.py
          python -m scripts.payoff_b_ruppel_rdata_source_gate \
            --original-zip outputs/ruppel_original/rsos221420_si_002.zip \
            --output outputs/payoff_b_ruppel_RData_source_receipt.json
      - name: Install native R only for original Figshare RData source objects
        shell: bash
        run: |
          if ! command -v Rscript >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base-core
          fi
          Rscript --version
      - name: Native R load original RData and write field metadata without animal rows
        env:
          PAYOFF_RUPPEL_NATIVE_SCHEMA_CSV: outputs/ruppel_original/native_source_column_metadata.csv
        run: |
          Rscript scripts/payoff_b_ruppel_original_RData_schema.R \
            outputs/ruppel_original/rsos221420_si_002.zip \
            "$PAYOFF_RUPPEL_NATIVE_SCHEMA_CSV"
          python -m pytest -q tests/test_payoff_b_ruppel_native_schema_receipt.py
          python -m scripts.payoff_b_ruppel_native_schema_receipt \
            --native-schema-csv "$PAYOFF_RUPPEL_NATIVE_SCHEMA_CSV" \
            --output outputs/payoff_b_ruppel_native_source_grain.json
      - name: Verify original same-bird departure risk, route, landing timing keys (no effect fit)
        run: |
          Rscript scripts/payoff_b_ruppel_original_decision_join.R \
            outputs/ruppel_original/rsos221420_si_002.zip \
            outputs/ruppel_original/decision_join_metrics.csv
          python -m pytest -q tests/test_payoff_b_ruppel_join_source_receipt.py
          python -m scripts.payoff_b_ruppel_join_source_receipt \
            --original-aggregate-csv outputs/ruppel_original/decision_join_metrics.csv \
            --output outputs/payoff_b_ruppel_individual_decision_join.json
      - name: Check archived GFS 2019–21 predeparture forecast issue-time gate (NO forecast bytes accessed)
        run: |
          python -m pytest -q tests/test_payoff_b_ruppel_GFS_issued_forecast_gate.py
          python -m scripts.payoff_b_ruppel_GFS_issued_forecast_gate \
            --output outputs/payoff_b_ruppel_GFS_issue_time_source_gate.json
      - name: Save public metadata and aggregate-only source feasibility, no bird rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-ruppel-figshare-source-only-20261119
          path: |
            outputs/payoff_b_ruppel_figshare_source_receipt.json
            outputs/payoff_b_ruppel_RData_source_receipt.json
            outputs/payoff_b_ruppel_native_source_grain.json
            outputs/payoff_b_ruppel_individual_decision_join.json
            outputs/payoff_b_ruppel_GFS_issue_time_source_gate.json
          if-no-files-found: warn
