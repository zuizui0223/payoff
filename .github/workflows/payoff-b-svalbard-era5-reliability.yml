name: payoff-b Svalbard goose ERA5 reliability

concurrency:
  group: payoff-b-svalbard-era5-reliability-${{ github.ref_name }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/svalbard_barnacle_phase_error_era5_registration_20260924.json'
      - 'src/barnacle_phase_error_calibration.py'
      - 'scripts/calibrate_svalbard_phase_error_era5.py'
      - '.github/workflows/payoff-b-svalbard-era5-reliability.yml'

permissions:
  contents: read
  actions: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reliability dependencies
        run: >
          python -m pip install --disable-pip-version-check
          -e ".[test,empirical]" pandas scipy requests

      - name: Test shared barnacle reliability helpers
        run: pytest -q tests/test_barnacle_phase_error_calibration.py

      - name: Download frozen Svalbard source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/source
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10699807795/zip" \
            -o outputs/svalbard_source.zip
          echo "71f8a902f59b0e43012eb18e2cbe3b7b21d4679b6a608793c73360be00b54161  outputs/svalbard_source.zip" | sha256sum -c -
          unzip -q outputs/svalbard_source.zip \
            stage3_svalbard_goose_regions.csv \
            stage3_svalbard_goose_stopovers.csv \
            stage3_svalbard_goose_power_gdd_onsets.csv \
            -d outputs/source

      - name: Run preregistered Svalbard ERA5 replication
        run: >
          python scripts/calibrate_svalbard_phase_error_era5.py
          --source-dir outputs/source
          --registration-json data/svalbard_barnacle_phase_error_era5_registration_20260924.json
          --output-dir outputs/svalbard_era5
          --receipt-output outputs/svalbard_era5_reliability_receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-svalbard-era5-reliability
          path: |
            outputs/svalbard_era5/*.csv
            outputs/svalbard_era5_reliability_receipt.json
            data/svalbard_barnacle_phase_error_era5_registration_20260924.json
