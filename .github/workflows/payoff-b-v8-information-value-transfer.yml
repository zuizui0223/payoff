name: payoff-b-v8-information-value-transfer

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_information_value_transfer_diagnostic.R"
      - ".github/workflows/payoff-b-v8-information-value-transfer.yml"

jobs:
  information-value-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run posthoc information-value transfer diagnostic
        run: Rscript analysis/movement_phenology/payoff_b_v8_information_value_transfer_diagnostic.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-information-value-transfer
          path: |
            outputs/payoff_b_v8_information_value_transfer_rows.csv
            outputs/payoff_b_v8_information_value_transfer_summary.csv
            outputs/payoff_b_v8_information_value_transfer_bootstrap.csv
            outputs/payoff_b_v8_information_value_transfer_permutation.csv
          if-no-files-found: error
