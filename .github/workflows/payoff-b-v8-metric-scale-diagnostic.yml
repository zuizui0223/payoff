name: payoff-b-v8-metric-scale-diagnostic

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_metric_scale_diagnostic.R"
      - ".github/workflows/payoff-b-v8-metric-scale-diagnostic.yml"

jobs:
  metric-scale-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run V8 metric-scale diagnostic
        run: Rscript analysis/movement_phenology/payoff_b_v8_metric_scale_diagnostic.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-metric-scale-diagnostic
          path: |
            outputs/payoff_b_v8_metric_scale_pairs.csv
            outputs/payoff_b_v8_metric_scale_summary.csv
            outputs/payoff_b_v8_metric_scale_forecast_skill_summary.csv
            outputs/payoff_b_v8_metric_scale_bird_rows.csv
            outputs/payoff_b_v8_metric_scale_bird_summary.csv
            outputs/payoff_b_v8_metric_scale_status.csv
          if-no-files-found: error
