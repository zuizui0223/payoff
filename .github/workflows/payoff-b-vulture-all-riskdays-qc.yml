name: payoff-b-new-vulture-all-stationary-riskdays
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_egyptian_vulture_fullrisk.py"
      - "tests/test_payoff_b_egyptian_vulture_fullrisk.py"
      - "docs/PAYOFF_B_UNOPENED_VULTURE_RISKSET_GATE_20261022.md"
      - ".github/workflows/payoff-b-vulture-all-riskdays-qc.yml"
jobs:
  threatened-source-riskset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test fixed source identity, overlap and API gates
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_egyptian_vulture_fullrisk.py
      - name: Calculate unpublished-source movement risk days without weather
        run: |
          python -m scripts.qc_payoff_b_egyptian_vulture_fullrisk \
            --out outputs/payoff_b_new_vulture_riskday
      - name: Archive only aggregate results for protected bird source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-public-vulture-riskday-only
          path: outputs/payoff_b_new_vulture_riskday/
          if-no-files-found: warn
