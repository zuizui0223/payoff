name: payoff-b-stationary-control-hourly-bracket
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_stationary_case_controls.py"
      - "tests/test_payoff_b_stationary_case_controls.py"
      - "docs/PAYOFF_B_STATIONARY_CONTROL_GATE_20261019.md"
      - ".github/workflows/payoff-b-stationary-control-hourly-bracket.yml"
jobs:
  source-qc:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        system: [stork, white_fronted_goose, curlew]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synthetic stationary and prior-control tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_payoff_b_stationary_case_controls.py
      - name: Rebuild original source, matched controls and time brackets
        run: |
          python -m scripts.qc_payoff_b_stationary_case_controls --system ${{ matrix.system }} --out outputs/payoff_b_stationary_control
      - name: Archive only aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-stationary-bracket-${{ matrix.system }}
          path: outputs/payoff_b_stationary_control/
          if-no-files-found: warn
