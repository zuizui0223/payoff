name: payoff-b-v8-mandatory-sensitivity

on:
  push:
    branches:
      - analysis/payoff-b-v8-sensitivity-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_mandatory_sensitivity.R"
      - "analysis/movement_phenology/payoff_b_v8_primary.R"
      - "docs/PAYOFF_B_V8_MANDATORY_SENSITIVITY_IMPLEMENTATION_LOCK_20261005.md"
      - ".github/workflows/payoff-b-v8-mandatory-sensitivity.yml"

jobs:
  v8-mandatory-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run frozen V8 mandatory sensitivities
        run: Rscript analysis/movement_phenology/payoff_b_v8_mandatory_sensitivity.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-mandatory-sensitivity
          path: |
            outputs/payoff_b_v8_mandatory_sensitivity_summary.csv
            outputs/payoff_b_v8_s1_fisher_z_pairs.csv
            outputs/payoff_b_v8_s2_complete_pairs.csv
            outputs/payoff_b_v8_s3_target_species_means.csv
            outputs/payoff_b_v8_s4_distance_pairs.csv
            outputs/payoff_b_v8_s5_migration_distance_species.csv
            outputs/payoff_b_v8_s6_loo_species.csv
            outputs/payoff_b_v8_s7_raw_pairs.csv
            outputs/payoff_b_v8_s8_alt7_pairs.csv
          if-no-files-found: error
