name: PAYOFF-B Scotland measured caterpillar mass window
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-scotland-true-mass-gate-20261116
    paths:
      - "scripts/payoff_b_scotland_measured_mass_window.py"
      - "tests/test_payoff_b_scotland_measured_mass_window.py"
      - ".github/workflows/payoff-b-scotland-measured-mass.yml"
permissions:
  contents: read
jobs:
  original-mass-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed test and numerical prerequisites
        run: python -m pip install pytest numpy openpyxl
      - name: Check synthetic source and mass-censor tests
        run: python -m pytest -q tests/test_payoff_b_scotland_measured_mass_window.py
      - name: Evaluate verified EIDC original mass lower/upper heldout tests
        run: python -m scripts.payoff_b_scotland_measured_mass_window --output outputs/scotland/measured_mass_LOYO_LOSO.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-scotland-original-mass-source-and-fitness
          path: outputs/scotland/measured_mass_LOYO_LOSO.json
          if-no-files-found: warn
