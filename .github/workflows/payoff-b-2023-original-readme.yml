name: PAYOFF-B original Dryad 2023 README timing definitions
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-2023-readme-timing-definition-20261115
    paths:
      - "scripts/payoff_b_2023_original_readme_timing.py"
      - ".github/workflows/payoff-b-2023-original-readme.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.payoff_b_2023_original_readme_timing --output outputs/dryad/2023_original_readme_timing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-2023-original-readme-timing
          path: outputs/dryad/2023_original_readme_timing.json
          if-no-files-found: warn
