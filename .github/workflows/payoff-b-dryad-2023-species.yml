name: PAYOFF-B original 2023 species inclusion audit
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-2023-species-filter-audit-20261115
    paths:
      - "scripts/payoff_b_2023_species_include_audit.py"
      - ".github/workflows/payoff-b-dryad-2023-species.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install openpyxl
      - run: python -m scripts.payoff_b_2023_species_include_audit --output outputs/dryad/2023_species_include_audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-2023-species-include-audit
          path: outputs/dryad/2023_species_include_audit.json
          if-no-files-found: warn
