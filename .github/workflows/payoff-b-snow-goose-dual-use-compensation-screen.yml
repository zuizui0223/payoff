name: PAYOFF-B snow goose dual-use compensation screen

on:
  push:
    branches:
      - analysis/payoff-b-snow-goose-dual-use-compensation-screen-20260930
    paths:
      - 'src/snow_goose_dual_use_screen.py'
      - 'tests/test_snow_goose_dual_use_screen.py'
      - 'tests/test_snow_goose_dual_use_screen_integration.py'
      - 'scripts/payoff_b_greater_snow_goose_dual_use_compensation_screen.py'
      - 'data/payoff_b_greater_snow_goose_dual_use_compensation_screen_20260930.json'
      - '.github/workflows/payoff-b-snow-goose-dual-use-compensation-screen.yml'
  pull_request:
    paths:
      - 'src/snow_goose_dual_use_screen.py'
      - 'tests/test_snow_goose_dual_use_screen.py'
      - 'scripts/payoff_b_greater_snow_goose_dual_use_compensation_screen.py'
      - 'data/payoff_b_greater_snow_goose_dual_use_compensation_screen_20260930.json'
      - '.github/workflows/payoff-b-snow-goose-dual-use-compensation-screen.yml'
  workflow_dispatch:

concurrency:
  group: payoff-b-snow-goose-dual-use-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test,empirical]'
      - run: >
          python -m pytest -q
          tests/test_snow_goose_dual_use_screen.py
          tests/test_snow_goose_dual_use_screen_integration.py
      - run: python scripts/payoff_b_greater_snow_goose_dual_use_compensation_screen.py --help
