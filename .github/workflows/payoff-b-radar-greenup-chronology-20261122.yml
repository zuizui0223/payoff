name: PAYOFF-B radar spring-greenup chronology source-only

on:
  push:
    branches:
      - analysis/payoff-b-radar-greenup-chronology-20261122
  workflow_dispatch:

jobs:
  source-chronology:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - name: Install regression-test and finite-matrix dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy
      - name: Test source-only chronology classifications and sampling
        run: pytest -q -rs tests/test_payoff_b_radar_greenup_chronology_20261122.py
      - name: Reacquire Figshare source using original pinned bytes (NO original upload)
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from scripts.payoff_b_radar_source_gate_20261122 import bounded_download
          original_id=47109769
          expected="1751ca4cd523d632368ba7fbb27987c2d6c1cc4c1a9c75b8c67255476d799900"
          raw=bounded_download(f"https://ndownloader.figshare.com/files/{original_id}")
          if sha256(raw).hexdigest()!=expected:
              raise SystemExit("Original source checksum mismatch")
          location=Path("outputs/private_original_rdata")
          location.mkdir(parents=True,exist_ok=True)
          (location/"data_2003_2018.Rda").write_bytes(raw)
          print("Verified Figshare source SHA256 and original byte length",len(raw))
          PY
      - name: Extract only registered fields to private working directory
        run: |
          Rscript scripts/payoff_b_radar_greenup_extract_private.R \
            outputs/private_original_rdata/data_2003_2018.Rda \
            outputs/private_original_rdata/private_radar_model.csv
      - name: Compute original-site-year source chronology, not animal cue use
        run: |
          python scripts/payoff_b_radar_greenup_chronology_20261122.py \
            --input outputs/private_original_rdata/private_radar_model.csv \
            --contract data/payoff_b_radar_greenup_chronology_contract_20261122.json \
            --output outputs/payoff_b_radar_greenup_chronology_20261122.json
          python - <<'PY'
          import json
          from pathlib import Path
          source=Path("outputs/payoff_b_radar_greenup_chronology_20261122.json")
          z=json.loads(source.read_text())
          assert z["status"]=="SOURCE_CHRONOLOGY_COMPLETED_NOT_ANIMAL_INFORMATION"
          assert z["n_original_station_years"]==833
          assert z["n_complete_station_years"]==828
          assert z["n_stations"]==53
          assert z["n_years"]==16
          assert z["individual_bird_information_or_causal_cue_use_estimated"] is False
          assert z["original_location_rows_exported"] is False
          assert z["no_ebird"] is True
          assert len(z["annual_aggregate_only"])==16
          assert not any("site" in x for x in z["annual_aggregate_only"])
          print("SOURCE_CHRONOLOGY_SCHEMA_AND_PROVENANCE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-radar-greenup-chronology-derived-20261122
          path: outputs/payoff_b_radar_greenup_chronology_20261122.json
