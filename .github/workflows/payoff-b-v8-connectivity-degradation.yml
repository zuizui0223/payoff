name: PAYOFF-B V8 predictive-connectivity degradation

on:
  push:
    branches:
      - feature/payoff-b-v8-connectivity-degradation-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_predictive_connectivity_degradation.R"
      - ".github/workflows/payoff-b-v8-connectivity-degradation.yml"
  workflow_dispatch:

jobs:
  run-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Verify R analysis dependency
        run: |
          Rscript -e 'stopifnot(requireNamespace("nlme", quietly = TRUE))'

      - name: Download frozen Amaral source
        run: |
          mkdir -p outputs
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/br-amaral/BirdMigrationSpeed/62c58d77c2028bd863dfe3697b0d9cf29ceaeab0/data/final.rds" \
            -o outputs/amaral_final_frozen.rds
          sha256sum outputs/amaral_final_frozen.rds | tee outputs/amaral_final_frozen.sha256

      - name: Run frozen V8 analysis
        shell: bash
        run: |
          set -euo pipefail
          Rscript analysis/movement_phenology/payoff_b_v8_predictive_connectivity_degradation.R \
            | tee outputs/payoff_b_v8_console.txt

      - name: Upload V8 outputs
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-connectivity-degradation
          path: |
            outputs/payoff_b_v8_connectivity_degradation_result.csv
            outputs/payoff_b_v8_connectivity_degradation_pairs.csv
            outputs/payoff_b_v8_connectivity_degradation_species.csv
            outputs/payoff_b_v8_console.txt
            outputs/amaral_final_frozen.sha256
