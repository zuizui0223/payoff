name: payoff-b landscape coevolution pilot

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-landscape-coevolution-pilot.yml

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Map explicit-landscape coordination barriers
        run: >
          python scripts/migration_phenology_landscape_coevolution.py
          --interaction-strengths 0,0.2,0.5,1.0
          --cost-biases=-0.08,0,0.08
          --climate-velocities 0.02,0.04,0.05
          --phenology-limits 1,2,4
          --base-cost 0.06
          --baseline-growth 0.30
          --patches 31
          --spatial-gradient 0.20
          --carrying-capacity 800
          --density-coefficient 0.30
          --steps 120
          --burn-in 30
          --mutation-step 0.2
          --max-migration-rate 1.0
          --max-phenology-rate 1.0
          --max-cycles 40
          --gap-tolerance 1e-8
          --output outputs/payoff_b_landscape_coevolution_pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-landscape-coevolution-pilot
          path: outputs/payoff_b_landscape_coevolution_pilot.csv
