name: payoff-b-v8-actuator-bridge

on:
  push:
    branches:
      - analysis/payoff-b-v8-transfer-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_actuator_bridge.R"
      - "analysis/movement_phenology/payoff_b_v8_primary.R"
      - "docs/PAYOFF_B_V8_ACTUATOR_BRIDGE_CONTRACT_20261005.md"
      - ".github/workflows/payoff-b-v8-actuator-bridge.yml"

jobs:
  v8-actuator-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run frozen V8 actuator bridge
        run: Rscript analysis/movement_phenology/payoff_b_v8_actuator_bridge.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-actuator-bridge
          path: |
            outputs/payoff_b_v8_actuator_bridge_summary.csv
            outputs/payoff_b_v8_actuator_bridge_rows.csv
            outputs/payoff_b_v8_actuator_bridge_loo.csv
            outputs/payoff_b_v8_actuator_bridge_bootstrap.csv
          if-no-files-found: error
