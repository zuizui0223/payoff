name: payoff-b-fourguild-source-fix-stationarity-audit
on:
  push:
    branches:
      - analysis/payoff-b-independent-tracking-registry-20261019
    paths:
      - "scripts/qc_payoff_b_riskday_fix_integrity.py"
      - "tests/test_payoff_b_riskday_fix_integrity.py"
      - "docs/PAYOFF_B_FOURGUILD_SOURCE_FIX_INTEGRITY_LOCK_20261022.md"
      - ".github/workflows/payoff-b-fourguild-source-fix-integrity.yml"
jobs:
  source-fix-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        system: [stork, white_fronted_goose, curlew, egyptian_vulture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test original GPS anchor source misclassification diagnostics
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_payoff_b_riskday_fix_integrity.py
      - name: Check all original source anchor-day GPS time and position fixes
        run: |
          python -m scripts.qc_payoff_b_riskday_fix_integrity \
            --system ${{ matrix.system }} \
            --out outputs/payoff_b_fourguild_fix_integrity
      - name: Publish aggregate-only sampling diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payoff-b-fix-integrity-${{ matrix.system }}
          path: outputs/payoff_b_fourguild_fix_integrity/
          if-no-files-found: warn
