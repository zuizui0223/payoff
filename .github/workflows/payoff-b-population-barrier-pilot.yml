name: payoff-b population barrier pilot

on:
  push:
    branches:
      - feature/payoff-b-migration-phenology-20260919
    paths:
      - .github/workflows/payoff-b-population-barrier-pilot.yml

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - name: Run 75-cell demographic barrier pilot
        run: >
          python scripts/migration_phenology_population_barrier_sweep.py
          --interaction-strengths 0,0.1,0.3,0.6,1.0
          --cost-biases=-0.08,-0.04,0,0.04,0.08
          --climate-velocities 0.02,0.04,0.06
          --steps 140
          --burn-in 20
          --mutation-step 0.1
          --max-rate 1.0
          --max-cycles 40
          --replicates 32
          --initial-population 50
          --carrying-capacity 100
          --density-coefficient 0.12
          --extinction-threshold 2
          --seed 20260920
          --output outputs/payoff_b_population_barrier_pilot.csv
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-population-barrier-pilot
          path: outputs/payoff_b_population_barrier_pilot.csv
