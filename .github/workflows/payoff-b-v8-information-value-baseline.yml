name: payoff-b-v8-information-value-baseline

on:
  push:
    branches:
      - audit/payoff-b-v8-dependence-quality-20261005
    paths:
      - "analysis/movement_phenology/payoff_b_v8_information_value_baseline_sensitivity.R"
      - ".github/workflows/payoff-b-v8-information-value-baseline.yml"

jobs:
  information-value-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Run climatology-baseline information-value sensitivity
        run: Rscript analysis/movement_phenology/payoff_b_v8_information_value_baseline_sensitivity.R
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-v8-information-value-baseline
          path: |
            outputs/payoff_b_v8_information_value_baseline_pairs.csv
            outputs/payoff_b_v8_information_value_baseline_summary.csv
            outputs/payoff_b_v8_information_value_baseline_exact.csv
            outputs/payoff_b_v8_information_value_baseline_species.csv
            outputs/payoff_b_v8_information_value_baseline_species_summary.csv
          if-no-files-found: error
