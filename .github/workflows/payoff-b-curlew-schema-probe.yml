name: PAYOFF-B curlew schema probe

on:
  push:
    paths:
      - "scripts/payoff_b_curlew_schema_probe.py"
      - ".github/workflows/payoff-b-curlew-schema-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/payoff_b_curlew_schema_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: payoff-b-curlew-schema-probe
          path: outputs/payoff_b_curlew_schema_probe.json
