name: PAYOFF-B V8 frozen environmental predictability change
on:
  workflow_dispatch:
  push:
    branches:
      - analysis/payoff-b-v8-frozen-pair-change-20261117
    paths:
      - "analysis/movement_phenology/payoff_b_v8_frozen_unique_pair_primary_20261117.R"
      - "analysis/movement_phenology/payoff_b_v8_frozen_sensitivities_20261117.R"
      - ".github/workflows/payoff-b-v8-frozen-primary.yml"
permissions:
  contents: read
jobs:
  v8-primary-original:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
      - name: Test source-independent algebra and duplicate-pair incidence
        run: Rscript analysis/movement_phenology/payoff_b_v8_frozen_unique_pair_primary_20261117.R --synthetic-only
      - name: Run preregistered 2002-2017 unique spatial pair environmental test
        run: Rscript analysis/movement_phenology/payoff_b_v8_frozen_unique_pair_primary_20261117.R
      - name: Run postprimary pre-listed sensitivities and separately label source-cell blocks
        run: Rscript analysis/movement_phenology/payoff_b_v8_frozen_sensitivities_20261117.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payoff-b-v8-frozen-spatial-pair-primary
          path: |
            outputs/payoff_b_v8_primary_summary.csv
            outputs/payoff_b_v8_unique_spatial_pairs.csv
            outputs/payoff_b_v8_species_exposure.csv
            outputs/payoff_b_v8_frozen_sensitivity_summary.csv
            outputs/payoff_b_v8_distance_moderator.csv
            outputs/payoff_b_v8_leave_one_species_out.csv
            outputs/payoff_b_v8_postopen_source_cell_blocks.csv
          if-no-files-found: warn
