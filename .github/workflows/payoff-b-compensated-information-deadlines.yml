name: PAYOFF-B compensated information deadlines

on:
  push:
    branches:
      - theory/payoff-b-compensated-deadline-cost-20260929
    paths:
      - 'src/compensated_information_deadline.py'
      - 'src/endogenous_information_timing.py'
      - 'src/state_dependent_information_deadline.py'
      - 'tests/test_compensated_information_deadline.py'
      - 'tests/test_endogenous_information_timing.py'
      - 'tests/test_state_dependent_information_deadline.py'
      - 'theory/COMPENSATED_INFORMATION_DEADLINES.md'
      - 'data/payoff_b_greater_snow_goose_compensation_anchor_20260929.json'
      - '.github/workflows/payoff-b-compensated-information-deadlines.yml'
  pull_request:
    paths:
      - 'src/compensated_information_deadline.py'
      - 'src/endogenous_information_timing.py'
      - 'src/state_dependent_information_deadline.py'
      - 'tests/test_compensated_information_deadline.py'
      - 'tests/test_endogenous_information_timing.py'
      - 'tests/test_state_dependent_information_deadline.py'
      - 'theory/COMPENSATED_INFORMATION_DEADLINES.md'
      - 'data/payoff_b_greater_snow_goose_compensation_anchor_20260929.json'
      - '.github/workflows/payoff-b-compensated-information-deadlines.yml'
  workflow_dispatch:

concurrency:
  group: payoff-b-compensated-deadline-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: >
          python -m pytest -q
          tests/test_compensated_information_deadline.py
          tests/test_endogenous_information_timing.py
          tests/test_state_dependent_information_deadline.py
