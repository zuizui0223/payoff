name: payoff-b-decision-time-forecast-gate

on:
  push:
    paths:
      - 'src/conditional_checkpoint_value.py'
      - 'src/decision_time_forecast_gate.py'
      - 'tests/test_conditional_checkpoint_value.py'
      - 'tests/test_decision_time_forecast_gate.py'
      - '.github/workflows/payoff-b-decision-time-forecast-gate.yml'
  pull_request:
    paths:
      - 'src/conditional_checkpoint_value.py'
      - 'src/decision_time_forecast_gate.py'
      - 'tests/test_conditional_checkpoint_value.py'
      - 'tests/test_decision_time_forecast_gate.py'
      - '.github/workflows/payoff-b-decision-time-forecast-gate.yml'

jobs:
  source-only-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_conditional_checkpoint_value.py tests/test_decision_time_forecast_gate.py
