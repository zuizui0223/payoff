[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payoff-trait-game"
version = "0.1.0"
description = "Evolutionary game bridge from shared-trait compromise to architecture differentiation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
submission = ["python-docx>=1.1"]
irg = ["numpy>=1.26", "scipy>=1.11"]
earthdata = ["pyproj>=3.6", "requests>=2.31", "pyshp>=2.3"]
empirical = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "requests>=2.31",
    "xarray>=2024.1",
    "netCDF4>=1.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
